<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunset OS - Spawn Selection</title>

    <!-- Fonturi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Tema Sunset adaptată pentru Spawn Screen */
            --highlight: #00e5ff; /* O nuanță mai vibrantă de cyan/bleu conform pozei */
            --highlight-glow: 0 0 20px rgba(0, 229, 255, 0.4);
            
            --bg-color: #0b0c10;
            --card-bg: rgba(20, 25, 35, 0.8);
            
            --font-title: 'Teko', sans-serif;
            --font-data: 'Rajdhani', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            /* Fundal noapte/întunecat simplu, conform pozei */
            background: radial-gradient(circle at center, #1a1c29 0%, #08090d 100%);
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-data);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Perspectiva a fost ștearsă de aici pentru a rezolva bug-ul de hit-testing 3D */
        }

        /* --- HEADER & FOOTER --- */
        .spawn-header {
            font-family: var(--font-title);
            font-size: 42px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .spawn-footer {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            margin-top: 40px;
            letter-spacing: 1px;
        }

        /* --- CARDS WRAPPER --- */
        .cards-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            /* transform-style: preserve-3d; a fost șters pentru a repara bug-ul de overlap invizibil */
            height: 350px;
            width: 100vw;
            max-width: 100%;
        }

        /* --- SPAWN CARD (Baza) --- */
        .spawn-card {
            width: 230px; /* L-am făcut puțin mai lat pentru proporții bune */
            height: 330px;
            background: linear-gradient(180deg, rgba(30,35,45,0.9) 0%, rgba(15,20,25,0.9) 100%);
            border-left: 1px solid rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            cursor: pointer;
            position: absolute; /* Le suprapunem și le aranjăm prin transformări */
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), 
                        opacity 0.4s, filter 0.4s, z-index 0s; /* Z-index cu 0s pentru a nu bloca hover la tranzitii */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            pointer-events: auto;
        }

        /* Linia decorativă foarte subtilă pe top */
        .spawn-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        /* Content Card */
        .card-icon {
            color: rgba(255,255,255,0.5);
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .card-icon svg { width: 45px; height: 45px; }

        .card-title {
            font-family: var(--font-title);
            font-size: 24px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.7);
            text-align: center;
            transition: 0.3s;
        }

        /* Butonul de jos */
        .spawn-btn {
            position: absolute;
            bottom: 25px;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.5);
            font-family: var(--font-title);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 6px 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            /* Pentru a nu da click direct pe el, clickul se face pe tot cardul */
            pointer-events: none; 
        }
        .spawn-btn svg { width: 12px; height: 12px; fill: currentColor; }

        /* =========================================
           STĂRILE 3D (Efectul Coverflow reconstruit inteligent)
           ========================================= */

        /* 1. Stânga Extremă */
        .spawn-card[data-pos="-2"] {
            transform: perspective(1000px) translateX(-480px) scale(0.7) rotateY(15deg);
            opacity: 0.4;
            z-index: 1;
        }
        
        /* 2. Stânga Lângă Centru */
        .spawn-card[data-pos="-1"] {
            transform: perspective(1000px) translateX(-250px) scale(0.85) rotateY(10deg);
            opacity: 0.7;
            z-index: 2;
        }

        /* 3. CENTRU (ACTIV/HOVERED) */
        .spawn-card[data-pos="0"] {
            transform: perspective(1000px) translateX(0) scale(1.05) rotateY(0deg);
            opacity: 1;
            z-index: 5;
            /* Gradient luminos care vine de sus, specific pozei tale */
            background: linear-gradient(180deg, rgba(0, 229, 255, 0.15) 0%, rgba(15,20,25,0.95) 60%);
            border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 20px 40px -20px rgba(0, 229, 255, 0.3);
        }

        /* 4. Dreapta Lângă Centru */
        .spawn-card[data-pos="1"] {
            transform: perspective(1000px) translateX(250px) scale(0.85) rotateY(-10deg);
            opacity: 0.7;
            z-index: 2;
        }

        /* 5. Dreapta Extremă */
        .spawn-card[data-pos="2"] {
            transform: perspective(1000px) translateX(480px) scale(0.7) rotateY(-15deg);
            opacity: 0.4;
            z-index: 1;
        }

        /* Extra pozitii in caz ca adaugi mai multe spawn-uri pe viitor */
        .spawn-card[data-pos="-3"] {
            transform: perspective(1000px) translateX(-700px) scale(0.6) rotateY(20deg);
            opacity: 0;
            z-index: 0;
            pointer-events: none;
        }
        .spawn-card[data-pos="3"] {
            transform: perspective(1000px) translateX(700px) scale(0.6) rotateY(-20deg);
            opacity: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* =========================================
           STILIZARE ELEMENTE CÂND CARDUL E ACTIV (Pe Centru)
           ========================================= */
        .spawn-card[data-pos="0"]::before {
            background: var(--highlight);
            box-shadow: var(--highlight-glow);
        }
        
        .spawn-card[data-pos="0"] .card-icon {
            color: var(--highlight);
        }
        
        .spawn-card[data-pos="0"] .card-title {
            color: #fff;
        }

        /* Butonul devine solid cyan */
        .spawn-card[data-pos="0"] .spawn-btn {
            background: var(--highlight);
            color: #000;
            box-shadow: var(--highlight-glow);
        }

        /* =========================================
           STARE LOCKED (Indisponibil)
           ========================================= */
        .spawn-card.locked {
            cursor: not-allowed;
        }
        
        .spawn-card.locked .card-icon {
            opacity: 0.5;
        }
        
        .spawn-card.locked .spawn-btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px; /* Mai pătrățos pt eroare */
        }
        
        .spawn-card.locked .spawn-btn svg {
            color: #ff2a2a; /* Icoana cu lacăt/block roșie ca în poză */
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* Chiar dacă pui mouse-ul pe el și ajunge pe centru, arată că e blocat */
        .spawn-card.locked[data-pos="0"] {
            background: linear-gradient(180deg, rgba(255, 42, 42, 0.05) 0%, rgba(15,20,25,0.9) 60%);
            border-color: rgba(255, 42, 42, 0.2);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .spawn-card.locked[data-pos="0"]::before {
            background: rgba(255, 42, 42, 0.5);
            box-shadow: none;
        }
        .spawn-card.locked[data-pos="0"] .card-icon {
            color: rgba(255, 255, 255, 0.5);
        }
        .spawn-card.locked[data-pos="0"] .spawn-btn {
            background: rgba(0,0,0,0.8);
            color: rgba(255,255,255,0.3);
            box-shadow: none;
        }


        /* Animație de selecție */
        @keyframes selectPulse {
            0% { transform: translateX(0) translateZ(20px) scale(1); }
            50% { transform: translateX(0) translateZ(20px) scale(0.95); }
            100% { transform: translateX(0) translateZ(20px) scale(1); }
        }
        .card-selected {
            animation: selectPulse 0.3s ease-out;
        }

    </style>
</head>
<body>

    <div class="spawn-header">Choose Your Location</div>

    <div class="cards-wrapper" id="cards-container">
        
        <!-- Card: Default Spawn -->
        <div class="spawn-card" onclick="selectCard(this, 'default')">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>
            </div>
            <div class="card-title">Default Spawn</div>
            <div class="spawn-btn">
                <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                SPAWN HERE
            </div>
        </div>

        <!-- Card: My House (Inițial pe centru) -->
        <div class="spawn-card" onclick="selectCard(this, 'house')">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/><circle cx="12" cy="12" r="3" fill="#000"/></svg>
            </div>
            <div class="card-title">My House (#7)</div>
            <div class="spawn-btn">
                <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                SPAWN HERE
            </div>
        </div>

        <!-- Card: Clan HQ (Locked) -->
        <div class="spawn-card locked" onclick="selectCard(this, 'clan')">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            </div>
            <div class="card-title">Clan HQ</div>
            <div class="spawn-btn">
                <!-- Icoana "Block" ca in a doua poza -->
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                NOT AVAILABLE
            </div>
        </div>

        <!-- Card: Last Location (Locked) -->
        <div class="spawn-card locked" onclick="selectCard(this, 'last')">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
            <div class="card-title">Last Location</div>
            <div class="spawn-btn">
                <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                NOT AVAILABLE
            </div>
        </div>

    </div>

    <div class="spawn-footer">Select a location to enter Los Santos</div>

    <script>
        const cards = Array.from(document.querySelectorAll('.spawn-card'));

        // Funcția de update a pozițiilor
        // centerIndex e indexul cardului care stă în mijloc
        function updateLayout(centerIndex) {
            cards.forEach((card, index) => {
                // Calculăm distanța relativă față de cardul central
                // ex: dacă centerIndex e 1, atunci cardul 0 e la -1, cardul 2 e la 1 etc.
                const relativePos = index - centerIndex;
                card.setAttribute('data-pos', relativePos);
            });
        }

        // Inițializare: Setăm al doilea card pe centru
        let currentIndex = 1; 
        updateLayout(currentIndex);

        // Evenimente de Hover
        cards.forEach((card, index) => {
            card.addEventListener('mouseenter', () => {
                // Când pui mouse-ul, cardul respectiv devine centrul noului layout
                currentIndex = index;
                updateLayout(currentIndex);
            });
        });

        // Funcția de Click (Alegere Locație)
        function selectCard(element, locationId) {
            // Dacă locația e blocată, ignorăm click-ul
            if(element.classList.contains('locked')) {
                console.log("Locație indisponibilă!");
                return;
            }

            // Animație vizuală de feedback pe cardul apăsat
            element.classList.remove('card-selected');
            void element.offsetWidth; // force reflow
            element.classList.add('card-selected');

            console.log(`Ai selectat să te spawnezi la: ${locationId}`);
            
            // Exemplu apel FiveM NUI:
            /*
            fetch(`https://${GetParentResourceName()}/spawnPlayer`, {
                method: 'POST',
                body: JSON.stringify({ spawnLoc: locationId })
            });
            */
        }
    </script>
</body>
</html>
