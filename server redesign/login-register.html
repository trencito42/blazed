<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Login & Identity Selector</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');

        :root {
            /* Design System Colors */
            --bg-base: rgba(10, 10, 15, 0.95); 
            --bg-panel: rgba(255, 255, 255, 0.03);
            --bg-hover: rgba(255, 255, 255, 0.08);
            --bg-input: rgba(0, 0, 0, 0.5);
            
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.4);
            
            /* Daca vrei fix portocaliul din poza ta, schimba aici in #ff6600 */
            --accent: #00ffcc; 
            --danger: #ff3366;
            
            --border: rgba(255, 255, 255, 0.1);
            --radius-lg: 16px;
            --radius-md: 8px;
            --transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background: url('https://placehold.co/1920x1080/1a1a24/1a1a24?text=Los+Santos+Background') no-repeat center center;
            background-size: cover;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; user-select: none;
        }

        /* Fundal Intunecat pentru focus pe centru */
        .overlay {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 1;
        }

        /* Cutia Principala Modal */
        .auth-wrapper {
            position: relative; z-index: 10;
            width: 480px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 45px 50px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- HEADER / LOGO --- */
        .auth-header {
            text-align: center; margin-bottom: 35px;
        }

        .auth-logo {
            width: 70px; height: 70px;
            margin: 0 auto 15px auto;
            color: var(--text-main);
        }
        .auth-logo svg { width: 100%; height: 100%; fill: currentColor; }

        .auth-title {
            font-size: 11px; font-weight: 800; color: var(--accent);
            text-transform: uppercase; letter-spacing: 3px; margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 11px; font-weight: 500; color: var(--text-muted);
        }

        /* --- TABS --- */
        .auth-tabs {
            display: flex; border-bottom: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1; background: none; border: none;
            padding: 15px 0; color: var(--text-muted);
            font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: var(--transition);
            border-bottom: 2px solid transparent; margin-bottom: -1px;
        }

        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        /* --- FORMS --- */
        .form-section { display: none; flex-direction: column; gap: 20px; animation: fadeIn 0.4s ease; }
        .form-section.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
        
        .form-input {
            width: 100%; background: var(--bg-input);
            border: none; border-bottom: 2px solid var(--border);
            color: var(--text-main); padding: 14px 15px;
            font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 600;
            outline: none; transition: var(--transition);
        }
        .form-input:focus { border-bottom-color: var(--accent); background: rgba(0,0,0,0.8); }

        /* Checkbox Custom */
        .checkbox-group {
            display: flex; align-items: center; gap: 10px; margin-top: 5px; cursor: pointer;
        }
        .checkbox-group input { display: none; }
        .checkbox-custom {
            width: 16px; height: 16px; border: 1px solid var(--border); border-radius: 4px;
            display: flex; align-items: center; justify-content: center; transition: var(--transition);
        }
        .checkbox-group input:checked + .checkbox-custom { background: var(--accent); border-color: var(--accent); }
        .checkbox-custom svg { width: 10px; height: 10px; stroke: #000; stroke-width: 3; fill: none; opacity: 0; transition: var(--transition); }
        .checkbox-group input:checked + .checkbox-custom svg { opacity: 1; }
        .checkbox-label { font-size: 11px; font-weight: 600; color: var(--text-muted); }

        /* Buton Principal */
        .btn-main {
            width: 100%; background: var(--accent); color: #000;
            border: none; border-radius: var(--radius-md); padding: 16px;
            font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: var(--transition);
            margin-top: 10px;
        }
        .btn-main:hover { box-shadow: 0 0 25px rgba(0, 255, 204, 0.4); transform: translateY(-2px); }

        /* --- SAVED IDENTITIES --- */
        .divider {
            position: relative; text-align: center; margin: 35px 0 25px 0;
        }
        .divider::before {
            content: ''; position: absolute; top: 50%; left: 0; right: 0;
            height: 1px; background: var(--border); z-index: 1;
        }
        .divider span {
            position: relative; z-index: 2; background: var(--bg-base);
            padding: 0 15px; font-size: 9px; font-weight: 800; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 2px;
        }

        .identities-list {
            display: flex; flex-direction: column; gap: 10px;
            max-height: 160px; overflow-y: auto; padding-right: 5px;
        }

        .identities-list::-webkit-scrollbar { width: 4px; }
        .identities-list::-webkit-scrollbar-track { background: transparent; }
        .identities-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .id-card {
            background: var(--bg-panel); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 12px;
            display: flex; align-items: center; gap: 15px;
            cursor: pointer; transition: var(--transition);
            position: relative; overflow: hidden;
        }

        .id-card:hover { background: var(--bg-hover); border-color: rgba(0, 255, 204, 0.3); transform: translateX(5px); }

        .id-avatar {
            width: 40px; height: 40px; border-radius: 6px;
            background: var(--bg-input); background-size: cover; background-position: center;
        }

        .id-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .id-name { font-size: 13px; font-weight: 800; color: var(--text-main); }
        .id-stats { font-size: 10px; font-weight: 700; color: var(--text-muted); display: flex; gap: 10px;}
        .id-stats span { color: var(--accent); }

        .id-delete {
            width: 24px; height: 24px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); transition: var(--transition);
        }
        .id-delete:hover { background: var(--danger); color: #fff; }
        .id-delete svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; fill: none; }

        /* Footer Server */
        .auth-footer {
            margin-top: 30px; text-align: center;
            font-size: 9px; font-weight: 800; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 2px;
        }

        /* Notificare */
        #notify {
            position: absolute; top: 30px; right: 30px; background: var(--accent); color: #000;
            padding: 15px 25px; border-radius: var(--radius-md); font-size: 12px; font-weight: 800; text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(0,255,204,0.4); transform: translateX(150%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }
        #notify.show { transform: translateX(0); }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div id="notify">Autentificare reușită!</div>

    <div class="auth-wrapper">
        
        <!-- Header / Logo -->
        <div class="auth-header">
            <div class="auth-logo">
                <!-- SVG Crown/Logo - inlocuieste cu logo-ul tau -->
                <svg viewBox="0 0 24 24"><path d="M2 22h20M7 21v-4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v4M22 7l-4.5 4L12 2 6.5 11 2 7l2 11h16z"></path></svg>
            </div>
            <div class="auth-title">Welcome to Los Santos</div>
            <div class="auth-subtitle">Enter the city. Your story starts here.</div>
        </div>

        <!-- Tab Controls -->
        <div class="auth-tabs">
            <button class="tab-btn active" id="btn-login" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" id="btn-register" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <form id="form-login" class="form-section active" onsubmit="handleAuth(event, 'login')">
            <div class="input-group">
                <label class="input-label">Username</label>
                <input type="text" class="form-input" id="log-user" required autocomplete="off">
            </div>
            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" class="form-input" id="log-pass" required>
            </div>
            
            <label class="checkbox-group">
                <input type="checkbox" id="save-acc" checked>
                <div class="checkbox-custom">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <span class="checkbox-label">Save this account for quick login</span>
            </label>

            <button type="submit" class="btn-main">Enter City</button>
        </form>

        <!-- Register Form -->
        <form id="form-register" class="form-section" onsubmit="handleAuth(event, 'register')">
            <div class="input-group">
                <label class="input-label">New Username</label>
                <input type="text" class="form-input" required autocomplete="off">
            </div>
            <div class="input-group">
                <label class="input-label">Email Address</label>
                <input type="email" class="form-input" required autocomplete="off">
            </div>
            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" class="form-input" required>
            </div>

            <button type="submit" class="btn-main">Create Account</button>
        </form>

        <!-- Saved Identities Section -->
        <div class="divider">
            <span>Saved Identities — Select to Enter</span>
        </div>

        <div class="identities-list" id="saved-list">
            <!-- Injectat prin JS -->
        </div>

        <!-- Footer -->
        <div class="auth-footer">
            XODO STUDIO — FiveM Roleplay
        </div>

    </div>

    <script>
        // --- Date Simulate (Acestea ar veni din KVP / LocalStorage in FiveM) ---
        let savedAccounts = [
            { id: 1, username: "trencito", level: 32, funds: "1,999,073,585", avatar: "https://placehold.co/100x100/1e1e1e/00ffcc?text=T" },
            { id: 2, username: "xodo_steve", level: 14, funds: "245,000", avatar: "https://placehold.co/100x100/1e1e1e/00ffcc?text=X" }
        ];

        // --- Logică Tab-uri ---
        function switchTab(tab) {
            document.getElementById('btn-login').classList.remove('active');
            document.getElementById('btn-register').classList.remove('active');
            document.getElementById('form-login').classList.remove('active');
            document.getElementById('form-register').classList.remove('active');

            document.getElementById('btn-' + tab).classList.add('active');
            document.getElementById('form-' + tab).classList.add('active');
        }

        // --- Logică Salvare/Login Formular ---
        function handleAuth(e, type) {
            e.preventDefault();
            
            if (type === 'login') {
                const user = document.getElementById('log-user').value;
                showNotify(`Conectare în curs pentru ${user}...`);
                // Aici faci fetch catre client.lua pentru verificare parola
            } else {
                showNotify("Cont creat cu succes!");
                setTimeout(() => switchTab('login'), 1500);
            }
        }

        // --- Randare Conturi Salvate ---
        function renderSavedAccounts() {
            const list = document.getElementById('saved-list');
            list.innerHTML = '';

            if (savedAccounts.length === 0) {
                list.innerHTML = `<div style="text-align:center; font-size:11px; color:var(--text-muted); padding:10px;">Nu ai niciun cont salvat.</div>`;
                return;
            }

            savedAccounts.forEach(acc => {
                const el = document.createElement('div');
                el.className = 'id-card';
                // Click pe tot cardul pentru auto-login
                el.onclick = (e) => {
                    if(!e.target.closest('.id-delete')) {
                        autoLogin(acc);
                    }
                };

                el.innerHTML = `
                    <div class="id-avatar" style="background-image: url('${acc.avatar}')"></div>
                    <div class="id-info">
                        <div class="id-name">${acc.username}</div>
                        <div class="id-stats">LVL ${acc.level} <span>FUNDS $${acc.funds}</span></div>
                    </div>
                    <div class="id-delete" title="Șterge cont salvat" onclick="removeAccount(${acc.id})">
                        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </div>
                `;
                list.appendChild(el);
            });
        }

        // --- Actiuni Conturi Salvate ---
        function autoLogin(acc) {
            document.getElementById('log-user').value = acc.username;
            // De obicei aici trimiti direct request de login la server fara sa ii mai ceri parola daca are token-ul valid
            showNotify(`Auto-Login pentru ${acc.username}...`);
        }

        function removeAccount(id) {
            savedAccounts = savedAccounts.filter(x => x.id !== id);
            renderSavedAccounts();
            // Aici trimiti catre Lua sa stearga KVP-ul / Token-ul din cache
        }

        // --- Notificari ---
        function showNotify(msg) {
            const el = document.getElementById('notify');
            el.innerText = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        // --- Initializare ---
        window.onload = () => {
            renderSavedAccounts();
        };

        // --- Integrare LUA (Optional) ---
        window.addEventListener('message', (event) => {
            if (event.data.action === "openAuth") {
                // Preia caracterele salvate din local storage/KVP
                savedAccounts = event.data.accounts || [];
                renderSavedAccounts();
            }
        });
    </script>
</body>
</html>
