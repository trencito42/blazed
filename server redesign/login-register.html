<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XODO RP - Authentication</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.4);
            --accent: #00ffcc; 
            --danger: #ff3366; 
            --success: #10b981;
            
            --bg-panel: rgba(5, 5, 8, 0.95);
            --border-glass: rgba(255, 255, 255, 0.1);
            
            --shadow-text: 0 4px 10px rgba(0, 0, 0, 0.9);
            --shadow-glow: 0 0 25px rgba(0, 255, 204, 0.4);
            
            --transition-snappy: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Montserrat', sans-serif;
            background: url('https://images.unsplash.com/photo-1605806616949-1e87b487bc2a?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover; overflow: hidden; user-select: none;
        }

        .overlay { position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.9) 100%); z-index: 0; }

        /* ==========================================================
           1. INTRO SCREEN ("PRESS ANY KEY")
           ========================================================== */
        .intro-screen {
            position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .intro-screen.hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }

        .brand-massive { font-size: 140px; font-weight: 900; font-style: italic; color: var(--text-main); text-transform: uppercase; letter-spacing: -5px; line-height: 0.8; text-shadow: var(--shadow-text); transform: skewX(-5deg); margin-bottom: 40px; }
        .brand-massive span { color: var(--accent); }
        
        .press-key { font-size: 16px; font-weight: 800; color: var(--text-main); text-transform: uppercase; letter-spacing: 4px; transform: skewX(-5deg); animation: pulse 2s infinite; display: flex; align-items: center; gap: 10px; }
        .press-key .key-btn { background: var(--text-main); color: #000; padding: 4px 10px; border-radius: 4px; font-weight: 900; font-style: normal; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ==========================================================
           2. AUTH PANEL (SIDEBAR)
           ========================================================== */
        .auth-container {
            position: absolute; top: 0; bottom: 0; left: -600px; /* Ascuns in stanga initial */
            width: 500px; background: var(--bg-panel); border-right: 2px solid var(--border-glass);
            z-index: 100; transform: skewX(-5deg) translateX(-50px);
            display: flex; flex-direction: column; padding: 60px 80px; box-sizing: border-box;
            box-shadow: 20px 0 50px rgba(0,0,0,0.9); transition: all 0.6s var(--transition-snappy);
        }

        /* Dupa ce apesi tasta, panoul intra in scena */
        .auth-container.active { left: -30px; transform: skewX(-5deg) translateX(0); }

        .auth-header { margin-bottom: 50px; display: flex; flex-direction: column; gap: 5px; }
        .auth-title { font-size: 42px; font-weight: 900; font-style: italic; color: var(--text-main); text-transform: uppercase; letter-spacing: -1px; text-shadow: var(--shadow-text); display: flex; align-items: center; gap: 10px; }
        .auth-subtitle { font-size: 12px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 3px; }

        /* Container pentru formulare (Slide trick) */
        .form-slider { position: relative; flex: 1; width: 100%; overflow: hidden; }
        .form-section {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; gap: 30px;
            transition: transform 0.4s var(--transition-snappy), opacity 0.3s ease;
        }
        
        /* Stari Formulare */
        #form-login { transform: translateX(0); opacity: 1; pointer-events: all; }
        #form-register { transform: translateX(100%); opacity: 0; pointer-events: none; }
        
        .show-register #form-login { transform: translateX(-100%); opacity: 0; pointer-events: none; }
        .show-register #form-register { transform: translateX(0); opacity: 1; pointer-events: all; }

        /* ==========================================================
           3. INPUTS & FORMS
           ========================================================== */
        .input-group { display: flex; flex-direction: column; gap: 8px; position: relative; }
        .input-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }
        
        .input-field {
            background: rgba(255,255,255,0.02); border: none; border-bottom: 2px solid var(--border-glass);
            padding: 15px; color: var(--text-main); font-family: 'JetBrains Mono', monospace; font-size: 16px;
            font-weight: 700; outline: none; transition: 0.3s;
            /* Anti-skew pe input pentru text drept, desi containerul e inclinat */
            transform: skewX(5deg); width: 90%; 
        }
        .input-field::placeholder { color: rgba(255,255,255,0.15); font-style: italic; font-family: 'Montserrat'; }
        
        .input-field:focus { border-bottom-color: var(--accent); background: rgba(0, 255, 204, 0.05); }
        
        /* Iconita inauntrul inputului */
        .input-icon { position: absolute; right: 10px; top: 35px; font-size: 20px; color: var(--text-muted); transform: skewX(5deg); transition: 0.3s;}
        .input-field:focus ~ .input-icon { color: var(--accent); filter: drop-shadow(0 0 5px var(--accent)); }

        /* ==========================================================
           4. BUTOANE & LINKURI
           ========================================================== */
        .btn-submit {
            background: var(--text-main); color: #000; border: none; padding: 18px;
            font-family: inherit; font-size: 16px; font-weight: 900; font-style: italic;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
            transition: 0.2s; margin-top: 10px; position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-submit span { transform: skewX(5deg); display: flex; align-items: center; gap: 10px; }
        .btn-submit:hover { background: var(--accent); box-shadow: var(--shadow-glow); }
        .btn-submit:active { transform: scale(0.95); }

        .auth-links { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .auth-link {
            background: none; border: none; color: var(--text-muted); font-family: inherit;
            font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: 0.2s; text-align: left; padding: 0;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .auth-link:hover { color: var(--text-main); }
        .auth-link.highlight { color: var(--accent); }
        .auth-link.highlight:hover { color: #fff; text-shadow: 0 0 10px var(--accent); }

        /* ==========================================================
           5. FOOTER & SERVER INFO
           ========================================================== */
        .auth-footer {
            margin-top: auto; display: flex; flex-direction: column; gap: 5px;
            border-top: 1px solid var(--border-glass); padding-top: 20px;
        }
        .server-status { font-size: 10px; font-weight: 800; color: var(--success); text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; gap: 6px; }
        .server-status i { font-size: 14px; animation: blink 2s infinite; }
        .build-version { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--text-muted); }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    </style>
</head>
<body>

    <div class="overlay"></div>

    <!-- 1. INTRO SCREEN -->
    <div class="intro-screen" id="intro-screen">
        <div class="brand-massive">XODO <span>RP</span></div>
        <div class="press-key">
            Apasă <span class="key-btn">ENTER</span> pentru a începe
        </div>
    </div>

    <!-- 2. AUTH SIDEBAR -->
    <div class="auth-container" id="auth-container">
        
        <div class="auth-header">
            <div class="auth-subtitle">Securitate XODO</div>
            <div class="auth-title" id="main-title">Loghează-te</div>
        </div>

        <div class="form-slider" id="form-slider">
            
            <!-- FORMULAR LOGIN -->
            <div class="form-section" id="form-login">
                <div class="input-group">
                    <div class="input-label">Nume Jucător</div>
                    <input type="text" class="input-field" placeholder="Ex: Ștefan" id="login-user">
                    <i class="ph-bold ph-user input-icon"></i>
                </div>
                
                <div class="input-group">
                    <div class="input-label">Parolă Acces</div>
                    <input type="password" class="input-field" placeholder="••••••••" id="login-pass">
                    <i class="ph-bold ph-lock-key input-icon"></i>
                </div>

                <button class="btn-submit" onclick="simulateLogin(this)">
                    <span><i class="ph-bold ph-sign-in"></i> Conectare</span>
                </button>

                <div class="auth-links">
                    <button class="auth-link" onclick="alert('Contactează staff-ul pe Discord pentru resetare.')">Ai uitat parola?</button>
                    <button class="auth-link highlight" onclick="toggleView('register')">Nu ai cont? Creează unul <i class="ph-bold ph-arrow-right"></i></button>
                </div>
            </div>

            <!-- FORMULAR REGISTER -->
            <div class="form-section" id="form-register">
                <div class="input-group">
                    <div class="input-label">Nume Dorit</div>
                    <input type="text" class="input-field" placeholder="Alege un username">
                    <i class="ph-bold ph-identification-badge input-icon"></i>
                </div>

                <div class="input-group">
                    <div class="input-label">Adresa Email</div>
                    <input type="email" class="input-field" placeholder="adresa@email.com">
                    <i class="ph-bold ph-envelope-simple input-icon"></i>
                </div>
                
                <div class="input-group">
                    <div class="input-label">Parolă Secură</div>
                    <input type="password" class="input-field" placeholder="••••••••">
                    <i class="ph-bold ph-shield-check input-icon"></i>
                </div>

                <button class="btn-submit" onclick="simulateLogin(this)">
                    <span><i class="ph-bold ph-user-plus"></i> Înregistrare</span>
                </button>

                <div class="auth-links">
                    <button class="auth-link highlight" onclick="toggleView('login')"><i class="ph-bold ph-arrow-left"></i> Înapoi la Autentificare</button>
                </div>
            </div>

        </div>

        <div class="auth-footer">
            <div class="server-status"><i class="ph-fill ph-circle"></i> Server Online (142/256)</div>
            <div class="build-version">Build: v2.0 - Core Edition (2026)</div>
        </div>

    </div>

    <script>
        // ==========================================================
        // LOGICA DE INTRO & TOGGLE
        // ==========================================================
        let isStarted = false;

        // Asculta orice tasta pentru a trece de Intro Screen
        document.addEventListener('keydown', (e) => {
            if (!isStarted) {
                isStarted = true;
                document.getElementById('intro-screen').classList.add('hidden');
                
                // Trage panoul de auth in ecran dupa o fractiune de secunda
                setTimeout(() => {
                    document.getElementById('auth-container').classList.add('active');
                    document.getElementById('login-user').focus();
                }, 300);
            }
        });

        // Schimbarea intre Login si Register
        function toggleView(view) {
            const slider = document.getElementById('form-slider');
            const title = document.getElementById('main-title');

            if (view === 'register') {
                slider.classList.add('show-register');
                title.innerText = "Creează Cont";
            } else {
                slider.classList.remove('show-register');
                title.innerText = "Loghează-te";
            }
        }

        // ==========================================================
        // SIMULARE LOGIN (Pentru Demo)
        // ==========================================================
        function simulateLogin(btn) {
            const originalContent = btn.innerHTML;
            
            // Stare de Loading
            btn.innerHTML = `<span><i class="ph-bold ph-spinner" style="animation: spin 1s linear infinite;"></i> Se conectează...</span>`;
            btn.style.pointerEvents = 'none';

            // Simulam raspunsul serverului dupa 1.5s
            setTimeout(() => {
                btn.style.background = 'var(--success)';
                btn.style.color = '#000';
                btn.innerHTML = `<span><i class="ph-bold ph-check"></i> Succes!</span>`;
                
                // Aici trimiti NUI Message catre clientul de FiveM:
                // window.postMessage({ action: 'submitAuth', data: { ... } });

                // Ascundem panoul ca si cum ar incepe jocul
                setTimeout(() => {
                    document.getElementById('auth-container').classList.remove('active');
                }, 1000);

            }, 1500);
        }

    </script>
</body>
</html>
