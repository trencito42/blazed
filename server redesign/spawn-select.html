<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forza Style Spawn Selector</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.4);
            --accent: #00ffcc; /* Cyan Neon */
            --danger: #ff3366;
            --warning: #f59e0b;
            
            --shadow-text: 0 5px 15px rgba(0, 0, 0, 0.9);
            --shadow-glow: 0 0 20px rgba(0, 255, 204, 0.4);
            
            --transition-snappy: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #050508; overflow: hidden; user-select: none;
        }

        /* --- BACKGROUND CINEMATIC --- */
        .bg-map {
            position: absolute; inset: 0; z-index: 0;
            background: url('https://images.unsplash.com/photo-1605806616949-1e87b487bc2a?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            filter: grayscale(80%) brightness(0.4) contrast(1.2);
            animation: slowPan 30s linear infinite alternate;
        }

        @keyframes slowPan {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.05) translate(-1%, 1%); }
        }

        .vignette {
            position: absolute; inset: 0; z-index: 1;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.9) 100%);
        }

        /* Flash-ul negru pt tranzitia finala */
        .cinematic-fade {
            position: absolute; inset: 0; z-index: 999;
            background: #000; opacity: 0; pointer-events: none;
            transition: opacity 1.5s ease;
        }
        .cinematic-fade.active { opacity: 1; pointer-events: all; }

        /* --- MASTER UI WRAPPER (Inclinat) --- */
        .spawn-ui {
            position: absolute; inset: 0; z-index: 10;
            padding: 80px 100px;
            display: flex; justify-content: space-between; align-items: stretch;
            transform: skewX(-5deg); /* Forza Style Skew */
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s;
        }

        /* Animatia cand iesi din meniu */
        .spawn-ui.exit {
            transform: skewX(-5deg) translateX(-150px) scale(0.95);
            opacity: 0;
        }

        /* --- STANGA: LISTA LOCATII --- */
        .locations-container {
            display: flex; flex-direction: column; justify-content: center; gap: 20px;
        }

        .section-title {
            font-size: 14px; font-weight: 900; color: var(--accent);
            text-transform: uppercase; letter-spacing: 4px;
            margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            display: flex; align-items: center; gap: 10px;
            opacity: 0; animation: slideRight 0.5s forwards;
        }
        .section-title::before { content: ''; width: 24px; height: 2px; background: var(--accent); }

        .location-list { display: flex; flex-direction: column; gap: 10px; }

        .loc-item {
            font-size: 42px; font-weight: 900; font-style: italic; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            padding-left: 0; border-left: 0px solid transparent;
            text-shadow: var(--shadow-text);
            transition: all 0.3s var(--transition-snappy);
            
            /* Animatie secventiala de intrare */
            opacity: 0; transform: translateX(-50px);
            animation: slideRight 0.6s forwards var(--delay);
        }

        @keyframes slideRight {
            to { opacity: 1; transform: translateX(0); }
        }

        /* Hover & Active State */
        .loc-item:hover, .loc-item.active {
            color: var(--text-main);
            padding-left: 20px;
            border-left: 8px solid var(--accent);
            text-shadow: var(--shadow-glow), var(--shadow-text);
            transform: translateX(10px);
        }
        
        .loc-item.active { color: var(--accent); }

        .loc-item i { font-size: 28px; margin-right: 15px; transform: skewX(5deg); vertical-align: -3px; }
        .loc-item span { transform: skewX(5deg); display: inline-block; }

        /* --- DREAPTA: INFORMATII & CONFIRMARE --- */
        .details-container {
            display: flex; flex-direction: column; justify-content: center; align-items: flex-end;
            width: 400px; opacity: 0; animation: slideRight 0.8s forwards 0.4s;
        }

        .map-preview {
            width: 100%; height: 200px; border: 2px solid var(--text-muted);
            background: rgba(0,0,0,0.5); margin-bottom: 30px; position: relative;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-text); transition: border-color 0.3s;
        }
        .map-preview i { font-size: 48px; color: var(--text-muted); opacity: 0.5; }
        .map-preview.active { border-color: var(--accent); box-shadow: var(--shadow-glow); }
        .map-preview.active i { color: var(--accent); opacity: 1; filter: drop-shadow(0 0 10px var(--accent)); }

        .detail-row {
            display: flex; justify-content: space-between; width: 100%;
            margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }
        .detail-label { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }
        .detail-value { font-size: 14px; font-weight: 900; color: var(--text-main); text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
        .val-safe { color: var(--accent); }
        .val-danger { color: var(--danger); }

        /* Buton Enter */
        .btn-spawn {
            margin-top: 40px; background: transparent; border: none;
            display: flex; align-items: center; gap: 15px; cursor: pointer;
            font-family: inherit; font-size: 24px; font-weight: 900; font-style: italic;
            color: var(--text-main); text-transform: uppercase; text-shadow: var(--shadow-text);
            transition: all 0.2s var(--transition-snappy); outline: none;
        }
        
        .btn-spawn .key-hint {
            display: flex; align-items: center; justify-content: center;
            background: var(--text-main); color: #000;
            padding: 5px 15px; border-radius: 4px; font-size: 16px;
            transform: skewX(5deg); box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }

        .btn-spawn:hover { color: var(--accent); text-shadow: var(--shadow-glow); transform: scale(1.05); }
        .btn-spawn:hover .key-hint { background: var(--accent); box-shadow: 0 0 15px var(--accent); }
        .btn-spawn:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <div class="bg-map"></div>
    <div class="vignette"></div>
    <div class="cinematic-fade" id="fade-overlay"></div>

    <div class="spawn-ui" id="main-ui">
        
        <!-- STANGA: LOCATII -->
        <div class="locations-container">
            <div class="section-title">Selectează Punctul de Inserție</div>
            
            <div class="location-list" id="loc-list">
                <!-- Data-delay seteaza ordinea in care apar din stanga -->
                <div class="loc-item active" data-id="last" data-status="Safe" data-risk="Scăzut" data-players="12" style="--delay: 0.1s">
                    <i class="ph-bold ph-clock-counter-clockwise"></i> <span>Ultima Locație</span>
                </div>
                <div class="loc-item" data-id="apart" data-status="Proprietate" data-risk="Zero" data-players="0" style="--delay: 0.2s">
                    <i class="ph-bold ph-building-apartment"></i> <span>Apartament Tinsel</span>
                </div>
                <div class="loc-item" data-id="legion" data-status="Public" data-risk="Ridicat" data-players="45" style="--delay: 0.3s">
                    <i class="ph-bold ph-users-three"></i> <span>Legion Square</span>
                </div>
                <div class="loc-item" data-id="airport" data-status="Public" data-risk="Mediu" data-players="8" style="--delay: 0.4s">
                    <i class="ph-bold ph-airplane-tilt"></i> <span>Aeroport LSIA</span>
                </div>
                <div class="loc-item" data-id="paleto" data-status="Safezone" data-risk="Scăzut" data-players="3" style="--delay: 0.5s">
                    <i class="ph-bold ph-tree-pine"></i> <span>Paleto Bay</span>
                </div>
            </div>
        </div>

        <!-- DREAPTA: DETALII -->
        <div class="details-container">
            
            <!-- Simularea hartii -->
            <div class="map-preview active" id="map-box">
                <i class="ph-fill ph-crosshair"></i>
            </div>

            <div class="detail-row">
                <span class="detail-label">Status Zonă</span>
                <span class="detail-value val-safe" id="info-status">Safe</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Nivel Risc</span>
                <span class="detail-value" id="info-risk">Scăzut</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Entități Active</span>
                <span class="detail-value" id="info-players">12</span>
            </div>

            <button class="btn-spawn" id="btn-spawn" onclick="spawnPlayer()">
                <div class="key-hint">ENTER</div>
                Confirmă
            </button>
        </div>

    </div>

    <script>
        const items = document.querySelectorAll('.loc-item');
        const infoStatus = document.getElementById('info-status');
        const infoRisk = document.getElementById('info-risk');
        const infoPlayers = document.getElementById('info-players');
        const mapBox = document.getElementById('map-box');
        
        let selectedSpawn = 'last';

        // 1. GESTIONARE SELECTIE LOCATIE
        items.forEach(item => {
            item.addEventListener('click', () => {
                // Remove active class
                items.forEach(i => i.classList.remove('active'));
                
                // Add active to clicked
                item.classList.add('active');
                selectedSpawn = item.getAttribute('data-id');

                // Update Info Panel
                const status = item.getAttribute('data-status');
                const risk = item.getAttribute('data-risk');
                const players = item.getAttribute('data-players');

                infoStatus.innerText = status;
                infoRisk.innerText = risk;
                infoPlayers.innerText = players;

                // Color coding
                infoStatus.className = 'detail-value ' + (status === 'Public' ? '' : 'val-safe');
                infoRisk.className = 'detail-value ' + (risk === 'Ridicat' ? 'val-danger' : '');

                // Blip map animation (Pulse)
                mapBox.classList.remove('active');
                void mapBox.offsetWidth; // trigger reflow
                mapBox.classList.add('active');
            });
        });

        // 2. NAVIGARE DIN TASTATURA (Săgeți Sus/Jos)
        document.addEventListener('keydown', (e) => {
            const activeIdx = Array.from(items).findIndex(item => item.classList.contains('active'));
            
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                const nextIdx = (activeIdx + 1) % items.length;
                items[nextIdx].click();
            } 
            else if (e.key === 'ArrowUp') {
                e.preventDefault();
                const prevIdx = (activeIdx - 1 + items.length) % items.length;
                items[prevIdx].click();
            }
            // 3. APASARE ENTER PENTRU SPAWN
            else if (e.key === 'Enter') {
                e.preventDefault();
                spawnPlayer();
            }
        });

        // 4. ANIMATIE CINEMATICA DE SPAWN
        function spawnPlayer() {
            const ui = document.getElementById('main-ui');
            const fade = document.getElementById('fade-overlay');

            // UI-ul zboara in stanga afara din ecran
            ui.classList.add('exit');

            // Ecranul se face negru instant (camera drops down in GTA)
            setTimeout(() => {
                fade.classList.add('active');
            }, 300);

            // Aici trimiti request-ul catre LUA
            console.log(`[LUA TRIGGER]: Spawn player at -> ${selectedSpawn}`);
            // window.postMessage({ action: 'spawn', location: selectedSpawn });
        }

    </script>
</body>
</html>
