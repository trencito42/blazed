<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XODO RP - Vehicle Management /v (Final)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.4);
            --accent: #00ffcc; 
            --danger: #ff3366; 
            --warning: #f59e0b;
            --success: #10b981;
            
            --bg-panel: rgba(10, 10, 15, 0.95);
            --border-glass: rgba(255, 255, 255, 0.1);
            
            --shadow-text: 0 4px 10px rgba(0, 0, 0, 0.9);
            --shadow-glow: 0 0 25px rgba(0, 255, 204, 0.3);
            
            --transition-snappy: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Montserrat', sans-serif;
            background: url('https://images.unsplash.com/photo-1605806616949-1e87b487bc2a?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover; overflow: hidden; user-select: none;
        }

        .overlay { position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.95) 100%); z-index: 0; }

        .dev-tools { position: absolute; top: 30px; left: 30px; z-index: 100; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; color: white; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border-glass);}
        .dev-btn { background: var(--text-main); color: #000; border: none; padding: 8px 12px; border-radius: 4px; font-family: inherit; font-weight: 900; cursor: pointer; font-size: 11px; text-transform: uppercase; transition: 0.2s;}
        .dev-btn:hover { background: var(--accent); }

        /* ==========================================================
           MAIN WRAPPER
           ========================================================== */
        .v-menu-wrapper {
            position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .v-menu-wrapper.active { opacity: 1; pointer-events: all; }

        .v-container {
            display: flex; gap: 20px; transform: skewX(-5deg); width: 950px; height: 640px;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.8));
        }

        /* STANGA: LISTA */
        .v-sidebar {
            width: 350px; background: var(--bg-panel); border: 2px solid var(--border-glass);
            border-left: 4px solid var(--accent); display: flex; flex-direction: column;
        }
        .v-header { padding: 20px; border-bottom: 1px solid var(--border-glass); display: flex; flex-direction: column; gap: 15px; }
        .vh-title { font-size: 20px; font-weight: 900; font-style: italic; color: var(--text-main); text-transform: uppercase; transform: skewX(5deg); display: flex; align-items: center; gap: 10px; }
        
        .v-search { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 10px 15px; transform: skewX(5deg); }
        .v-search input { background: transparent; border: none; color: var(--text-main); font-family: inherit; font-size: 12px; font-weight: 700; width: 100%; outline: none; }
        
        .v-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 10px 0; }
        .v-list::-webkit-scrollbar { width: 0; }

        .v-item { padding: 15px 20px; border-left: 4px solid transparent; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 15px; }
        .v-item:hover { background: rgba(255,255,255,0.02); }
        .v-item.active { background: linear-gradient(90deg, rgba(0,255,204,0.1) 0%, transparent 100%); border-left-color: var(--accent); }
        
        .vi-icon { font-size: 28px; color: var(--text-muted); transform: skewX(5deg); display: flex; justify-content: center; width: 40px; }
        .v-item.active .vi-icon { color: var(--accent); filter: drop-shadow(0 0 5px var(--accent)); }
        
        .vi-info { display: flex; flex-direction: column; transform: skewX(5deg); flex: 1; }
        .vi-name { font-size: 14px; font-weight: 800; color: var(--text-main); text-transform: uppercase; }
        .vi-plate { font-family: 'JetBrains Mono'; font-size: 11px; font-weight: 800; color: var(--text-muted); margin-top: 2px;}
        .vi-status { font-size: 10px; font-weight: 900; text-transform: uppercase; transform: skewX(5deg); padding: 2px 6px; border-radius: 2px; }
        .vi-status.garage { color: var(--accent); background: rgba(0,255,204,0.1); }
        .vi-status.out { color: var(--text-muted); background: rgba(255,255,255,0.1); }
        .vi-status.impound { color: var(--danger); background: rgba(255,51,102,0.1); }

        /* DREAPTA: DETALII */
        .v-details {
            flex: 1; background: var(--bg-panel); border: 2px solid var(--border-glass);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .vd-watermark { position: absolute; right: -20px; bottom: -20px; font-size: 250px; color: rgba(255,255,255,0.02); transform: skewX(5deg); pointer-events: none; }

        .vd-header { padding: 25px 30px; border-bottom: 1px solid var(--border-glass); display: flex; justify-content: space-between; align-items: flex-start; z-index: 2;}
        .vd-title-box { display: flex; flex-direction: column; transform: skewX(5deg); }
        .vd-class { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .vd-name { font-size: 28px; font-weight: 900; font-style: italic; color: var(--text-main); text-transform: uppercase; line-height: 1; text-shadow: var(--shadow-text); }
        
        .vd-plate-box { background: rgba(255,255,255,0.9); padding: 6px 12px; border: 2px solid #000; border-radius: 4px; display: flex; flex-direction: column; align-items: center; transform: skewX(5deg); box-shadow: 0 5px 15px rgba(0,0,0,0.5);}
        .vd-plate-state { font-size: 7px; font-weight: 900; color: #1e3a8a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px;}
        .vd-plate-text { font-family: 'JetBrains Mono'; font-size: 16px; font-weight: 800; color: #000; line-height: 1;}

        .vd-body { padding: 25px 30px; flex: 1; display: flex; flex-direction: column; gap: 20px; z-index: 2; }

        /* Status Grid */
        .vd-status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; transform: skewX(5deg); }
        .status-box { background: rgba(0,0,0,0.6); border: 1px solid var(--border-glass); padding: 12px 15px; display: flex; flex-direction: column; gap: 4px; border-left: 2px solid transparent;}
        .status-box.ok { border-left-color: var(--success); }
        .status-box.warn { border-left-color: var(--warning); }
        .status-box.bad { border-left-color: var(--danger); }
        
        .sb-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; display: flex; align-items: center; gap: 5px;}
        .sb-val { font-family: 'JetBrains Mono'; font-size: 18px; font-weight: 800; color: var(--text-main); }
        .status-box.bad .sb-val { color: var(--danger); }

        /* Tuning & Odometer Container */
        .vd-extra-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; transform: skewX(5deg); }
        
        .vd-card { background: rgba(0,0,0,0.6); border: 1px solid var(--border-glass); padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .vc-title { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px;}
        
        .odometer-val { font-family: 'JetBrains Mono'; font-size: 22px; font-weight: 800; color: var(--text-main); }
        
        .tuning-list { display: flex; flex-direction: column; gap: 4px; max-height: 70px; overflow-y: auto; }
        .tuning-item { font-size: 11px; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
        .tuning-item span { color: var(--text-main); font-family: 'JetBrains Mono'; }

        /* Actiuni Jos (Multiple Butoane) */
        .vd-actions { padding: 20px 30px; border-top: 1px solid var(--border-glass); background: rgba(0,0,0,0.4); display: flex; gap: 15px; z-index: 2; }
        
        .btn-action {
            flex: 1; background: var(--text-main); color: #000; border: none; padding: 15px;
            font-family: inherit; font-size: 13px; font-weight: 900; font-style: italic;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px; transform: skewX(5deg);
        }
        .btn-action:hover { background: var(--accent); box-shadow: var(--shadow-glow); }
        .btn-action.secondary { background: transparent; border: 1px solid var(--text-muted); color: var(--text-main); }
        .btn-action.secondary:hover { border-color: var(--text-main); background: rgba(255,255,255,0.05); }

        /* Hold to Pay (Impound) */
        .btn-hold {
            position: relative; flex: 1; height: 50px; background: rgba(0,0,0,0.8); border: 2px solid var(--danger);
            display: none; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; font-style: italic;
            color: var(--danger); text-transform: uppercase; letter-spacing: 2px; cursor: pointer; overflow: hidden; transform: skewX(5deg);
        }
        .bh-progress { position: absolute; top: 0; left: 0; bottom: 0; width: 0%; background: var(--danger); z-index: 0; transition: width 0.1s linear; }
        .bh-text { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; }
        .btn-hold .key { background: var(--danger); color: #000; padding: 2px 6px; border-radius: 2px; font-size: 11px; font-style: normal; }

    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="dev-tools">
        <div style="font-size: 11px; font-weight: 900; color: var(--accent); text-transform: uppercase;">Meniu /v (Final & Detaliat)</div>
        <button class="dev-btn" onclick="document.getElementById('v-menu').classList.add('active')">Deschide Garaj /v</button>
    </div>

    <!-- V MENU MODAL -->
    <div class="v-menu-wrapper" id="v-menu">
        <div class="v-container">
            
            <!-- STANGA: LISTA -->
            <div class="v-sidebar">
                <div class="v-header">
                    <div class="vh-title"><i class="ph-bold ph-steering-wheel"></i> Vehiculele Tale</div>
                    <div class="v-search">
                        <i class="ph-bold ph-magnifying-glass"></i>
                        <input type="text" placeholder="Caută model sau număr...">
                    </div>
                </div>
                <div class="v-list" id="vehicle-list"></div>
            </div>

            <!-- DREAPTA: DETALII -->
            <div class="v-details">
                <i class="ph-fill ph-car-profile vd-watermark"></i>
                
                <div class="vd-header">
                    <div class="vd-title-box">
                        <div class="vd-class" id="det-class">Sports Classic</div>
                        <div class="vd-name" id="det-name">Elegy Retro</div>
                    </div>
                    <div class="vd-plate-box">
                        <div class="vd-plate-state">San Andreas</div>
                        <div class="vd-plate-text" id="det-plate">XODO-01</div>
                    </div>
                </div>

                <div class="vd-body">
                    
                    <!-- Stare Fizica -->
                    <div class="vd-status-grid">
                        <div class="status-box" id="sb-engine">
                            <div class="sb-label"><i class="ph-fill ph-engine"></i> Motor</div>
                            <div class="sb-val" id="val-engine">100%</div>
                        </div>
                        <div class="status-box" id="sb-body">
                            <div class="sb-label"><i class="ph-fill ph-car"></i> Caroserie</div>
                            <div class="sb-val" id="val-body">98%</div>
                        </div>
                        <div class="status-box" id="sb-fuel">
                            <div class="sb-label"><i class="ph-fill ph-gas-pump"></i> Benzină</div>
                            <div class="sb-val" id="val-fuel">45L</div>
                        </div>
                    </div>

                    <!-- Odometer & Tuning -->
                    <div class="vd-extra-grid">
                        <div class="vd-card">
                            <div class="vc-title"><i class="ph-fill ph-gauge"></i> Kilometraj (Odo)</div>
                            <div class="odometer-val" id="val-odo">1,428.5 KM</div>
                        </div>
                        <div class="vd-card">
                            <div class="vc-title"><i class="ph-fill ph-cpu"></i> Tuning Instalat</div>
                            <div class="tuning-list" id="val-tuning">
                                <div class="tuning-item">EMS: <span>Stage 2</span></div>
                                <div class="tuning-item">Turbo: <span>Ecu Map</span></div>
                                <div class="tuning-item">Transmisie: <span>Race</span></div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- ACTIUNI MULTIPLE (Doua butoane curate) -->
                <div class="vd-actions" id="action-panel">
                    <button class="btn-action secondary" id="btn-gps" onclick="alert('GPS Setat!')">
                        <i class="ph-bold ph-crosshair"></i> GPS
                    </button>
                    
                    <button class="btn-action" id="btn-main-action" onclick="spawnVehicle()">
                        <i class="ph-bold ph-key"></i> Solicită Valet
                    </button>

                    <!-- Hold to Pay pt Impound -->
                    <div class="btn-hold" id="btn-impound" onmousedown="startImpound()" onmouseup="stopImpound()" onmouseleave="stopImpound()">
                        <div class="bh-progress" id="imp-progress"></div>
                        <div class="bh-text" id="imp-text"><span class="key">ENTER</span> Achită Cauțiunea</div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script>
        const vehicles = [
            {
                id: 1, name: 'Elegy Retro', class: 'Sports Classic', plate: 'XODO-01',
                engine: 100, body: 98, fuel: 45, maxFuel: 60, odo: '1,428.5 KM',
                tuning: [{n: 'EMS', v: 'Stage 2'}, {n: 'Turbo', v: 'Ecu Map'}, {n: 'Transmisie', v: 'Race'}],
                status: 'garage', location: 'Garaj Central'
            },
            {
                id: 2, name: 'Blista Kanjo', class: 'Compacts', plate: 'KANJ-99',
                engine: 45, body: 20, fuel: 12, maxFuel: 40, odo: '12,940.1 KM',
                tuning: [{n: 'EMS', v: 'Stock'}, {n: 'Frâne', v: 'Street'}],
                status: 'out', location: 'Vinewood Blvd.'
            },
            {
                id: 3, name: 'Dubsta 6x6', class: 'Off-Road', plate: 'MUD-666',
                engine: 85, body: 90, fuel: 55, maxFuel: 80, odo: '4,102.0 KM',
                tuning: [{n: 'Suspensie', v: 'Lifted'}, {n: 'Blindaj', v: '100%'}],
                status: 'impound', location: 'LSPD Impound', fee: 1500
            }
        ];

        let selectedVehicle = null;

        function initList() {
            const list = document.getElementById('vehicle-list');
            list.innerHTML = '';

            vehicles.forEach(veh => {
                const item = document.createElement('div');
                item.className = 'v-item';
                
                let statusHtml = veh.status === 'garage' ? `<div class="vi-status garage">Garaj</div>` :
                                 veh.status === 'out' ? `<div class="vi-status out">Stradă</div>` :
                                 `<div class="vi-status impound">Confiscat</div>`;

                item.innerHTML = `
                    <i class="ph-fill ph-car-profile vi-icon"></i>
                    <div class="vi-info">
                        <div class="vi-name">${veh.name}</div>
                        <div class="vi-plate">${veh.plate}</div>
                    </div>
                    ${statusHtml}
                `;
                item.onclick = () => selectVehicle(veh, item);
                list.appendChild(item);
            });

            if (vehicles.length > 0) selectVehicle(vehicles[0], list.children[0]);
        }

        function selectVehicle(veh, el) {
            selectedVehicle = veh;
            document.querySelectorAll('.v-item').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');

            document.getElementById('det-class').innerText = veh.class;
            document.getElementById('det-name').innerText = veh.name;
            document.getElementById('det-plate').innerText = veh.plate;

            updateStatBox('engine', veh.engine);
            updateStatBox('body', veh.body);
            document.getElementById('val-fuel').innerText = `${veh.fuel}L`;
            document.getElementById('val-odo').innerText = veh.odo;

            // Render Tuning List
            const tuningCont = document.getElementById('val-tuning');
            tuningCont.innerHTML = '';
            if (veh.tuning && veh.tuning.length > 0) {
                veh.tuning.forEach(t => {
                    tuningCont.innerHTML += `<div class="tuning-item">${t.n}: <span>${t.v}</span></div>`;
                });
            } else {
                tuningCont.innerHTML = `<div class="tuning-item" style="color:var(--text-muted)">Fără modificări</div>`;
            }

            // Gestionare butoane jos
            const btnMain = document.getElementById('btn-main-action');
            const btnGps = document.getElementById('btn-gps');
            const btnImpound = document.getElementById('btn-impound');

            btnMain.style.display = 'flex';
            btnGps.style.display = 'flex';
            btnImpound.style.display = 'none';

            if (veh.status === 'garage') {
                btnMain.innerHTML = `<i class="ph-bold ph-key"></i> Solicită Valet`;
                btnMain.onclick = spawnVehicle;
                btnGps.style.display = 'none'; // Nu ai nevoie de GPS daca e in garaj
            } else if (veh.status === 'out') {
                btnMain.innerHTML = `<i class="ph-bold ph-car"></i> Park / Garaj`;
                btnMain.onclick = () => alert('Vehiculul a fost trimis în garaj.');
                btnGps.innerHTML = `<i class="ph-bold ph-crosshair"></i> GPS (${veh.location})`;
            } else if (veh.status === 'impound') {
                btnMain.style.display = 'none';
                btnGps.style.display = 'none';
                btnImpound.style.display = 'flex';
                document.getElementById('imp-text').innerHTML = `<span class="key">ENTER</span> Achită Cauțiunea ($${veh.fee})`;
            }
        }

        function updateStatBox(type, val) {
            const box = document.getElementById(`sb-${type}`);
            document.getElementById(`val-${type}`).innerText = `${val}%`;
            box.className = 'status-box ' + (val >= 80 ? 'ok' : val >= 40 ? 'warn' : 'bad');
        }

        function spawnVehicle() {
            alert(`Vehiculul ${selectedVehicle.plate} a fost spawnat.`);
            document.getElementById('v-menu').classList.remove('active');
        }

        let impTimer, impProg = 0;
        function updateImpound() {
            impProg += 2.5;
            document.getElementById('imp-progress').style.width = impProg + '%';
            if (impProg >= 100) {
                alert('Cauțiune achitată! Mașina a fost eliberată.');
                document.getElementById('v-menu').classList.remove('active');
                stopImpound();
            } else {
                impTimer = requestAnimationFrame(updateImpound);
            }
        }
        function startImpound() { cancelAnimationFrame(impTimer); impTimer = requestAnimationFrame(updateImpound); }
        function stopImpound() { cancelAnimationFrame(impTimer); impProg = 0; document.getElementById('imp-progress').style.width = '0%'; }

        initList();
    </script>
</body>
</html>
