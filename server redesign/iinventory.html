<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XODO RP - Perfect Player Inventory</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.4);
            --accent: #00ffcc; 
            --danger: #ff3366; 
            
            --bg-panel: rgba(10, 10, 15, 0.85);
            --border-glass: rgba(255, 255, 255, 0.1);
            
            --shadow-text: 0 4px 10px rgba(0, 0, 0, 0.9);
            --shadow-glow: 0 0 20px rgba(0, 255, 204, 0.3);
            
            --transition-snappy: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Montserrat', sans-serif;
            background: url('https://images.unsplash.com/photo-1605806616949-1e87b487bc2a?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover; overflow: hidden; user-select: none;
        }

        .overlay { position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.9) 100%); z-index: 0; }

        /* DEV TOOLS (Doar informativ) */
        .dev-tools { position: absolute; top: 30px; left: 30px; z-index: 100; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; color: var(--text-muted); font-size: 11px; border: 1px solid var(--border-glass); }
        .dev-tools span { color: var(--accent); font-weight: 800; }

        /* ==========================================================
           MASTER WRAPPER
           ========================================================== */
        .inventory-wrapper {
            position: absolute; inset: 0; z-index: 10;
            display: flex; justify-content: center; align-items: center; gap: 40px;
        }

        /* ==========================================================
           PANOUL JUCATORULUI
           ========================================================== */
        .inv-panel {
            width: 480px; display: flex; flex-direction: column; gap: 15px;
            transform: skewX(-5deg); filter: drop-shadow(0 20px 40px rgba(0,0,0,0.8));
        }

        /* HEADER (Turometru Greutate) */
        .inv-header {
            background: var(--bg-panel); border: 2px solid var(--border-glass); padding: 20px 25px;
            backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 15px;
            border-bottom: 4px solid var(--accent);
        }

        .inv-title { display: flex; justify-content: space-between; align-items: flex-end; }
        .inv-name { font-size: 24px; font-weight: 900; font-style: italic; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px; text-shadow: var(--shadow-text); display: flex; align-items: center; gap: 10px; }
        .inv-weight-text { font-size: 14px; font-weight: 800; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .inv-weight-text span { color: var(--text-main); }

        .weight-bar-container { display: flex; gap: 3px; width: 100%; height: 12px; }
        .weight-segment { flex: 1; background: rgba(255,255,255,0.1); transform: skewX(-15deg); transition: all 0.3s; }
        .weight-segment.fill { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .weight-segment.danger { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

        /* ECHIPAMENT / ACCESORII */
        .equipment-row {
            display: flex; gap: 10px; background: var(--bg-panel); border: 2px solid var(--border-glass);
            padding: 15px 25px; backdrop-filter: blur(10px); justify-content: space-between;
        }

        .equip-slot {
            width: 60px; height: 60px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center; position: relative; transition: 0.2s;
        }
        .equip-slot:hover { border-color: rgba(255,255,255,0.2); }
        .equip-slot.drag-over { border-color: var(--accent); background: rgba(0,255,204,0.1); box-shadow: inset 0 0 20px rgba(0,255,204,0.2); }
        .equip-ghost { position: absolute; font-size: 28px; color: rgba(255,255,255,0.1); transform: skewX(5deg); pointer-events: none; }

        /* GRILA PRINCIPALA & QUICK PICKS */
        .inv-grid-wrapper {
            background: var(--bg-panel); border: 2px solid var(--border-glass);
            padding: 25px; backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 15px;
        }
        
        .quick-picks-container {
            padding: 10px; background: rgba(0,255,204,0.03); border: 1px solid rgba(0,255,204,0.2);
            border-radius: 4px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; position: relative;
        }
        .quick-picks-label {
            position: absolute; top: -8px; right: 10px; font-size: 10px; font-weight: 800;
            color: var(--accent); text-transform: uppercase; letter-spacing: 2px;
            background: #0a0a0e; padding: 0 5px; transform: skewX(5deg);
        }

        .inv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-content: start; min-height: 250px;}

        /* SLOTURI GENERICE */
        .inv-slot {
            aspect-ratio: 1; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05);
            position: relative; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .inv-slot:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); }
        .inv-slot.drag-over { border-color: var(--accent); background: rgba(0,255,204,0.1); box-shadow: inset 0 0 20px rgba(0,255,204,0.2); }

        .hotbar-marker {
            position: absolute; top: -6px; left: -6px; font-size: 11px; font-weight: 900;
            color: #000; background: var(--accent); padding: 2px 6px;
            transform: skewX(5deg); pointer-events: none; box-shadow: 0 2px 5px rgba(0,0,0,0.5); z-index: 10;
        }

        /* ITEM-UL FIZIC */
        .inv-item {
            width: 90%; height: 90%; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: grab; position: relative; z-index: 5; transform: skewX(5deg);
        }
        .inv-item:active { cursor: grabbing; }
        .inv-item.dragging { opacity: 0.5; filter: drop-shadow(0 0 15px var(--accent)); }
        
        .item-icon { font-size: 32px; color: var(--text-main); filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8)); margin-bottom: 2px; }
        .item-name { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 95%; }
        
        .item-info { position: absolute; bottom: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 4px; box-sizing: border-box; }
        .item-qty { font-size: 10px; font-weight: 900; color: var(--accent); }
        .item-weight { font-size: 9px; font-weight: 700; color: var(--text-muted); }

        /* ==========================================================
           PANOUL DE PROXIMITATE (NEARBY PLAYERS)
           ========================================================== */
        .proximity-panel {
            width: 260px; display: flex; flex-direction: column; gap: 15px;
            transform: skewX(-5deg) translateY(20px); /* Usor asimetric pentru estetica */
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.8));
        }

        .prox-header {
            display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 900;
            color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px;
            padding: 0 5px;
        }
        .prox-radar-icon {
            width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
            box-shadow: 0 0 10px var(--accent); animation: radarPulse 1.5s infinite;
        }

        @keyframes radarPulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 255, 204, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
        }

        .prox-list { display: flex; flex-direction: column; gap: 10px; }

        .prox-player {
            background: var(--bg-panel); border: 2px solid var(--border-glass);
            padding: 15px; display: flex; flex-direction: column; gap: 8px;
            cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .prox-player:hover { border-color: var(--text-muted); background: rgba(255,255,255,0.05); }

        /* Stare Drag Over pe Jucator */
        .prox-player.drag-over {
            border-color: var(--accent); background: rgba(0,255,204,0.15);
            box-shadow: inset 0 0 20px rgba(0,255,204,0.3); transform: scale(1.05);
        }

        .prox-id { font-size: 10px; font-weight: 900; color: var(--text-muted); transform: skewX(5deg); }
        .prox-name { font-size: 14px; font-weight: 800; font-style: italic; color: var(--text-main); text-transform: uppercase; transform: skewX(5deg); }
        .prox-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; border-top: 1px solid var(--border-glass); padding-top: 8px; transform: skewX(5deg); }
        
        .prox-hint { font-size: 9px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 4px;}
        .prox-hint i { font-size: 14px; }

    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="dev-tools">
        <div>Trage un obiect peste numele unui jucător pentru <span>GIVE</span></div>
        <div>Dă click pe un jucător pentru <span>TRADE</span></div>
    </div>

    <div class="inventory-wrapper">
        
        <!-- PANOUL JUCATORULUI (STANGA) -->
        <div class="inv-panel" id="panel-player">
            
            <div class="inv-header">
                <div class="inv-title">
                    <div class="inv-name"><i class="ph-bold ph-user"></i> Inventar</div>
                    <div class="inv-weight-text"><span id="weight-val-player">0.0</span> / 25.0 KG</div>
                </div>
                <div class="weight-bar-container" id="weight-bar-player"></div>
            </div>

            <!-- Rand Echipament -->
            <div class="equipment-row" id="equip-player">
                <div class="equip-slot" data-slot="eq-mask" data-grid="equip-player"><i class="ph-fill ph-mask-happy equip-ghost"></i></div>
                <div class="equip-slot" data-slot="eq-hat" data-grid="equip-player"><i class="ph-fill ph-baseball-cap equip-ghost"></i></div>
                <div class="equip-slot" data-slot="eq-glasses" data-grid="equip-player"><i class="ph-fill ph-sunglasses equip-ghost"></i></div>
                <div class="equip-slot" data-slot="eq-armor" data-grid="equip-player"><i class="ph-fill ph-shield equip-ghost"></i></div>
                <div class="equip-slot" data-slot="eq-bag" data-grid="equip-player"><i class="ph-fill ph-backpack equip-ghost"></i></div>
            </div>

            <!-- Grila Principala & Quick Picks -->
            <div class="inv-grid-wrapper">
                <div class="quick-picks-container" id="grid-quick">
                    <div class="quick-picks-label">Quick Access</div>
                </div>
                <div class="inv-grid" id="grid-player"></div>
            </div>

        </div>

        <!-- PANOUL PROXIMITATE (DREAPTA) -->
        <div class="proximity-panel">
            <div class="prox-header">
                <div class="prox-radar-icon"></div> Jucători în zonă
            </div>
            
            <div class="prox-list" id="nearby-list">
                <!-- Generat JS -->
            </div>
        </div>

    </div>

    <script>
        const SEGMENTS = 15;
        const maxWeightPlayer = 25.0;

        // --- DATA DE TEST ---
        const initialItems = [
            { id: 'i1', icon: 'ph-crosshair', name: 'Glock 19', qty: 1, weight: 1.5, grid: 'grid-quick', slot: 0 },
            { id: 'i2', icon: 'ph-device-mobile', name: 'Telefon', qty: 1, weight: 0.2, grid: 'grid-quick', slot: 1 },
            { id: 'i3', icon: 'ph-shield', name: 'Kevlar Heavy', qty: 1, weight: 3.5, grid: 'grid-player', slot: 0 },
            { id: 'i4', icon: 'ph-first-aid', name: 'Bandaj', qty: 5, weight: 0.1, grid: 'grid-player', slot: 1 },
            { id: 'i5', icon: 'ph-drop', name: 'Apă Plată', qty: 2, weight: 0.5, grid: 'grid-player', slot: 2 }
        ];

        const nearbyPlayersData = [
            { id: 104, name: 'Om Mascat' },
            { id: 22, name: 'AlexTheDon' },
            { id: 89, name: 'Mihai C.' }
        ];

        // ==========================================================
        // INITIALIZARE GRILA
        // ==========================================================
        function createSlots(gridId, count, isQuickPick = false) {
            const grid = document.getElementById(gridId);
            for (let i = 0; i < count; i++) {
                const slot = document.createElement('div');
                slot.className = 'inv-slot';
                slot.setAttribute('data-slot', i);
                slot.setAttribute('data-grid', gridId);

                if (isQuickPick) {
                    const marker = document.createElement('div');
                    marker.className = 'hotbar-marker';
                    marker.innerText = i + 1;
                    slot.appendChild(marker);
                }

                slot.addEventListener('dragover', handleDragOver);
                slot.addEventListener('dragenter', handleDragEnter);
                slot.addEventListener('dragleave', handleDragLeave);
                slot.addEventListener('drop', handleDrop);
                grid.appendChild(slot);
            }
        }

        // Setup Sloturi Echipament
        document.querySelectorAll('.equip-slot').forEach(slot => {
            slot.addEventListener('dragover', handleDragOver);
            slot.addEventListener('dragenter', handleDragEnter);
            slot.addEventListener('dragleave', handleDragLeave);
            slot.addEventListener('drop', handleDrop);
        });

        // Spawn Item in Grila
        function spawnItem(itemData) {
            const grid = document.getElementById(itemData.grid);
            const slot = grid.querySelector(`[data-slot="${itemData.slot}"]`);
            if (!slot) return;

            const itemEl = document.createElement('div');
            itemEl.className = 'inv-item';
            itemEl.draggable = true;
            itemEl.id = itemData.id;
            itemEl.setAttribute('data-weight', itemData.weight * itemData.qty);

            let displayQty = itemData.qty;
            if(displayQty > 1000) displayQty = (displayQty/1000).toFixed(1) + 'k';

            itemEl.innerHTML = `
                <i class="ph-fill ${itemData.icon} item-icon"></i>
                <div class="item-name">${itemData.name}</div>
                <div class="item-info">
                    <span class="item-qty">${displayQty}</span>
                    <span class="item-weight">${(itemData.weight * itemData.qty).toFixed(1)}kg</span>
                </div>
            `;

            itemEl.addEventListener('dragstart', handleDragStart);
            itemEl.addEventListener('dragend', handleDragEnd);
            slot.appendChild(itemEl);
        }

        // ==========================================================
        // INITIALIZARE JUCATORI APROPIATI
        // ==========================================================
        function initNearbyPlayers() {
            const list = document.getElementById('nearby-list');
            nearbyPlayersData.forEach(player => {
                const pDiv = document.createElement('div');
                pDiv.className = 'prox-player';
                pDiv.setAttribute('data-player-id', player.id);
                
                pDiv.innerHTML = `
                    <div class="prox-id">ID Jucător: ${player.id}</div>
                    <div class="prox-name">${player.name}</div>
                    <div class="prox-actions">
                        <div class="prox-hint"><i class="ph-bold ph-handshake"></i> Click pt. Trade</div>
                    </div>
                `;

                // Click pentru Trade
                pDiv.addEventListener('click', () => {
                    alert(`[LUA TRIGGER]: Open Trade cu ID ${player.id}`);
                });

                // Drag & Drop pentru GIVE
                pDiv.addEventListener('dragover', handleDragOver);
                pDiv.addEventListener('dragenter', function(e) {
                    e.preventDefault();
                    this.classList.add('drag-over');
                    this.querySelector('.prox-hint').innerHTML = `<i class="ph-bold ph-gift"></i> Lasă pt. a oferi!`;
                });
                pDiv.addEventListener('dragleave', function(e) {
                    this.classList.remove('drag-over');
                    this.querySelector('.prox-hint').innerHTML = `<i class="ph-bold ph-handshake"></i> Click pt. Trade`;
                });
                pDiv.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.classList.remove('drag-over');
                    this.querySelector('.prox-hint').innerHTML = `<i class="ph-bold ph-handshake"></i> Click pt. Trade`;
                    
                    if (draggedItem) {
                        alert(`[LUA TRIGGER]: Give Item [${draggedItem.querySelector('.item-name').innerText}] către ID ${this.getAttribute('data-player-id')}`);
                        
                        // Simulam disparitia itemului daca l-am dat
                        draggedItem.remove();
                        updateWeights();
                    }
                });

                list.appendChild(pDiv);
            });
        }

        // ==========================================================
        // DRAG & DROP LOGIC
        // ==========================================================
        let draggedItem = null;

        function handleDragStart(e) {
            draggedItem = this;
            setTimeout(() => this.classList.add('dragging'), 0);
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.id);
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            draggedItem = null;
            document.querySelectorAll('.inv-slot, .equip-slot, .prox-player').forEach(s => s.classList.remove('drag-over'));
            updateWeights();
        }

        function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }

        function handleDragEnter(e) {
            e.preventDefault();
            if (this.classList.contains('inv-slot') || this.classList.contains('equip-slot')) {
                if (!this.querySelector('.inv-item')) this.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) { this.classList.remove('drag-over'); }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');

            if (draggedItem && (this.classList.contains('inv-slot') || this.classList.contains('equip-slot'))) {
                // Dacă slotul e gol, mutăm. (Logica de swap/stack se face din LUA)
                if (!this.querySelector('.inv-item')) {
                    this.appendChild(draggedItem);
                }
            }
        }

        // ==========================================================
        // WEIGHT CALCULATIONS
        // ==========================================================
        function initWeightBars() {
            const cont = document.getElementById('weight-bar-player');
            cont.innerHTML = '';
            for(let i=0; i<SEGMENTS; i++) {
                const seg = document.createElement('div');
                seg.className = 'weight-segment';
                cont.appendChild(seg);
            }
        }

        function updateWeights() {
            const playerItems = [
                ...document.getElementById('grid-quick').querySelectorAll('.inv-item'),
                ...document.getElementById('grid-player').querySelectorAll('.inv-item'),
                ...document.getElementById('equip-player').querySelectorAll('.inv-item')
            ];
            
            let total = 0;
            playerItems.forEach(i => total += parseFloat(i.getAttribute('data-weight')));
            document.getElementById('weight-val-player').innerText = total.toFixed(1);
            
            const segments = document.getElementById('weight-bar-player').children;
            if(segments.length === 0) return; 
            
            const pct = total / maxWeightPlayer; 
            let segmentsToFill = Math.ceil(pct * SEGMENTS);
            if(segmentsToFill > SEGMENTS) segmentsToFill = SEGMENTS;

            for(let i=0; i<SEGMENTS; i++) {
                segments[i].className = 'weight-segment'; // Reset
                if (i < segmentsToFill) {
                    if (i >= Math.floor(SEGMENTS * 0.8)) segments[i].classList.add('danger');
                    else segments[i].classList.add('fill');
                }
            }
        }

        // ==========================================================
        // RUN INITIALIZATION
        // ==========================================================
        createSlots('grid-quick', 5, true);
        createSlots('grid-player', 20, false);
        initWeightBars();
        initNearbyPlayers();
        
        initialItems.forEach(item => spawnItem(item));
        updateWeights();

    </script>
</body>
</html>
