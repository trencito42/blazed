<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XODO RP - Radar Speed Trap</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --text-main: #ffffff;
            --danger: #ff3366;
            --warning: #f59e0b;
            --shadow-text: 0 4px 10px rgba(0, 0, 0, 0.9);
            --transition-snappy: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background: url('https://placehold.co/1920x1080/1a1a24/1a1a24?text=FiveM+Gameplay') no-repeat center center;
            background-size: cover; overflow: hidden; user-select: none;
        }

        /* --- RADAR FLASH EFFECT --- */
        .radar-flash {
            position: absolute; inset: 0; z-index: 50; pointer-events: none;
            background: #ffffff; opacity: 0;
            transition: opacity 0.1s ease-out;
        }
        .radar-flash.active {
            opacity: 0.8;
            transition: opacity 0.05s ease-in;
        }

        /* --- DEV TOOLS (For Browser Testing) --- */
        .dev-tools {
            position: absolute; top: 30px; left: 30px; z-index: 100;
            display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.8);
            padding: 15px; border-radius: 8px; color: white; font-size: 12px;
        }
        .dev-btn {
            background: transparent; color: var(--text-main); border: 1px solid rgba(255,255,255,0.5);
            padding: 8px 12px; border-radius: 4px; font-family: inherit; font-weight: 700;
            cursor: pointer; transition: 0.2s; font-size: 11px; text-transform: uppercase;
        }
        .dev-btn:hover { background: var(--text-main); color: #000; }

        /* --- RADAR NOTIFICATION UI --- */
        .radar-wrapper {
            position: absolute; bottom: 80px; left: 50%;
            z-index: 20; display: flex; flex-direction: column; align-items: center;
            transform: translateX(-50%) skewX(-5deg) translateY(50px);
            filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.8));
            width: 500px;
            opacity: 0; pointer-events: none;
            transition: all 0.5s var(--transition-snappy);
        }

        .radar-wrapper.active { opacity: 1; transform: translateX(-50%) skewX(-5deg) translateY(0); }

        .radar-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            width: 100%; border-bottom: 3px solid var(--danger);
            padding-bottom: 8px; margin-bottom: 12px;
        }

        .radar-title {
            font-size: 18px; font-weight: 900; color: var(--danger);
            text-transform: uppercase; letter-spacing: 3px; display: flex; align-items: center; gap: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            animation: pulseText 1.5s infinite;
        }
        
        @keyframes pulseText {
            0% { text-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }
            50% { text-shadow: 0 0 20px rgba(255, 51, 102, 0.9); }
            100% { text-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }
        }

        .radar-meta {
            font-size: 12px; font-weight: 900; color: #000;
            text-transform: uppercase; letter-spacing: 1px;
            background: var(--warning); padding: 4px 12px; border-radius: 4px;
        }

        .radar-content {
            background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 51, 102, 0.3); border-top: none;
            padding: 25px 30px; width: 100%; display: flex; flex-direction: column; gap: 15px;
        }

        .speed-display {
            display: flex; align-items: baseline; gap: 10px;
        }
        
        .speed-val {
            font-size: 56px; font-weight: 900; font-style: italic; color: var(--text-main);
            line-height: 1; text-shadow: var(--shadow-text); font-variant-numeric: tabular-nums;
        }
        
        .speed-unit {
            font-size: 20px; font-weight: 800; color: var(--danger); text-transform: uppercase;
        }

        .radar-details {
            display: flex; flex-direction: column; gap: 5px;
            border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;
        }

        .detail-row {
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .detail-label { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.5); text-transform: uppercase; }
        .detail-val { font-size: 14px; font-weight: 800; color: var(--text-main); }
        .detail-val.fine { color: var(--warning); font-size: 16px; }

    </style>
</head>
<body>

    <div class="radar-flash" id="radar-flash"></div>

    <div class="dev-tools">
        <button class="dev-btn" onclick="triggerRadar(145, 90, 1500, 'Route 68')">Simulează Radar (Mic)</button>
        <button class="dev-btn" onclick="triggerRadar(210, 120, 5000, 'Los Santos Freeway', true)">Simulează Radar (Suspendare)</button>
    </div>

    <div class="radar-wrapper" id="radar-ui">
        <div class="radar-header">
            <div class="radar-title"><i class="ph-bold ph-warning-circle"></i> RADAR VITEZĂ</div>
            <div class="radar-meta" id="radar-status">AMENDĂ AUTOMATĂ</div>
        </div>

        <div class="radar-content">
            <div class="speed-display">
                <div class="speed-val" id="radar-speed">145</div>
                <div class="speed-unit">KM/H</div>
            </div>
            
            <div class="radar-details">
                <div class="detail-row">
                    <span class="detail-label">Limita Zonală:</span>
                    <span class="detail-val" id="radar-limit">90 KM/H</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Locație:</span>
                    <span class="detail-val" id="radar-street">Route 68</span>
                </div>
                <div class="detail-row" style="margin-top: 10px;">
                    <span class="detail-label">Sancțiune:</span>
                    <span class="detail-val fine" id="radar-fine">-$1,500</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const radarUI = document.getElementById('radar-ui');
        const radarFlash = document.getElementById('radar-flash');
        let hideTimeout;

        function triggerRadar(speed, limit, fineAmount, streetName, licenseSuspended = false) {
            clearTimeout(hideTimeout);
            
            // 1. Efectul de Blitz (Flash)
            radarFlash.classList.add('active');
            setTimeout(() => {
                radarFlash.classList.remove('active');
            }, 100); // Flash-ul dispare extrem de repede

            // 2. Populare Date UI
            document.getElementById('radar-speed').innerText = speed;
            document.getElementById('radar-limit').innerText = `${limit} KM/H`;
            document.getElementById('radar-street').innerText = streetName;
            document.getElementById('radar-fine').innerText = `-$${fineAmount.toLocaleString()}`;

            const statusEl = document.getElementById('radar-status');
            if (licenseSuspended) {
                statusEl.innerText = "PERMIS SUSPENDAT";
                statusEl.style.background = "var(--danger)";
                statusEl.style.color = "#fff";
                document.getElementById('radar-fine').innerText += " + PERMIS";
            } else {
                statusEl.innerText = "AMENDĂ AUTOMATĂ";
                statusEl.style.background = "var(--warning)";
                statusEl.style.color = "#000";
            }

            // 3. Afișare UI
            setTimeout(() => {
                radarUI.classList.add('active');
            }, 150); // Mici delay dupa flash pentru a apărea UI-ul

            // 4. Ascundere Automată după 5 secunde
            hideTimeout = setTimeout(() => {
                radarUI.classList.remove('active');
            }, 5000);
        }
        
        // window.addEventListener('message', (event) => {
        //     if (event.data.action === "showRadar") {
        //         triggerRadar(event.data.speed, event.data.limit, event.data.fine, event.data.street, event.data.suspended);
        //     }
        // });
    </script>
</body>
</html>
