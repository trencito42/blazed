<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Interaction Menu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');

        :root {
            /* Palette Core - Acelasi Design System */
            --bg-base: rgba(13, 13, 20, 0.85); 
            --bg-panel: rgba(255, 255, 255, 0.03);
            --bg-hover: rgba(255, 255, 255, 0.08);
            --bg-input: rgba(0, 0, 0, 0.4);
            
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            
            --accent: #00ffcc; /* Cyan Principal */
            --warning: #ffcc00; /* Galben/Auriu pt Faction */
            --danger: #ff3366; /* Rosu pt Admin/Negative */
            --admin-glow: rgba(255, 51, 102, 0.15);
            
            --border: rgba(255, 255, 255, 0.1);
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background: url('https://placehold.co/1920x1080/1a1a24/1a1a24?text=FiveM+World+Background') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            user-select: none;
        }

        /* Fundal intunecat la deschiderea meniului (Optional, da focus vizual) */
        #interact-overlay {
            position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        
        #interact-overlay.visible { opacity: 1; pointer-events: all; }

        /* --- STREAMING_CHUNK: Cutia principala a meniului --- */
        .interact-box {
            width: 320px;
            background: var(--bg-base);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            display: flex; flex-direction: column;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
            
            transform: scale(0.9) translateY(20px);
            transition: var(--transition);
        }

        #interact-overlay.visible .interact-box { transform: scale(1) translateY(0); }

        /* Header Jucator Tinta */
        .target-header {
            padding: 25px 25px 20px 25px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 15px;
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            position: relative;
        }

        .target-avatar {
            width: 48px; height: 48px;
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--accent);
        }
        .target-avatar svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; }

        .target-info { display: flex; flex-direction: column; }
        .target-name { font-size: 16px; font-weight: 900; color: var(--text-main); letter-spacing: 0.5px; }
        .target-id { font-size: 11px; font-weight: 700; color: var(--accent); margin-top: 2px; }

        /* Iconita inchidere */
        .btn-close {
            position: absolute; top: 15px; right: 15px;
            width: 24px; height: 24px; border-radius: 50%;
            background: var(--bg-panel); display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); cursor: pointer; transition: var(--transition);
        }
        .btn-close:hover { background: var(--danger); color: white; transform: rotate(90deg);}
        .btn-close svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; }

        /* --- STREAMING_CHUNK: Grupuri de Actiuni --- */
        .action-container {
            padding: 15px 25px 25px 25px;
            display: flex; flex-direction: column; gap: 20px;
            max-height: 500px; overflow-y: auto;
        }
        
        .action-container::-webkit-scrollbar { width: 4px; }
        .action-container::-webkit-scrollbar-track { background: transparent; }
        .action-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .action-group { display: flex; flex-direction: column; gap: 8px; }
        
        .group-title {
            font-size: 10px; font-weight: 800; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1.5px;
            margin-bottom: 5px; padding-left: 5px;
            display: flex; align-items: center; gap: 6px;
        }

        /* Standard Buttons */
        .act-btn {
            background: var(--bg-panel); border: 1px solid transparent;
            padding: 12px 15px; border-radius: var(--radius-md);
            display: flex; align-items: center; gap: 12px;
            cursor: pointer; transition: var(--transition);
            color: var(--text-main); font-family: 'Montserrat', sans-serif;
        }
        .act-btn:hover { background: var(--bg-hover); transform: translateX(5px); }
        .act-icon { display: flex; align-items: center; justify-content: center; color: var(--accent); }
        .act-icon svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round;}
        .act-text { font-size: 13px; font-weight: 700; flex: 1; text-align: left; }

        /* Butoane Faction (Galben) */
        .group-faction .group-title { color: var(--warning); }
        .group-faction .act-btn:hover { background: rgba(255, 204, 0, 0.05); border-color: rgba(255, 204, 0, 0.3); }
        .group-faction .act-icon { color: var(--warning); }

        /* Butoane Admin (Rosu) */
        .group-admin .group-title { color: var(--danger); }
        .group-admin .act-btn { border: 1px solid rgba(255, 51, 102, 0.1); }
        .group-admin .act-btn:hover { background: var(--admin-glow); border-color: rgba(255, 51, 102, 0.4); }
        .group-admin .act-icon { color: var(--danger); }

        /* --- STREAMING_CHUNK: Notificari si Panou Demo --- */
        #notify {
            position: absolute; top: 30px; right: 30px; background: var(--accent); color: #000;
            padding: 15px 25px; border-radius: var(--radius-md); font-size: 13px; font-weight: 800; text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(0,255,204,0.4); transform: translateX(150%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100; display: flex; align-items: center; gap: 10px;
        }
        #notify.show { transform: translateX(0); }

        /* Demo Panel (Doar pt testare in browser) */
        .demo-panel {
            position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8);
            padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border);
            z-index: 1000; display: flex; flex-direction: column; gap: 15px;
        }
        .demo-panel h3 { margin: 0; font-size: 12px; color: var(--accent); text-transform: uppercase;}
        .demo-toggle { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; cursor: pointer;}
        .demo-toggle input { width: 16px; height: 16px; cursor: pointer;}
    </style>
</head>
<body>

    <!-- Panou pentru testare permisiuni -->
    <div class="demo-panel">
        <h3>Schimbă Permisiunile Tale</h3>
        <label class="demo-toggle">
            <input type="checkbox" id="chk-leader" onchange="updateMenuState()"> Lider Facțiune
        </label>
        <label class="demo-toggle">
            <input type="checkbox" id="chk-admin" onchange="updateMenuState()"> Acces ADMIN
        </label>
        <button class="act-btn" style="padding: 8px; font-size: 11px; justify-content: center; margin-top: 10px;" onclick="openMenu()">Apasă 'G' (Deschide)</button>
    </div>

    <!-- Notificare Toast -->
    <div id="notify">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:currentColor;stroke-width:3;fill:none;"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="notify-msg">Acțiune Reușită</span>
    </div>

    <!-- --- STREAMING_CHUNK: Structura Meniului Interact --- -->
    <div id="interact-overlay">
        <div class="interact-box" id="menu-box">
            
            <div class="target-header">
                <div class="btn-close" onclick="closeMenu()">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </div>
                <div class="target-avatar">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <div class="target-info">
                    <div class="target-name" id="ui-target-name">Mihai Dobre</div>
                    <div class="target-id">Jucător ID: <span id="ui-target-id">45</span></div>
                </div>
            </div>

            <div class="action-container">
                
                <!-- GENERAL ACTIONS -->
                <div class="action-group">
                    <div class="group-title">
                        <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                        Interacțiuni
                    </div>
                    
                    <div class="act-btn" onclick="performAction('trade')">
                        <div class="act-icon"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg></div>
                        <div class="act-text">Propune Schimb (Trade)</div>
                    </div>
                    
                    <div class="act-btn" onclick="performAction('give_cash')">
                        <div class="act-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div>
                        <div class="act-text">Oferă Bani Cash</div>
                    </div>

                    <div class="act-btn" onclick="performAction('show_id')">
                        <div class="act-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></div>
                        <div class="act-text">Arată Buletinul</div>
                    </div>

                    <div class="act-btn" onclick="performAction('add_contact')">
                        <div class="act-icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg></div>
                        <div class="act-text">Adaugă la Contacte</div>
                    </div>
                </div>

                <!-- FACTION ACTIONS (Conditional) -->
                <div class="action-group group-faction" id="group-faction" style="display: none; margin-top: 10px;">
                    <div class="group-title">
                        <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                        Acțiuni Lider Facțiune
                    </div>
                    
                    <div class="act-btn" onclick="performAction('faction_invite')">
                        <div class="act-icon"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
                        <div class="act-text">Invită în Facțiune</div>
                    </div>
                </div>

                <!-- ADMIN ACTIONS (Conditional) -->
                <div class="action-group group-admin" id="group-admin" style="display: none; margin-top: 10px;">
                    <div class="group-title">
                        <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                        Panou Administrare
                    </div>
                    
                    <div class="act-btn" onclick="performAction('admin_freeze')">
                        <div class="act-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>
                        <div class="act-text">Îngheață Jucător (Freeze)</div>
                    </div>

                    <div class="act-btn" onclick="performAction('admin_kick')">
                        <div class="act-icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></div>
                        <div class="act-text">Deconectează (Kick)</div>
                    </div>
                    
                    <div class="act-btn" onclick="performAction('admin_ban')" style="background: rgba(255, 51, 102, 0.1);">
                        <div class="act-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg></div>
                        <div class="act-text" style="color: var(--danger);">Banează Permanent</div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- --- STREAMING_CHUNK: JavaScript Logic --- -->
    <script>
        // Setari de baza pentru cine vizualizeaza meniul
        let myPermissions = {
            isLeader: false,
            isAdmin: false
        };

        let targetData = {
            id: 45,
            name: "Mihai Dobre"
        };

        // UI Elements
        const overlay = document.getElementById('interact-overlay');
        const factionGroup = document.getElementById('group-faction');
        const adminGroup = document.getElementById('group-admin');
        const notifyEl = document.getElementById('notify');
        const notifyMsg = document.getElementById('notify-msg');

        // Functie pentru testare din panoul din stanga sus
        function updateMenuState() {
            myPermissions.isLeader = document.getElementById('chk-leader').checked;
            myPermissions.isAdmin = document.getElementById('chk-admin').checked;

            // Actualizam vizibilitatea categoriilor
            factionGroup.style.display = myPermissions.isLeader ? 'flex' : 'none';
            adminGroup.style.display = myPermissions.isAdmin ? 'flex' : 'none';
        }

        // Deschidere Meniu
        function openMenu(data) {
            // In FiveM, parametrul `data` va contine info reale. Pt demo folosim targetData prestabilit
            if(data) {
                targetData = data.target;
                myPermissions = data.permissions;
                
                // Setare permisiuni UI
                factionGroup.style.display = myPermissions.isLeader ? 'flex' : 'none';
                adminGroup.style.display = myPermissions.isAdmin ? 'flex' : 'none';
            }

            document.getElementById('ui-target-name').innerText = targetData.name;
            document.getElementById('ui-target-id').innerText = targetData.id;
            
            overlay.classList.add('visible');
        }

        // Inchidere Meniu
        function closeMenu() {
            overlay.classList.remove('visible');
            // In FiveM: fetch(`https://${GetParentResourceName()}/closeUI`, { method: 'POST' });
        }

        // Procesare Actiuni Butoane
        function performAction(actionName) {
            // Animatie mica pe cutie pt feedback vizual
            const box = document.getElementById('menu-box');
            box.style.transform = 'scale(0.98)';
            setTimeout(() => box.style.transform = 'scale(1)', 100);

            // Aici trimiti request-ul la client.lua
            // ex: fetch(`https://${GetParentResourceName()}/triggerAction`, { method: 'POST', body: JSON.stringify({ action: actionName, targetId: targetData.id }) });

            // Demo feedback vizual (Notificari)
            let msg = "";
            let isError = false;

            switch(actionName) {
                case 'trade': msg = `Cerere de Trade trimisă lui ${targetData.name}`; break;
                case 'give_cash': msg = `Deschidere portofel pentru ${targetData.name}...`; break;
                case 'show_id': msg = `I-ai arătat buletinul lui ${targetData.name}`; break;
                case 'add_contact': msg = `${targetData.name} adăugat în telefon!`; break;
                
                case 'faction_invite': msg = `Invitație Facțiune trimisă!`; break;
                
                case 'admin_freeze': msg = `L-ai înghețat pe ID ${targetData.id}!`; break;
                case 'admin_kick': msg = `Jucătorul ID ${targetData.id} a primit KICK.`; isError = true; closeMenu(); break;
                case 'admin_ban': msg = `Jucătorul ID ${targetData.id} a fost BANAT.`; isError = true; closeMenu(); break;
            }

            showNotify(msg, isError);
        }

        // Notificare Toast
        function showNotify(msg, isError = false) {
            notifyMsg.innerText = msg;
            notifyEl.style.background = isError ? 'var(--danger)' : 'var(--accent)';
            notifyEl.style.color = isError ? '#fff' : '#000';
            
            // Schimbam iconita pe baza de tip eroare/succes
            if (isError) {
                notifyEl.querySelector('svg').innerHTML = '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>';
            } else {
                notifyEl.querySelector('svg').innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
            }

            notifyEl.classList.add('show');
            setTimeout(() => notifyEl.classList.remove('show'), 3000);
        }

        // Init pe onload pt demo
        window.onload = () => {
            updateMenuState();
        };

        // Inchidere pe ESC si Click afara
        document.onkeyup = function (data) {
            if (data.which == 27) closeMenu();
        };

        overlay.addEventListener('mousedown', function(e) {
            // Daca apesi direct pe overlay intunecat (afara din cutia meniului), se inchide
            if(e.target === overlay) {
                closeMenu();
            }
        });

        // Integrare NUI standard
        window.addEventListener('message', (event) => {
            if (event.data.action === "openInteract") openMenu(event.data);
            if (event.data.action === "closeInteract") closeMenu();
        });
    </script>
</body>
</html>
