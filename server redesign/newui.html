<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forza Style - Fixed Keypress Tracker</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            
            --theme-info: #00ffcc; 
            --theme-exam: #f59e0b; 
            --theme-job: #3b82f6;  
            --success: #10b981;    
            --danger: #ff3366;
            
            --shadow-text: 0 4px 10px rgba(0, 0, 0, 0.9);
            --transition-snappy: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background: url('https://images.unsplash.com/photo-1605806616949-1e87b487bc2a?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover; overflow: hidden; user-select: none;
        }

        .overlay { position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%); z-index: 0; }

        .dev-tools {
            position: absolute; top: 30px; left: 30px; z-index: 100;
            display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.8);
            padding: 15px; border-radius: 8px; color: white; font-size: 12px;
        }
        .dev-title { font-size: 11px; font-weight: 900; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .dev-row { display: flex; gap: 10px; }
        .dev-btn {
            background: transparent; color: var(--text-main); border: 1px solid var(--text-muted);
            padding: 8px 12px; border-radius: 4px; font-family: inherit; font-weight: 700;
            cursor: pointer; transition: 0.2s; font-size: 11px; text-transform: uppercase;
        }
        .dev-btn:hover { background: var(--text-main); color: #000; }

        /* --- OBJECTIVE TRACKER --- */
        .tutorial-wrapper {
            position: absolute; top: 40px; left: 50%;
            z-index: 20; display: flex; flex-direction: column; align-items: center;
            transform: translateX(-50%) skewX(-5deg);
            filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.8));
            width: 600px;
            opacity: 0; pointer-events: none; margin-top: -50px;
            transition: all 0.5s var(--transition-snappy);
        }

        .tutorial-wrapper.active { opacity: 1; margin-top: 0; pointer-events: all; }
        .tutorial-wrapper.minimized { width: 400px; top: 20px; filter: drop-shadow(0px 5px 10px rgba(0, 0, 0, 0.6)); }

        .tutorial-wrapper[data-theme="info"] { --current-theme: var(--theme-info); }
        .tutorial-wrapper[data-theme="exam"] { --current-theme: var(--theme-exam); }
        .tutorial-wrapper[data-theme="job"] { --current-theme: var(--theme-job); }

        .tut-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            width: 100%; border-bottom: 3px solid var(--current-theme);
            padding-bottom: 8px; margin-bottom: 12px; transition: all 0.4s var(--transition-snappy);
        }

        .tut-title {
            font-size: 16px; font-weight: 900; color: var(--current-theme);
            text-transform: uppercase; letter-spacing: 3px; display: flex; align-items: center; gap: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9); transition: all 0.4s ease;
        }
        .tutorial-wrapper.minimized .tut-title { font-size: 12px; letter-spacing: 2px; }
        .tutorial-wrapper.minimized .tut-title i { font-size: 14px; }

        .tut-meta {
            font-size: 13px; font-weight: 900; color: var(--text-main);
            text-transform: uppercase; letter-spacing: 1px;
            background: rgba(0,0,0,0.8); padding: 4px 12px; border-radius: 4px; transition: all 0.4s ease;
        }
        .tutorial-wrapper.minimized .tut-meta { font-size: 10px; padding: 2px 8px; }

        .tut-content {
            background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-top: none;
            padding: 25px 30px; width: 100%; display: flex; flex-direction: column; gap: 20px;
            transition: all 0.4s var(--transition-snappy);
        }
        .tutorial-wrapper.minimized .tut-content { padding: 15px 20px; gap: 10px; }

        .tut-instruction {
            font-size: 32px; font-weight: 900; font-style: italic; color: var(--text-main);
            text-transform: uppercase; letter-spacing: 1px; line-height: 1.1; text-shadow: var(--shadow-text);
            transition: all 0.4s var(--transition-snappy);
        }
        .tutorial-wrapper.minimized .tut-instruction { font-size: 18px; }

        .tut-details {
            display: flex; flex-direction: column; gap: 20px;
            max-height: 300px; opacity: 1; overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tutorial-wrapper.minimized .tut-details { max-height: 0; opacity: 0; gap: 0; margin-top: -10px; }

        .tut-desc { font-size: 14px; font-weight: 600; color: var(--text-muted); line-height: 1.5; font-style: normal; }

        /* --- ACTION PROMPT BOX --- */
        .action-box {
            display: flex; align-items: center; gap: 15px; background: rgba(0, 0, 0, 0.6);
            border-left: 4px solid var(--theme-base); padding: 15px 20px; transition: all 0.3s ease;
        }

        .action-box.success {
            border-left-color: var(--success); background: rgba(16, 185, 129, 0.1);
            box-shadow: inset 200px 0 100px -100px rgba(16, 185, 129, 0.2);
        }

        .action-text {
            font-size: 15px; font-weight: 700; color: var(--text-main);
            text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center;
        }

        /* --- TASTA FIZICA --- */
        .key-cap {
            display: inline-block; background: var(--text-main); color: #000;
            padding: 4px 14px; margin: 0 10px; border-radius: 4px; font-size: 20px; font-weight: 900; font-style: normal;
            box-shadow: 0 4px 0 #9ca3af, 0 5px 10px rgba(0,0,0,0.5); transform: skewX(5deg); transition: all 0.15s ease;
        }

        .key-cap.pressed {
            transform: skewX(5deg) translateY(4px); box-shadow: 0 0 0 #9ca3af, 0 0 0 rgba(0,0,0,0);
            background: var(--success); color: #fff;
        }

        .success-icon { display: none; font-size: 28px; color: var(--success); animation: popIn 0.3s var(--transition-snappy); }
        .action-box.success .success-icon { display: block; }
        .action-box.success .action-text { color: var(--success); text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }

        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        /* --- BARA DE PROGRES --- */
        .progress-container { display: flex; gap: 6px; width: 100%; margin-top: 5px; }
        .prog-segment { flex: 1; height: 8px; background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s; }
        .prog-segment.active { background: var(--current-theme); border-color: var(--current-theme); box-shadow: 0 0 10px var(--current-theme); }
        .prog-segment.completed { background: var(--success); border-color: var(--success); box-shadow: 0 0 10px var(--success); }

    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="dev-tools">
        <div class="dev-title">Testare Tutorial</div>
        <div class="dev-row">
            <button class="dev-btn" onclick="loadScenario('driving')">Start Examen Auto</button>
            <button class="dev-btn" onclick="toggleMinimize()">Toglează Mărimea</button>
        </div>
        <div style="margin-top: 5px; font-style: italic;">Apasă tastele 2, K, etc. de pe tastatură.</div>
    </div>

    <div class="tutorial-wrapper" id="tut-wrapper">
        <div class="tut-header" id="tut-header">
            <div class="tut-title" id="tut-title"><i class="ph-bold ph-info"></i> Titlu</div>
            <div class="tut-meta" id="tut-meta">PASUL 1</div>
        </div>

        <div class="tut-content">
            <div class="tut-instruction" id="tut-instruction">Instructiune Principala</div>
            
            <div class="tut-details" id="tut-details">
                <div class="tut-desc" id="tut-desc">Descriere completa</div>
                
                <div class="action-box" id="action-box">
                    <div class="action-text" id="action-text">
                        Apasă tasta <div class="key-cap" id="key-cap">E</div> pentru a continua.
                    </div>
                    <i class="ph-bold ph-check-circle success-icon"></i>
                </div>
            </div>

            <div class="progress-container" id="tut-progress"></div>
        </div>
    </div>

    <script>
        const scenarios = {
            'driving': {
                theme: 'exam', icon: 'ph-steering-wheel', title: 'Examen Auto Practic', showNav: false,
                steps: [
                    { inst: 'Pornește Motorul', desc: 'Înainte de a pleca la drum, asigura-te ca motorul este pornit.', actionPrefix: 'Apasă tasta', requiredKey: '2', actionSuffix: 'pentru motor.', meta: 'GREȘELI: 0/3' },
                    { inst: 'Pune Centura!', desc: 'Siguranța e pe primul loc. Dacă ești prins fără centură vei pica examenul.', actionPrefix: 'Folosește tasta', requiredKey: 'k', actionSuffix: 'pentru centură.', meta: 'GREȘELI: 0/3' },
                    { inst: 'Oprește la Semnul STOP', desc: 'Frânează complet în zona marcată. Așteaptă 3 secunde.', actionPrefix: 'Așteaptă la', requiredKey: null, actionSuffix: 'punctul marcat.', meta: 'GREȘELI: 0/3' }
                ]
            }
        };

        let currentScenario = null;
        let currentStepIdx = 0;
        let minimizeTimer = null;
        let isTransitioning = false;

        const wrapper = document.getElementById('tut-wrapper');
        const titleEl = document.getElementById('tut-title');
        const metaEl = document.getElementById('tut-meta');
        const instEl = document.getElementById('tut-instruction');
        const descEl = document.getElementById('tut-desc');
        const actionBox = document.getElementById('action-box');
        const actionText = document.getElementById('action-text');
        const progressEl = document.getElementById('tut-progress');

        function loadScenario(type) {
            currentScenario = scenarios[type];
            currentStepIdx = 0;
            
            wrapper.setAttribute('data-theme', currentScenario.theme);
            titleEl.innerHTML = `<i class="ph-bold ${currentScenario.icon}"></i> ${currentScenario.title}`;
            actionBox.style.borderLeftColor = `var(--theme-${currentScenario.theme})`;
            
            progressEl.innerHTML = '';
            for(let i=0; i<currentScenario.steps.length; i++) {
                const seg = document.createElement('div');
                seg.className = 'prog-segment';
                progressEl.appendChild(seg);
            }

            wrapper.classList.add('active');
            renderStep();
        }

        function renderStep() {
            if(!currentScenario) return;
            const step = currentScenario.steps[currentStepIdx];
            isTransitioning = false;

            wrapper.classList.remove('minimized');
            actionBox.classList.remove('success');
            actionBox.style.display = 'flex'; 

            instEl.style.transform = 'translateX(-20px)';
            instEl.style.opacity = '0';
            setTimeout(() => {
                instEl.style.transition = 'all 0.4s var(--transition-snappy)';
                instEl.style.transform = 'translateX(0)';
                instEl.style.opacity = '1';
            }, 10);

            instEl.innerText = step.inst;
            descEl.innerText = step.desc;
            metaEl.innerText = step.meta;

            if (step.requiredKey) {
                actionText.innerHTML = `${step.actionPrefix} <div class="key-cap" id="key-cap">${step.requiredKey.toUpperCase()}</div> ${step.actionSuffix}`;
            } else {
                actionBox.style.display = 'none'; 
            }

            const segments = document.querySelectorAll('.prog-segment');
            segments.forEach((seg, idx) => {
                seg.className = 'prog-segment';
                if (idx < currentStepIdx) seg.classList.add('completed');
                if (idx === currentStepIdx) seg.classList.add('active');
            });

            clearTimeout(minimizeTimer);
            minimizeTimer = setTimeout(() => {
                wrapper.classList.add('minimized');
            }, 4000);
        }

        function triggerSuccess() {
            if (isTransitioning) return;
            isTransitioning = true;
            clearTimeout(minimizeTimer); 
            wrapper.classList.remove('minimized'); 

            const keyCap = document.getElementById('key-cap');
            const keyText = keyCap ? keyCap.innerText : ''; // Salvam textul tastei

            if(keyCap) keyCap.classList.add('pressed');
            actionBox.classList.add('success');
            
            // REPARAM BUG-UL AICI: Re-inseram tasta deja apasata vizual in noul text
            if(keyCap) {
                actionText.innerHTML = `<div class="key-cap pressed" style="margin-left: 0;">${keyText}</div> Acțiune Confirmată!`;
            }

            // Marim timeout-ul la 1.5 secunde ca sa te bucuri de animatie
            setTimeout(() => {
                if (currentStepIdx < currentScenario.steps.length - 1) {
                    currentStepIdx++;
                    renderStep();
                } else {
                    wrapper.classList.remove('minimized');
                    instEl.innerText = "Finalizat!";
                    actionBox.style.display = 'none';
                    document.getElementById('tut-header').style.borderColor = 'var(--success)';
                    document.getElementById('tut-title').style.color = 'var(--success)';
                    document.querySelectorAll('.prog-segment').forEach(s => s.classList.replace('active', 'completed'));
                    setTimeout(() => wrapper.classList.remove('active'), 2000);
                }
            }, 1500); 
        }

        function toggleMinimize() {
            wrapper.classList.toggle('minimized');
        }

        document.addEventListener('keydown', (e) => {
            if (!currentScenario || isTransitioning || currentStepIdx >= currentScenario.steps.length) return;
            const step = currentScenario.steps[currentStepIdx];
            if (step.requiredKey && e.key.toLowerCase() === step.requiredKey.toLowerCase()) {
                triggerSuccess();
            }
        });

        // Autoload pentru demo
        setTimeout(() => loadScenario('driving'), 500);

    </script>
</body>
</html>
