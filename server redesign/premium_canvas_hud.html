<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forza Style Premium HUD</title>
    <style>
        /* Importam un font sportiv, curat si modern */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,900;1,800;1,900&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* Fundal intunecat pentru contrastul de tip "Noapte" */
            background: radial-gradient(circle at center, #1a1a24 0%, #0d0d14 100%);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* Containerul HUD-ului - in FiveM il pui in dreapta-jos */
        #hud-wrapper {
            position: relative;
            width: 450px;
            height: 450px;
            filter: drop-shadow(0px 15px 25px rgba(0, 0, 0, 0.7));
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* O mica notita vizuala pentru mediul de test */
        .demo-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-left: 3px solid #ff3366;
            padding-left: 10px;
        }
    </style>
</head>
<body>

    <div class="demo-badge">
        Forza HUD Engine<br>
        <span style="color: #ff3366;">Live Simulation Active</span>
    </div>

    <div id="hud-wrapper">
        <canvas id="speedoCanvas"></canvas>
    </div>

    <script>
        // Fixam preluarea elementului (aici era problema data trecuta)
        const canvas = document.getElementById('speedoCanvas');
        const ctx = canvas.getContext('2d');

        // Configurare High-DPI pentru grafica ultra-clara (Anti-Aliasing perfect)
        const size = 450;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        ctx.scale(dpr, dpr);

        // Parametrii geometrici centrali
        const CX = size / 2;
        const CY = size / 2 + 20;
        const RADIUS = 140;

        // Unghiurile pentru inel (design asimetric tip Forza)
        const START_ANGLE = 0.80 * Math.PI; // Incepe stanga jos
        const END_ANGLE = 2.20 * Math.PI;   // Se termina dreapta jos
        const ARC_RANGE = END_ANGLE - START_ANGLE;
        const MAX_SPEED = 320;

        // Paleta de culori premium
        const theme = {
            darkRing: 'rgba(255, 255, 255, 0.05)',
            tickBase: 'rgba(255, 255, 255, 0.15)',
            white: '#ffffff',
            redline: '#ff3366',    // Un rosu/roz electric de warning
            success: '#00ffcc',    // Cyan/Verde modern pentru elemente active/ok
            warning: '#ffcc00',    // Galben pentru motor stricat / lock
            muted: 'rgba(255, 255, 255, 0.4)'
        };

        // State-ul HUD-ului. `target` = valoarea fizica; `current` = valoarea randata (pentru fluiditate)
        let state = {
            targetSpeed: 0, currentSpeed: 0,
            targetFuel: 100, currentFuel: 100,
            targetHealth: 100, currentHealth: 100,
            odo: 12504.3,
            engineOn: true,
            locked: false,
            seatbelt: false
        };

        // Interpolare liniara - face miscarea acului/barelor organica si fluida
        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        // Functie helper pentru dreptunghiuri cu margini rotunjite
        function drawRoundedRect(ctx, x, y, w, h, r, fill, fillStyle) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            
            if (fill) {
                ctx.fillStyle = fillStyle;
                ctx.fill();
            } else {
                ctx.strokeStyle = fillStyle;
                ctx.stroke();
            }
        }

        // Desenare iconita minimalista de bord (Pill shape)
        function drawDashboardIcon(x, y, label, isActive, activeColor) {
            const w = 42;
            const h = 20;
            const r = 4; // Colțuri subtil rotunjite
            const sx = x - w/2;
            const sy = y - h/2;

            // Fundal
            const bgColor = isActive ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.4)';
            drawRoundedRect(ctx, sx, sy, w, h, r, true, bgColor);

            // Bara minuscula colorata sus pt aspect hi-tech
            if (isActive) {
                drawRoundedRect(ctx, sx, sy, w, 2, 1, true, activeColor);
            }

            // Text
            ctx.fillStyle = isActive ? theme.white : theme.muted;
            ctx.font = "bold 10px Montserrat";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(label, x, y + 1);
            
            // Glow efect daca e activ
            if (isActive) {
                ctx.shadowBlur = 8;
                ctx.shadowColor = activeColor;
                ctx.fillText(label, x, y + 1);
                ctx.shadowBlur = 0;
            }
        }

        function render() {
            // Curatam canvasul complet la fiecare frame (60 FPS)
            ctx.clearRect(0, 0, size, size);

            // 1. Interpolare (Lerp) pentru a aduce valoarea afisata aproape de valoarea tinta fizica
            state.currentSpeed = lerp(state.currentSpeed, state.targetSpeed, 0.1);
            state.currentFuel = lerp(state.currentFuel, state.targetFuel, 0.05);
            state.currentHealth = lerp(state.currentHealth, state.targetHealth, 0.05);

            let speedPct = Math.min(state.currentSpeed / MAX_SPEED, 1.0);
            let currentAngle = START_ANGLE + (ARC_RANGE * speedPct);
            let displaySpeed = Math.floor(state.currentSpeed);

            // 2. Fundal Arc (Inelul oprit)
            ctx.beginPath();
            ctx.arc(CX, CY, RADIUS + 15, START_ANGLE, END_ANGLE);
            ctx.lineWidth = 4;
            ctx.strokeStyle = theme.darkRing;
            ctx.lineCap = 'round';
            ctx.stroke();

            // 3. Tick Marks (Liniutele care definesc vitezometrul)
            const tickCount = 70;
            for (let i = 0; i <= tickCount; i++) {
                let pct = i / tickCount;
                let angle = START_ANGLE + (ARC_RANGE * pct);
                let isMajor = i % 10 === 0;
                let isRedline = pct > 0.85; // Ultimii 15% reprezinta redline-ul
                
                let length = isMajor ? 12 : 5;
                let innerRadius = RADIUS - length;
                
                let x1 = CX + Math.cos(angle) * innerRadius;
                let y1 = CY + Math.sin(angle) * innerRadius;
                let x2 = CX + Math.cos(angle) * RADIUS;
                let y2 = CY + Math.sin(angle) * RADIUS;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineWidth = isMajor ? 3 : 1.5;
                
                // Colorare dinamica: aprinde liniuta daca viteza a trecut de ea
                if (angle <= currentAngle) {
                    ctx.strokeStyle = isRedline ? theme.redline : theme.white;
                    if(isMajor) {
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = ctx.strokeStyle;
                    }
                } else {
                    ctx.strokeStyle = isRedline ? 'rgba(255, 51, 102, 0.3)' : theme.tickBase;
                }
                
                ctx.stroke();
                ctx.shadowBlur = 0; // Reset shadow pt restul
            }

            // 4. Inelul Activ (Care creste odata cu viteza - glow effect)
            if (speedPct > 0.01) {
                ctx.beginPath();
                ctx.arc(CX, CY, RADIUS + 15, START_ANGLE, currentAngle);
                ctx.lineWidth = 4;
                ctx.strokeStyle = speedPct > 0.85 ? theme.redline : theme.white;
                ctx.lineCap = 'round';
                
                ctx.shadowBlur = 12;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // 5. Text Central Viteza (Stil Forza: Mare, Italic, Agresiv)
            ctx.fillStyle = theme.white;
            // Folosim "italic 900" pentru un aspect de racing
            ctx.font = "italic 900 78px Montserrat";
            ctx.textAlign = "center";
            ctx.textBaseline = "alphabetic";
            
            // Formatare cu 3 cifre, cu transparenta pentru zero-urile din fata
            let speedStr = displaySpeed.toString().padStart(3, '0');
            let xOffset = CX - 35; // Centrare manuala
            
            for(let i=0; i<3; i++) {
                let char = speedStr[i];
                if (char === '0' && displaySpeed < Math.pow(10, 2-i) && i < 2) {
                    ctx.fillStyle = 'rgba(255,255,255,0.15)'; // Zero-uri ascunse
                } else {
                    ctx.fillStyle = theme.white;
                }
                ctx.fillText(char, xOffset, CY + 10);
                xOffset += 50;
            }

            // Unitatea de masura sub vitezometru
            ctx.fillStyle = theme.muted;
            ctx.font = "italic 700 14px Montserrat";
            ctx.fillText("KM/H", CX, CY + 35);

            // 6. Icoane de status (Sus de tot)
            drawDashboardIcon(CX - 50, CY - 85, "ENG", state.engineOn, theme.success);
            drawDashboardIcon(CX, CY - 100, "LCK", state.locked, theme.warning);
            drawDashboardIcon(CX + 50, CY - 85, "BLT", state.seatbelt, theme.success);

            // 7. Bare de progres inferioare (Fuel & Health)
            const barW = 80;
            const barH = 4;
            
            // Fuel (Stanga)
            let fX = CX - 95;
            let fY = CY + 80;
            ctx.fillStyle = theme.muted;
            ctx.font = "bold 10px Montserrat";
            ctx.textAlign = "left";
            ctx.fillText("FUEL", fX, fY - 6);
            
            drawRoundedRect(ctx, fX, fY, barW, barH, 2, true, 'rgba(255,255,255,0.1)'); // Fundal bara
            let fuelColor = state.currentFuel < 20 ? theme.redline : theme.white;
            drawRoundedRect(ctx, fX, fY, barW * (Math.max(0, state.currentFuel)/100), barH, 2, true, fuelColor);

            // Health (Dreapta)
            let hX = CX + 15;
            let hY = CY + 80;
            ctx.fillStyle = theme.muted;
            ctx.textAlign = "right";
            ctx.fillText("HLTH", hX + barW, hY - 6);
            
            drawRoundedRect(ctx, hX, hY, barW, barH, 2, true, 'rgba(255,255,255,0.1)'); // Fundal bara
            let hlthColor = state.currentHealth < 35 ? theme.redline : theme.success;
            drawRoundedRect(ctx, hX, hY, barW * (Math.max(0, state.currentHealth)/100), barH, 2, true, hlthColor);

            // 8. Odometer (Mijloc jos)
            ctx.fillStyle = theme.muted;
            ctx.font = "bold 11px Montserrat";
            ctx.textAlign = "center";
            let formattedOdo = state.odo.toFixed(1).padStart(7, '0');
            ctx.fillText(`ODO  ${formattedOdo}`, CX, CY + 125);
        }

        // Loop principal (ruleaza la refresh rate-ul monitorului)
        function animate() {
            render();
            requestAnimationFrame(animate);
        }

        // Pornim simularea cand se incarca fonturile si pagina
        document.fonts.ready.then(function () {
            animate();
            
            // ===== SISTEM DE SIMULARE (Doar pentru DEMO) =====
            // In joc, vei inlocui asta cu mesajele primite din FiveM (SendNUIMessage)
            let phase = 0;
            setInterval(() => {
                phase++;
                
                // Simulam accelerarea masinii in trepte (Oras, Autostrada, Top Speed, Franare)
                if (phase % 4 === 1) state.targetSpeed = Math.random() * 80 + 30; // 30-110 km/h
                if (phase % 4 === 2) state.targetSpeed = Math.random() * 100 + 120; // 120-220 km/h
                if (phase % 4 === 3) state.targetSpeed = Math.random() * 60 + 260; // Redline 260+
                if (phase % 4 === 0) state.targetSpeed = 0; // Franare la 0
                
                // Simulam consumul
                state.targetFuel -= Math.random() * 15;
                if(state.targetFuel < -10) state.targetFuel = 100; // Alimentare
                
                // Simulam uzura motorului
                if (Math.random() > 0.7) state.targetHealth -= Math.random() * 30;
                if (state.targetHealth < 0) state.targetHealth = 100; // Reparare

                // Actualizam odometrul in functie de viteza
                state.odo += (state.targetSpeed * 0.005);

                // Schimbam statusurile aleatoriu pt prezentare
                state.engineOn = state.targetSpeed > 0 || Math.random() > 0.2;
                state.locked = Math.random() > 0.8;
                state.seatbelt = Math.random() > 0.4;

            }, 2000); // Modifica situatia o data la 2 secunde
        });

    </script>
</body>
</html>
