<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Vehicle Menu</title>
    <style>
        /* Acelasi font sportiv si modern */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap');

        :root {
            --bg-base: rgba(13, 13, 20, 0.85); /* Fundal principal tip sticla */
            --bg-panel: rgba(255, 255, 255, 0.03);
            --bg-hover: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            --accent: #00ffcc; /* Cyan modern */
            --warning: #ffcc00;
            --danger: #ff3366; /* Rosu neon */
            --border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background: url('https://placehold.co/1920x1080/1a1a24/1a1a24?text=FiveM+Background') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        /* Containerul Meniului */
        #vmenu-wrapper {
            width: 850px;
            height: 550px;
            background: var(--bg-base);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: row;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            
            /* Animatie de intrare */
            opacity: 0;
            transform: scale(0.95) translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #vmenu-wrapper.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Partea Stanga: Lista Masini */
        .vmenu-sidebar {
            width: 40%;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 25px 25px 15px 25px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 900;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar-header p {
            margin: 5px 0 0 0;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .vehicle-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Scrollbar custom */
        .vehicle-list::-webkit-scrollbar { width: 4px; }
        .vehicle-list::-webkit-scrollbar-track { background: transparent; }
        .vehicle-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .vehicle-item {
            background: var(--bg-panel);
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .vehicle-item:hover {
            background: var(--bg-hover);
        }

        .vehicle-item.selected {
            background: rgba(0, 255, 204, 0.05);
            border-color: rgba(0, 255, 204, 0.3);
        }

        .vehicle-item.selected::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--accent);
            border-radius: 4px 0 0 4px;
        }

        .v-model {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .v-plate {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            background: rgba(0, 255, 204, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            letter-spacing: 1px;
        }

        .v-status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-garage { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .status-out { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
        .status-impound { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

        /* Partea Dreapta: Detalii */
        .vmenu-content {
            width: 60%;
            display: flex;
            flex-direction: column;
            padding: 40px;
            position: relative;
        }

        #no-selection {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            z-index: 10;
        }

        #detail-panel {
            display: none;
            flex-direction: column;
            height: 100%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .detail-header {
            margin-bottom: 30px;
        }

        .detail-class {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .detail-name {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-main);
            margin: 0 0 10px 0;
            line-height: 1.1;
        }

        .detail-status-text {
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
        }

        /* Bare de Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 8px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .stat-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Butoane Actiune */
        .action-buttons {
            margin-top: auto;
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 15px 0;
            border: none;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--text-main);
            color: #000;
        }

        .btn-primary:hover {
            background: var(--accent);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .close-hint {
            position: absolute;
            bottom: -30px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="vmenu-wrapper">
        <!-- Partea Stanga -->
        <div class="vmenu-sidebar">
            <div class="sidebar-header">
                <h1>Garaj Personal</h1>
                <p>Selectează un vehicul pentru detalii</p>
            </div>
            <div class="vehicle-list" id="vehicle-list">
                <!-- Generat prin JS -->
            </div>
        </div>

        <!-- Partea Dreapta -->
        <div class="vmenu-content">
            <div id="no-selection">Niciun vehicul selectat</div>
            
            <div id="detail-panel">
                <div class="detail-header">
                    <div class="detail-class" id="det-class">SPORT</div>
                    <h2 class="detail-name" id="det-name">NISSAN GT-R</h2>
                    <div class="detail-status-text">
                        <span id="det-status-dot" style="color: var(--accent);">●</span>
                        <span id="det-status-text">In Garaj (Legion Square)</span>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">
                            <span>SĂNĂTATE MOTOR</span>
                            <span id="det-health-val">100%</span>
                        </div>
                        <div class="stat-bar-bg">
                            <div class="stat-bar-fill" id="det-health-bar" style="background: var(--accent); width: 100%;"></div>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">
                            <span>COMBUSTIBIL</span>
                            <span id="det-fuel-val">80%</span>
                        </div>
                        <div class="stat-bar-bg">
                            <div class="stat-bar-fill" id="det-fuel-bar" style="background: var(--text-main); width: 80%;"></div>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" id="btn-spawn">Scoate Vehicul</button>
                    <button class="btn btn-secondary" id="btn-gps">Setează GPS</button>
                </div>
            </div>
        </div>
        
        <div class="close-hint">APASĂ ESC PENTRU A ÎNCHIDE</div>
    </div>

    <script>
        // --- DATE DE TEST (SIMULARE BAZĂ DE DATE FIVEM) ---
        const myVehicles = [
            { id: 1, plate: "B 77 XOD", model: "NISSAN GT-R R35", class: "SUPER", fuel: 85, health: 95, status: "GARAGE", location: "Garaj Central" },
            { id: 2, plate: "RO 10 AMG", model: "MERCEDES G63", class: "SUV", fuel: 32, health: 45, status: "OUT", location: "Pe Stradă" },
            { id: 3, plate: "CJ 99 RUN", model: "PORSCHE 911", class: "SPORT", fuel: 100, health: 100, status: "GARAGE", location: "Garaj Vinewood" },
            { id: 4, plate: "FIVEM 1", model: "BMW M5 F90", class: "SEDAN", fuel: 15, health: 12, status: "IMPOUND", location: "Secția de Poliție" },
            { id: 5, plate: "DR1FT", model: "TOYOTA SUPRA MK4", class: "SPORT", fuel: 60, health: 80, status: "GARAGE", location: "Garaj Central" }
        ];

        let selectedVehicleId = null;

        // --- FUNCȚII UI ---
        
        // Randează lista din stânga
        function renderVehicleList(vehicles) {
            const listEl = document.getElementById('vehicle-list');
            listEl.innerHTML = '';

            vehicles.forEach(v => {
                const el = document.createElement('div');
                el.className = `vehicle-item ${selectedVehicleId === v.id ? 'selected' : ''}`;
                el.onclick = () => selectVehicle(v.id, vehicles);

                // Determinam culoarea punctului de status
                let statusClass = 'status-garage';
                if(v.status === 'OUT') statusClass = 'status-out';
                if(v.status === 'IMPOUND') statusClass = 'status-impound';

                el.innerHTML = `
                    <div class="v-model">${v.model}</div>
                    <div class="v-plate">${v.plate}</div>
                    <div class="v-status-badge ${statusClass}"></div>
                `;
                listEl.appendChild(el);
            });
        }

        // Se execută la click pe o mașină
        function selectVehicle(id, allVehicles) {
            selectedVehicleId = id;
            renderVehicleList(allVehicles); // Re-randăm pt a adăuga clasa 'selected'
            
            const v = allVehicles.find(x => x.id === id);
            if(!v) return;

            document.getElementById('no-selection').style.display = 'none';
            const panel = document.getElementById('detail-panel');
            panel.style.display = 'flex';

            // Actualizare Text
            document.getElementById('det-class').innerText = v.class;
            document.getElementById('det-name').innerText = v.model;
            
            // Status Logic
            const statusDot = document.getElementById('det-status-dot');
            const statusText = document.getElementById('det-status-text');
            const btnSpawn = document.getElementById('btn-spawn');
            const btnGps = document.getElementById('btn-gps');

            if (v.status === 'GARAGE') {
                statusDot.style.color = 'var(--accent)';
                statusText.innerText = `În ${v.location}`;
                btnSpawn.innerText = "Scoate Vehicul";
                btnSpawn.disabled = false;
                btnGps.disabled = true;
            } else if (v.status === 'OUT') {
                statusDot.style.color = 'var(--warning)';
                statusText.innerText = `Parcată afară`;
                btnSpawn.innerText = "Vehicul Scos";
                btnSpawn.disabled = true;
                btnGps.disabled = false;
            } else if (v.status === 'IMPOUND') {
                statusDot.style.color = 'var(--danger)';
                statusText.innerText = `Confiscată (${v.location})`;
                btnSpawn.innerText = "Plătește Cautiune";
                btnSpawn.disabled = false;
                btnGps.disabled = false;
            }

            // Animare progres bare (delay mic pt tranzitie css fluida)
            setTimeout(() => {
                // Health
                const hBar = document.getElementById('det-health-bar');
                hBar.style.width = v.health + '%';
                hBar.style.background = v.health < 30 ? 'var(--danger)' : 'var(--accent)';
                document.getElementById('det-health-val').innerText = v.health + '%';

                // Fuel
                const fBar = document.getElementById('det-fuel-bar');
                fBar.style.width = v.fuel + '%';
                fBar.style.background = v.fuel < 20 ? 'var(--warning)' : 'var(--text-main)';
                document.getElementById('det-fuel-val').innerText = v.fuel + '%';
            }, 50);
        }

        // --- INTEGRARE FIVEM LUA ---
        window.addEventListener('message', (event) => {
            const data = event.data;

            if (data.action === "openMenu") {
                // Afisam UI-ul si încărcăm vehiculele primite de la server
                document.getElementById('vmenu-wrapper').classList.add('visible');
                renderVehicleList(data.vehicles);
            } 
            else if (data.action === "closeMenu") {
                document.getElementById('vmenu-wrapper').classList.remove('visible');
            }
        });

        // Inchidere meniu la apasarea ESC
        document.onkeyup = function (data) {
            if (data.which == 27) { // 27 = ESC key
                document.getElementById('vmenu-wrapper').classList.remove('visible');
                
                // Trimitem inapoi la Lua sa stie ca s-a inchis
                // fetch(`https://${GetParentResourceName()}/closeMenu`, { method: 'POST' });
            }
        };

        // --- PENTRU PREVIEW BROWSER DEMO ---
        // Afisam automat meniul cand pagina se incarca (doar pt testare)
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('vmenu-wrapper').classList.add('visible');
                renderVehicleList(myVehicles);
                selectVehicle(1, myVehicles); // Selectam prima masina automat
            }, 500); // 0.5s delay pt a vedea animatia
        };

    </script>
</body>
</html>
