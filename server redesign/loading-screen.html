<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forza Style - Loading Screen</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap');

        :root {
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --accent: #00ffcc; /* Cyan Neon */
            --danger: #ff3366;
            
            --shadow-heavy: 0 10px 30px rgba(0, 0, 0, 0.9);
            --shadow-text: 0 4px 12px rgba(0, 0, 0, 0.9);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #050508;
            overflow: hidden; user-select: none;
        }

        /* --- CINEMATIC BACKGROUND --- */
        .bg-container {
            position: absolute; inset: 0; z-index: 0;
            /* Poza de fundal - ideal un screenshot epic din joc */
            background: url('https://images.unsplash.com/photo-1605806616949-1e87b487bc2a?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            animation: slowPan 40s linear infinite alternate;
        }

        @keyframes slowPan {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-2%, 2%); }
        }

        /* Vignetă pentru a garanta că textul se citește perfect */
        .vignette {
            position: absolute; inset: 0; z-index: 1;
            background: radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
        }

        /* --- MASTER HUD WRAPPER (Inclinat) --- */
        .hud-wrapper {
            position: absolute; inset: 0; z-index: 10;
            padding: 60px;
            display: flex; flex-direction: column; justify-content: space-between;
            /* Asta da efectul de viteza/HUD auto */
            transform: skewX(-6deg);
        }

        /* --- TOP LEFT: BRANDING --- */
        .brand-container {
            display: flex; flex-direction: column; align-items: flex-start;
            filter: drop-shadow(var(--shadow-text));
        }

        .brand-title {
            font-size: 64px; font-weight: 900; font-style: italic;
            color: var(--text-main); text-transform: uppercase;
            letter-spacing: 2px; line-height: 0.9;
        }

        .brand-title span { color: var(--accent); }

        .brand-subtitle {
            font-size: 16px; font-weight: 800; color: var(--text-muted);
            letter-spacing: 6px; text-transform: uppercase; margin-top: 5px;
            padding-left: 5px; border-left: 4px solid var(--accent);
        }

        /* --- BOTTOM AREA: SPLIT LAYOUT --- */
        .bottom-area {
            display: flex; justify-content: space-between; align-items: flex-end;
            width: 100%;
        }

        /* --- BOTTOM LEFT: DYNAMIC TIPS --- */
        .tips-container {
            max-width: 450px;
            filter: drop-shadow(var(--shadow-text));
        }

        .tips-header {
            font-size: 12px; font-weight: 900; color: var(--accent);
            text-transform: uppercase; letter-spacing: 3px;
            display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
        }

        .tips-header::before {
            content: ''; display: block; width: 12px; height: 12px;
            background: var(--accent); border-radius: 50%;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 204, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
        }

        .tips-text {
            font-size: 16px; font-weight: 700; font-style: italic; color: var(--text-main);
            line-height: 1.5; min-height: 48px;
            transition: opacity 0.4s ease;
        }

        /* --- BOTTOM RIGHT: SPEEDOMETER LOADING --- */
        .speedometer-loading {
            display: flex; flex-direction: column; align-items: flex-end;
            filter: drop-shadow(var(--shadow-heavy));
        }

        /* Numarul masiv */
        .massive-pct {
            font-size: 180px; font-weight: 900; font-style: italic;
            color: var(--text-main); line-height: 0.75;
            letter-spacing: -5px; margin-bottom: 10px;
            /* Cifre tabulare pt a nu "sări" cand se schimba numerele */
            font-variant-numeric: tabular-nums; 
        }

        .massive-pct span {
            font-size: 60px; color: var(--accent); letter-spacing: 0;
            margin-left: -5px;
        }

        /* Status Text (ex: Se descarca fisierele...) */
        .loading-status-text {
            font-size: 14px; font-weight: 800; color: var(--text-main);
            text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
        }

        .loading-status-text .file-count {
            color: var(--accent); font-weight: 900;
        }

        /* RPM Style Progress Bar */
        .rpm-bar-container {
            display: flex; gap: 4px; width: 400px; height: 16px;
        }

        .rpm-segment {
            flex: 1; background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            transition: background 0.1s linear, box-shadow 0.1s linear;
        }

        .rpm-segment.active {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        /* Adaugam cateva segmente rosii la final (Redline) */
        .rpm-segment.active.redline {
            background: var(--danger);
            border-color: var(--danger);
            box-shadow: 0 0 10px var(--danger);
        }

    </style>
</head>
<body>

    <div class="bg-container"></div>
    <div class="vignette"></div>

    <div class="hud-wrapper">
        
        <!-- BRANDING SUS -->
        <div class="brand-container">
            <div class="brand-title">XODO <span>RP</span></div>
            <div class="brand-subtitle">Est. 2026 &middot; Los Santos</div>
        </div>

        <!-- ZONA DE JOS -->
        <div class="bottom-area">
            
            <!-- TIPS STANGA -->
            <div class="tips-container">
                <div class="tips-header">Informații Server</div>
                <div class="tips-text" id="tip-text">
                    Respectă regulile de Roleplay în orice moment. Folosește tasta G pentru meniul rapid de interacțiune.
                </div>
            </div>

            <!-- SPEEDOMETER LOADING DREAPTA -->
            <div class="speedometer-loading">
                <div class="massive-pct" id="loading-pct">0<span>%</span></div>
                
                <div class="loading-status-text">
                    <span id="loading-task">Se inițializează motorul grafic...</span>
                    <span class="file-count" id="loading-files"></span>
                </div>

                <!-- Turometrul (Segmentele generate din JS) -->
                <div class="rpm-bar-container" id="rpm-bar">
                    <!-- Segmente generate automat -->
                </div>
            </div>

        </div>

    </div>

    <script>
        // 1. GENERAM SEGMENTELE PENTRU RPM BAR
        const rpmContainer = document.getElementById('rpm-bar');
        const TOTAL_SEGMENTS = 25; // Cate "liniute" are turometrul

        for (let i = 0; i < TOTAL_SEGMENTS; i++) {
            let segment = document.createElement('div');
            segment.className = 'rpm-segment';
            // Ultimele 3 segmente sunt "Redline"
            if (i >= TOTAL_SEGMENTS - 3) {
                segment.classList.add('is-redline');
            }
            rpmContainer.appendChild(segment);
        }
        const segments = document.querySelectorAll('.rpm-segment');

        // 2. SIMULARE ACCELERATIE / LOADING
        const pctEl = document.getElementById('loading-pct');
        const taskEl = document.getElementById('loading-task');
        const filesEl = document.getElementById('loading-files');

        const tasks = [
            "Se descarcă pachetele de sunet",
            "Se încarcă vehiculele custom",
            "Sincronizare inventar jucător",
            "Generare LOD-uri hartă",
            "Validare conexiune server"
        ];

        let currentPct = 0;
        
        // Simulam o incarcare care se comporta ca un motor (sare in ture, incetineste)
        function updateLoading() {
            if (currentPct >= 100) {
                pctEl.innerHTML = `100<span>%</span>`;
                taskEl.innerText = "Pregătit! Intrăm în sesiune...";
                filesEl.innerText = "";
                // Umplem toate segmentele
                segments.forEach((seg) => {
                    seg.classList.add('active');
                    if (seg.classList.contains('is-redline')) seg.classList.add('redline');
                });
                return;
            }

            // Calculam un salt random pentru "acceleratie"
            let jump = Math.random() * 2.5;
            currentPct += jump;
            if (currentPct > 100) currentPct = 100;

            // Update text numar masiv
            pctEl.innerHTML = `${Math.floor(currentPct)}<span>%</span>`;

            // Update "Viteza / Fisiere" ca sa para tehnologic
            if (currentPct < 90) {
                let mbLoaded = Math.floor(currentPct * 14.5);
                filesEl.innerText = `${mbLoaded} MB / 1450 MB`;
            } else {
                filesEl.innerText = "COMPLET";
            }

            // Update texte status
            let taskIdx = Math.floor((currentPct / 100) * tasks.length);
            if (taskIdx >= tasks.length) taskIdx = tasks.length - 1;
            taskEl.innerText = tasks[taskIdx] + "...";

            // Update RPM Bar (aprindem liniutele in functie de progres)
            let segmentsToLight = Math.floor((currentPct / 100) * TOTAL_SEGMENTS);
            segments.forEach((seg, idx) => {
                if (idx < segmentsToLight) {
                    seg.classList.add('active');
                    if (seg.classList.contains('is-redline')) seg.classList.add('redline');
                } else {
                    seg.classList.remove('active', 'redline');
                }
            });

            // Re-apelam functia cu un delay random pentru a simula "suturile" de net
            let nextTick = Math.random() * 150 + 50; 
            setTimeout(updateLoading, nextTick);
        }

        // Start simulare
        setTimeout(updateLoading, 500);

        // 3. ROTIRE TIPS (Mecanism clasic)
        const tips = [
            "Poți ajusta volumul vocal din setările jocului. HUD-ul îți va arăta raza de acțiune.",
            "Vehiculele lăsate pe mijlocul drumului vor fi ridicate de Poliție la restart.",
            "Folosește tasta G pentru a deschide meniul rapid de interacțiune cu jucătorii din jur.",
            "Pentru raportări folosește comanda /report. Un admin te va prelua imediat."
        ];
        
        let tipIdx = 0;
        const tipTextEl = document.getElementById('tip-text');

        setInterval(() => {
            tipTextEl.style.opacity = 0;
            setTimeout(() => {
                tipIdx = (tipIdx + 1) % tips.length;
                tipTextEl.innerText = tips[tipIdx];
                tipTextEl.style.opacity = 1;
            }, 400); // Tranzitie de opacitate
        }, 6000); // Schimbam la 6 secunde

        // --- INTEGRARE REALA FIVEM ---
        /*
        let count = 0;
        let thisCount = 0;
        
        const handlers = {
            startInitFunctionOrder(data) { count = data.count; },
            initFunctionInvoking(data) { 
                document.getElementById('loading-task').innerText = data.name + "..."; 
            },
            initFunctionInvoked(data) {
                thisCount++;
                let pct = (thisCount / count) * 100;
                
                // Update Numere
                document.getElementById('loading-pct').innerHTML = Math.floor(pct) + '<span>%</span>';
                
                // Update Turometru
                let segmentsToLight = Math.floor((pct / 100) * TOTAL_SEGMENTS);
                document.querySelectorAll('.rpm-segment').forEach((seg, idx) => {
                    if (idx < segmentsToLight) {
                        seg.classList.add('active');
                        if (seg.classList.contains('is-redline')) seg.classList.add('redline');
                    }
                });
            }
        };

        window.addEventListener('message', (e) => {
            (handlers[e.data.eventName] || function(){})(e.data);
        });
        */
    </script>
</body>
</html>
