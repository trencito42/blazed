<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XODO RP - 24/7 Store UI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.4);
            --accent: #00ffcc; /* Cyan Neon */
            --danger: #ff3366; 
            
            --bg-panel: rgba(10, 10, 15, 0.9);
            --border-glass: rgba(255, 255, 255, 0.1);
            
            --shadow-text: 0 4px 10px rgba(0, 0, 0, 0.9);
            --shadow-glow: 0 0 25px rgba(0, 255, 204, 0.4);
            
            --transition-snappy: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #050508; overflow: hidden; user-select: none;
        }

        /* Atmosfera de 24/7 Store (LTD / 24/7) */
        .bg-cam {
            position: absolute; inset: 0; z-index: 0;
            background: url('https://images.unsplash.com/photo-1579308003444-245f7c3dc890?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover; filter: brightness(0.3) contrast(1.1) blur(2px);
        }
        
        .vignette {
            position: absolute; inset: 0; z-index: 1;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.85) 100%);
            pointer-events: none;
        }

        /* ==========================================================
           MASTER UI WRAPPER
           ========================================================== */
        .ui-layer {
            position: absolute; inset: 0; z-index: 10;
            padding: 80px 100px; display: flex; justify-content: center; gap: 40px;
            transform: skewX(-5deg); 
        }

        .section-title {
            font-size: 13px; font-weight: 900; color: var(--accent);
            text-transform: uppercase; letter-spacing: 4px;
            margin-bottom: 25px; text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            display: flex; align-items: center; gap: 10px;
        }
        .section-title::before { content: ''; width: 24px; height: 2px; background: var(--accent); }

        /* ==========================================================
           1. STANGA: CATEGORII
           ========================================================== */
        .categories-panel { display: flex; flex-direction: column; width: 280px; }
        
        .cat-list { display: flex; flex-direction: column; gap: 5px; }

        .cat-item {
            font-size: 20px; font-weight: 900; font-style: italic; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            padding: 15px 0; border-left: 0px solid transparent; text-shadow: var(--shadow-text);
            transition: all 0.2s var(--transition-snappy);
            display: flex; align-items: center; gap: 15px;
        }
        .cat-item i { font-size: 26px; transform: skewX(5deg); transition: 0.2s; }
        .cat-item span { transform: skewX(5deg); }
        
        .cat-item:hover, .cat-item.active {
            color: var(--text-main); padding-left: 20px; border-left: 6px solid var(--accent);
            background: linear-gradient(90deg, rgba(0,255,204,0.1) 0%, transparent 100%);
        }
        .cat-item.active { color: var(--accent); }
        .cat-item.active i { color: var(--accent); filter: drop-shadow(0 0 5px var(--accent)); }

        /* ==========================================================
           2. MIJLOC: GRID ITEMA
           ========================================================== */
        .items-panel {
            display: flex; flex-direction: column; width: 450px;
            background: var(--bg-panel); border: 2px solid var(--border-glass);
            padding: 30px; backdrop-filter: blur(10px);
        }

        .items-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
            align-content: start; max-height: 60vh; overflow-y: auto; padding-right: 10px;
        }
        .items-grid::-webkit-scrollbar { width: 4px; }
        .items-grid::-webkit-scrollbar-thumb { background: var(--border-glass); }

        .store-item {
            aspect-ratio: 1; background: rgba(0,0,0,0.6); border: 1px solid var(--border-glass);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; transition: 0.2s;
        }
        
        .store-item:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
        
        .store-item.active {
            border-color: var(--accent); background: rgba(0,255,204,0.1);
            box-shadow: inset 0 0 20px rgba(0,255,204,0.2); transform: scale(1.05); z-index: 2;
        }

        .si-icon { font-size: 38px; color: var(--text-main); transform: skewX(5deg); transition: 0.2s; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8)); }
        .store-item.active .si-icon { color: var(--accent); filter: drop-shadow(0 0 10px var(--accent)); }

        .si-name { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-top: 8px; transform: skewX(5deg); text-align: center; }
        .store-item.active .si-name { color: var(--text-main); }
        
        .si-price { position: absolute; top: 5px; right: 8px; font-size: 11px; font-weight: 900; color: var(--success); transform: skewX(5deg); font-family: 'Montserrat'; }

        /* ==========================================================
           3. DREAPTA: CHECKOUT & BULK BUY
           ========================================================== */
        .checkout-panel {
            display: flex; flex-direction: column; width: 380px;
            background: var(--bg-panel); border: 2px solid var(--border-glass);
            padding: 30px; backdrop-filter: blur(10px);
        }

        /* Item Preview in Checkout */
        .preview-box {
            display: flex; gap: 20px; align-items: center; padding-bottom: 25px;
            border-bottom: 1px solid var(--border-glass); margin-bottom: 25px;
        }
        .preview-icon {
            width: 80px; height: 80px; background: rgba(0,0,0,0.6); border: 1px solid var(--accent);
            display: flex; align-items: center; justify-content: center; font-size: 42px; color: var(--accent);
            box-shadow: inset 0 0 20px rgba(0,255,204,0.2);
        }
        .preview-icon i { transform: skewX(5deg); }
        .preview-info { display: flex; flex-direction: column; }
        .preview-name { font-size: 24px; font-weight: 900; font-style: italic; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px; transform: skewX(5deg); }
        .preview-price { font-size: 16px; font-weight: 800; color: var(--success); transform: skewX(5deg); margin-top: 5px; }
        .preview-weight { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; transform: skewX(5deg); margin-top: 2px;}

        /* SLIDER MECANIC CANTITATE (BULK BUY) */
        .qty-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 40px; }
        .qty-header { display: flex; justify-content: space-between; align-items: flex-end; font-size: 12px; font-weight: 900; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }
        
        .qty-controls {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.6); border: 1px solid var(--border-glass);
            padding: 5px; height: 60px;
        }
        
        .qty-btn {
            background: rgba(255,255,255,0.05); border: 1px solid transparent; color: var(--text-main);
            font-size: 20px; cursor: pointer; transition: 0.2s; width: 40px; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        .qty-btn:hover { background: var(--accent); color: #000; box-shadow: var(--shadow-glow); }
        .qty-btn:active { transform: scale(0.9); }

        .qty-value {
            font-family: 'Montserrat'; font-size: 36px; font-weight: 900; font-style: italic;
            color: var(--text-main); font-variant-numeric: tabular-nums; text-shadow: var(--shadow-text);
            display: flex; align-items: baseline; gap: 5px; transform: skewX(5deg); width: 80px; justify-content: center;
        }
        
        /* Butoane rapide de cantitate */
        .qty-quick { display: flex; gap: 10px; margin-top: 10px; }
        .quick-btn {
            flex: 1; background: rgba(0,0,0,0.6); border: 1px solid var(--border-glass); color: var(--text-muted);
            padding: 8px 0; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        .quick-btn:hover { border-color: var(--text-main); color: var(--text-main); }

        /* Total & Cumparare */
        .checkout-summary { margin-top: auto; display: flex; flex-direction: column; gap: 5px; }
        .total-label { font-size: 14px; font-weight: 800; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        .total-value { font-size: 56px; font-weight: 900; font-style: italic; color: var(--text-main); line-height: 0.9; letter-spacing: -2px; font-variant-numeric: tabular-nums; text-shadow: var(--shadow-text); display: flex; align-items: center; gap: 10px;}
        .total-value span { font-size: 24px; color: var(--success); }

        .btn-hold {
            margin-top: 25px; position: relative; width: 100%; height: 55px;
            background: rgba(0,0,0,0.8); border: 2px solid var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 900; font-style: italic; color: var(--text-main);
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer; overflow: hidden; transition: 0.2s;
        }
        .btn-hold:hover { border-color: var(--accent); color: var(--accent); text-shadow: var(--shadow-glow); }
        .btn-progress { position: absolute; top: 0; left: 0; bottom: 0; width: 0%; background: var(--accent); z-index: 0; transition: width 0.1s linear; }
        .btn-text { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; }
        .key-hint { background: var(--text-main); color: #000; padding: 2px 8px; border-radius: 3px; font-size: 14px; font-style: normal; transform: skewX(5deg); font-weight: 900; }

        /* Cand nu e nimic selectat */
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; opacity: 0.5; transform: skewX(5deg);}
        .empty-state i { font-size: 64px; margin-bottom: 15px; }
        .empty-state span { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; text-align: center;}
    </style>
</head>
<body>

    <div class="bg-cam"></div>
    <div class="vignette"></div>

    <div class="ui-layer">
        
        <!-- STANGA: CATEGORII -->
        <div class="categories-panel">
            <div class="section-title">24/7 Supermarket</div>
            <div class="cat-list">
                <div class="cat-item active" onclick="loadCategory('food', this)"><i class="ph-fill ph-hamburger"></i> <span>Alimente</span></div>
                <div class="cat-item" onclick="loadCategory('drinks', this)"><i class="ph-fill ph-coffee"></i> <span>Băuturi</span></div>
                <div class="cat-item" onclick="loadCategory('electronics', this)"><i class="ph-fill ph-device-mobile"></i> <span>Electronice</span></div>
                <div class="cat-item" onclick="loadCategory('tools', this)"><i class="ph-fill ph-wrench"></i> <span>Utilitare</span></div>
            </div>
        </div>

        <!-- MIJLOC: GRID ITEME -->
        <div class="items-panel">
            <div class="section-title" style="color: var(--text-muted); border: none; margin-bottom: 15px;">Rafturi Produse</div>
            <div class="items-grid" id="store-grid">
                <!-- Generat JS -->
            </div>
        </div>

        <!-- DREAPTA: CHECKOUT -->
        <div class="checkout-panel">
            
            <div id="checkout-content" style="display: none; flex-direction: column; height: 100%;">
                
                <div class="preview-box">
                    <div class="preview-icon"><i id="co-icon" class="ph-fill ph-hamburger"></i></div>
                    <div class="preview-info">
                        <div class="preview-name" id="co-name">Sandwich</div>
                        <div class="preview-price" id="co-price">$5 / buc</div>
                        <div class="preview-weight" id="co-weight">Greutate: 0.2kg</div>
                    </div>
                </div>

                <div class="qty-group">
                    <div class="qty-header"><span>Cantitate</span> <span style="color: var(--accent);">Bulk Buy</span></div>
                    
                    <!-- Control Mecanic Cantiatate -->
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty(-1)"><i class="ph-bold ph-minus"></i></button>
                        <div class="qty-value" id="co-qty">1</div>
                        <button class="qty-btn" onclick="changeQty(1)"><i class="ph-bold ph-plus"></i></button>
                    </div>
                    
                    <!-- Butoane Rapide -->
                    <div class="qty-quick">
                        <button class="quick-btn" onclick="setQty(5)">+5</button>
                        <button class="quick-btn" onclick="setQty(10)">+10</button>
                        <button class="quick-btn" onclick="setQty(50)">+50</button>
                        <button class="quick-btn" onclick="setQty(100)">MAX</button>
                    </div>
                </div>

                <div class="checkout-summary">
                    <span class="total-label">Total de Plată</span>
                    <div class="total-value"><span>$</span><div id="co-total">5</div></div>

                    <div class="btn-hold" id="btn-buy" onmousedown="startBuy()" onmouseup="stopBuy()" onmouseleave="stopBuy()">
                        <div class="btn-progress" id="buy-progress"></div>
                        <div class="btn-text">
                            <span class="key-hint">ENTER</span> Plătește
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div id="checkout-empty" class="empty-state">
                <i class="ph-fill ph-shopping-cart"></i>
                <span>Selectează un produs<br>de pe raft</span>
            </div>

        </div>
    </div>

    <script>
        // ==========================================================
        // BAZA DE DATE MAGAZIN
        // ==========================================================
        const storeData = {
            food: [
                { id: 'f1', name: 'Sandwich', icon: 'ph-hamburger', price: 5, weight: 0.2 },
                { id: 'f2', name: 'Gogoașă', icon: 'ph-cookie', price: 2, weight: 0.1 },
                { id: 'f3', name: 'Pizza Slice', icon: 'ph-pizza', price: 8, weight: 0.3 }
            ],
            drinks: [
                { id: 'd1', name: 'Apă Plată', icon: 'ph-drop', price: 3, weight: 0.5 },
                { id: 'd2', name: 'Cafea', icon: 'ph-coffee', price: 4, weight: 0.2 },
                { id: 'd3', name: 'Cola', icon: 'ph-brandy', price: 5, weight: 0.4 },
                { id: 'd4', name: 'Energizant', icon: 'ph-lightning', price: 10, weight: 0.3 }
            ],
            electronics: [
                { id: 'e1', name: 'Telefon', icon: 'ph-device-mobile', price: 1200, weight: 0.3 },
                { id: 'e2', name: 'Radio', icon: 'ph-radio', price: 250, weight: 0.5 },
                { id: 'e3', name: 'Cameră', icon: 'ph-camera', price: 500, weight: 0.8 }
            ],
            tools: [
                { id: 't1', name: 'Trusă Scule', icon: 'ph-wrench', price: 150, weight: 4.5 },
                { id: 't2', name: 'Bandaj', icon: 'ph-first-aid', price: 25, weight: 0.1 },
                { id: 't3', name: 'Lanterna', icon: 'ph-flashlight', price: 40, weight: 0.4 },
                { id: 't4', name: 'Rucsac', icon: 'ph-backpack', price: 300, weight: 1.0 }
            ]
        };

        let selectedItem = null;
        let currentQty = 1;
        const maxQty = 100; // Limita hardcodata pentru demo

        // ==========================================================
        // LOGICA DE BAZA
        // ==========================================================
        function loadCategory(catId, btnEl) {
            // Update UI Active Category
            document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
            btnEl.classList.add('active');

            // Render Items
            const grid = document.getElementById('store-grid');
            grid.innerHTML = '';
            
            storeData[catId].forEach(item => {
                const div = document.createElement('div');
                div.className = 'store-item';
                div.setAttribute('data-id', item.id);
                div.onclick = () => selectItem(item, div);
                
                div.innerHTML = `
                    <div class="si-price">$${item.price}</div>
                    <i class="ph-fill ${item.icon} si-icon"></i>
                    <div class="si-name">${item.name}</div>
                `;
                grid.appendChild(div);
            });

            // Reset Checkout
            selectedItem = null;
            document.getElementById('checkout-content').style.display = 'none';
            document.getElementById('checkout-empty').style.display = 'flex';
        }

        function selectItem(item, el) {
            // Update Grid Selection
            document.querySelectorAll('.store-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');

            selectedItem = item;
            currentQty = 1;

            // Show & Populate Checkout
            document.getElementById('checkout-empty').style.display = 'none';
            document.getElementById('checkout-content').style.display = 'flex';

            document.getElementById('co-icon').className = `ph-fill ${item.icon}`;
            document.getElementById('co-name').innerText = item.name;
            document.getElementById('co-price').innerText = `$${item.price} / buc`;
            document.getElementById('co-weight').innerText = `Greutate: ${item.weight}kg`;

            updateCheckoutUI();
        }

        // ==========================================================
        // BULK BUY CONTROLS
        // ==========================================================
        function changeQty(amount) {
            if (!selectedItem) return;
            currentQty += amount;
            if (currentQty < 1) currentQty = 1;
            if (currentQty > maxQty) currentQty = maxQty;
            updateCheckoutUI();
        }

        function setQty(amount) {
            if (!selectedItem) return;
            currentQty = amount;
            if (currentQty > maxQty) currentQty = maxQty;
            updateCheckoutUI();
        }

        function updateCheckoutUI() {
            document.getElementById('co-qty').innerText = currentQty;
            
            // Formatare Total cu virgule (ex: 12,000)
            const total = selectedItem.price * currentQty;
            document.getElementById('co-total').innerText = total.toLocaleString('en-US');
        }

        // Initialize primul tab
        loadCategory('food', document.querySelector('.cat-item.active'));


        // ==========================================================
        // HOLD TO BUY MECHANIC
        // ==========================================================
        let buyTimer;
        let buyProgress = 0;
        const buyBar = document.getElementById('buy-progress');
        const buyBtnText = document.querySelector('#btn-buy .btn-text');

        function updateBuy() {
            buyProgress += 2.5; // Viteza
            buyBar.style.width = buyProgress + '%';
            
            if (buyProgress >= 100) {
                buyBar.style.width = '100%';
                buyBtnText.innerHTML = "Plată Confirmată!";
                buyBtnText.style.color = '#000';
                document.getElementById('btn-buy').style.background = 'var(--accent)';
                
                // Trimitem request catre LUA
                // window.postMessage({ action: 'buyItem', itemId: selectedItem.id, quantity: currentQty, total: selectedItem.price * currentQty });
                
                setTimeout(() => {
                    // Reset vizual dupa 1.5s
                    buyProgress = 0;
                    buyBar.style.width = '0%';
                    buyBtnText.innerHTML = '<span class="key-hint">ENTER</span> Plătește';
                    buyBtnText.style.color = 'var(--text-main)';
                    document.getElementById('btn-buy').style.background = 'rgba(0,0,0,0.8)';
                    currentQty = 1;
                    updateCheckoutUI();
                }, 1500);
            } else {
                buyTimer = requestAnimationFrame(updateBuy);
            }
        }

        function startBuy() {
            if(!selectedItem) return;
            cancelAnimationFrame(buyTimer);
            buyTimer = requestAnimationFrame(updateBuy);
        }

        function stopBuy() {
            cancelAnimationFrame(buyTimer);
            if (buyProgress < 100) {
                buyProgress = 0;
                buyBar.style.width = '0%';
            }
        }

        // Tastatura pt Confirmare Rapida
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && selectedItem && !e.repeat) startBuy();
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') stopBuy();
        });

    </script>
</body>
</html>
