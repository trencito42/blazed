<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XODO RP - Top Center Quest Tracker</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            
            --theme-info: #00ffcc; 
            --theme-exam: #f59e0b; 
            --theme-job: #3b82f6;  
            --theme-heist: #ff3366;
            --success: #10b981;    
            
            --bg-glass: rgba(10, 10, 15, 0.85);
            --border-glass: rgba(255, 255, 255, 0.1);
            
            --shadow-text: 0 4px 10px rgba(0, 0, 0, 0.9);
            --transition-snappy: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background: url('https://placehold.co/1920x1080/1a1a24/1a1a24?text=FiveM+Gameplay') no-repeat center center;
            background-size: cover; overflow: hidden; user-select: none;
        }

        .dev-tools {
            position: absolute; bottom: 30px; left: 30px; z-index: 100;
            display: flex; gap: 10px; background: rgba(0,0,0,0.8);
            padding: 15px; border-radius: 8px; border: 1px solid var(--border-glass);
        }
        .dev-btn {
            background: transparent; color: var(--text-main); border: 1px solid var(--text-muted);
            padding: 8px 12px; border-radius: 4px; font-family: inherit; font-weight: 700;
            cursor: pointer; transition: 0.2s; font-size: 11px; text-transform: uppercase;
        }
        .dev-btn:hover { background: var(--text-main); color: #000; }

        /* --- QUEST TRACKER WIDGET (MIJLOC SUS) --- */
        .quest-wrapper {
            position: absolute; top: 40px; left: 50%;
            z-index: 20; display: flex; flex-direction: column;
            width: 420px; opacity: 0; pointer-events: none; 
            /* Transformare pentru centrare si animatie de drop-down */
            transform: translateX(-50%) translateY(-40px) skewX(-5deg);
            transition: all 0.5s var(--transition-snappy);
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.6));
        }

        .quest-wrapper.active { 
            opacity: 1; pointer-events: all; 
            transform: translateX(-50%) translateY(0) skewX(-5deg); 
        }

        .quest-wrapper[data-theme="info"] { --current-theme: var(--theme-info); }
        .quest-wrapper[data-theme="exam"] { --current-theme: var(--theme-exam); }
        .quest-wrapper[data-theme="job"] { --current-theme: var(--theme-job); }
        .quest-wrapper[data-theme="heist"] { --current-theme: var(--theme-heist); }

        .quest-header {
            display: flex; justify-content: space-between; align-items: flex-end; width: 100%;
            border-bottom: 3px solid var(--current-theme); padding-bottom: 8px; margin-bottom: 10px;
        }

        .quest-title {
            font-size: 15px; font-weight: 900; color: var(--current-theme);
            text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; gap: 8px;
            text-shadow: var(--shadow-text);
        }

        .quest-step-count {
            font-size: 11px; font-weight: 900; color: var(--text-main);
            background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 4px; letter-spacing: 1px;
        }

        .quest-content {
            background: var(--bg-glass); backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass); border-top: none;
            padding: 20px 25px; width: 100%; display: flex; flex-direction: column; gap: 15px;
            box-sizing: border-box; transition: all 0.4s ease;
        }

        .quest-instruction {
            font-size: 22px; font-weight: 900; font-style: italic; color: var(--text-main);
            text-transform: uppercase; letter-spacing: 1px; line-height: 1.1; text-shadow: var(--shadow-text);
        }

        /* Containerul care se ascunde cand e minimizat */
        .quest-details-collapsible {
            display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.4s var(--transition-snappy);
        }
        .quest-wrapper.minimized .quest-details-collapsible { grid-template-rows: 0fr; }
        
        .quest-desc-inner { overflow: hidden; }
        .quest-desc { font-size: 13px; font-weight: 600; color: var(--text-muted); line-height: 1.5; margin-bottom: 15px; }

        /* --- ACTION PROMPT --- */
        .action-box {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0, 0, 0, 0.6); border-left: 3px solid var(--current-theme); 
            padding: 12px 15px; transition: all 0.3s ease;
        }

        .action-box.success {
            border-left-color: var(--success); background: rgba(16, 185, 129, 0.15);
            box-shadow: inset 150px 0 50px -50px rgba(16, 185, 129, 0.2);
        }

        .action-text {
            font-size: 12px; font-weight: 700; color: var(--text-main);
            text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px;
        }

        /* --- TASTA FIZICA --- */
        .key-cap {
            display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px;
            background: var(--text-main); color: #000; padding: 0 8px; border-radius: 4px; 
            font-size: 14px; font-weight: 900; font-style: normal;
            box-shadow: 0 3px 0 #9ca3af; transform: skewX(5deg); transition: all 0.1s ease;
        }

        .key-cap.pressed {
            transform: skewX(5deg) translateY(3px); box-shadow: 0 0 0 transparent;
            background: var(--success); color: #fff;
        }

        .success-icon { display: none; font-size: 20px; color: var(--success); animation: popIn 0.3s var(--transition-snappy); }
        .action-box.success .success-icon { display: block; }
        .action-box.success .action-text { color: var(--success); }

        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        /* --- BARA DE PROGRES --- */
        .progress-container { display: flex; gap: 4px; width: 100%; margin-top: 5px; }
        .prog-segment { flex: 1; height: 4px; background: rgba(0,0,0,0.8); transition: all 0.3s; }
        .prog-segment.active { background: var(--current-theme); box-shadow: 0 0 8px var(--current-theme); }
        .prog-segment.completed { background: var(--success); box-shadow: 0 0 8px var(--success); }

    </style>
</head>
<body>

    <div class="dev-tools">
        <button class="dev-btn" onclick="startQuest('exam')">Examen Auto</button>
        <button class="dev-btn" onclick="startQuest('job')">Curierat XODO</button>
        <button class="dev-btn" onclick="startQuest('heist')">Spargere Seif</button>
        <span style="color: var(--text-muted); font-size: 11px; margin-left: 10px; align-self: center;">Apasă tastele menționate pe ecran.</span>
    </div>

    <!-- QUEST TRACKER -->
    <div class="quest-wrapper" id="quest-wrapper">
        <div class="quest-header">
            <div class="quest-title" id="q-title"><i class="ph-bold ph-steering-wheel"></i> Școala Auto</div>
            <div class="quest-step-count" id="q-step">1/3</div>
        </div>

        <div class="quest-content">
            <div class="quest-instruction" id="q-inst">Pornește Motorul</div>
            
            <div class="quest-details-collapsible">
                <div class="quest-desc-inner">
                    <div class="quest-desc" id="q-desc">Așază-te confortabil și asigură-te că vehiculul este scos din viteză înainte de a cupla contactul.</div>
                </div>
            </div>

            <div class="action-box" id="q-action-box">
                <div class="action-text" id="q-action-text">
                    Apasă <div class="key-cap" id="q-key">2</div>
                </div>
                <i class="ph-bold ph-check-circle success-icon"></i>
            </div>

            <div class="progress-container" id="q-progress"></div>
        </div>
    </div>

    <script>
        const quests = {
            'exam': {
                theme: 'exam', icon: 'ph-steering-wheel', title: 'Examen Practic',
                steps: [
                    { inst: 'Pornește Motorul', desc: 'Introdu cheia în contact și pornește motorul vehiculului pentru a începe proba.', key: '2' },
                    { inst: 'Pune Centura', desc: 'Conform legislației rutiere, purtarea centurii de siguranță este obligatorie. Riști descalificarea.', key: 'k' },
                    { inst: 'Aprinde Farurile', desc: 'Vizibilitatea este redusă. Aprinde faza scurtă pentru a evita penalizările din partea examinatorului.', key: 'h' }
                ]
            },
            'job': {
                theme: 'job', icon: 'ph-package', title: 'Curierat XODO',
                steps: [
                    { inst: 'Preia Coletul', desc: 'Mergi la depozitul principal și scanează codul de bare pentru a înregistra preluarea pachetului.', key: 'e' },
                    { inst: 'Deschide Duba', desc: 'Deblochează portierele din spate ale dubei pentru a putea stivui marfa.', key: 'l' },
                    { inst: 'Livrează la Client', desc: 'Ai ajuns la destinație. Apasă soneria și predă pachetul destinatarului.', key: 'e' }
                ]
            },
            'heist': {
                theme: 'heist', icon: 'ph-skull', title: 'Jaf la Fleeca',
                steps: [
                    { inst: 'Dezactivează Camerele', desc: 'Găsește panoul electric din spate și taie firele camerelor de supraveghere.', key: 'e' },
                    { inst: 'Plantează Termitul', desc: 'Pune termitul pe balamalele seifului și dă-te înapoi ca să nu iei foc.', key: 'g' },
                    { inst: 'Strânge Banii', desc: 'Sparge cutiile de valori. Mișcă-te repede, poliția a fost alertată!', key: 'f' }
                ]
            }
        };

        let currentQuest = null;
        let currentStepIndex = 0;
        let minimizeTimer = null;
        let isProcessing = false;

        const wrapper = document.getElementById('quest-wrapper');
        const actionBox = document.getElementById('q-action-box');
        const keyCap = document.getElementById('q-key');
        const actionText = document.getElementById('q-action-text');

        function startQuest(type) {
            currentQuest = quests[type];
            currentStepIndex = 0;
            
            wrapper.setAttribute('data-theme', currentQuest.theme);
            document.getElementById('q-title').innerHTML = `<i class="ph-bold ${currentQuest.icon}"></i> ${currentQuest.title}`;
            
            // Build Progress Bar
            const progContainer = document.getElementById('q-progress');
            progContainer.innerHTML = '';
            currentQuest.steps.forEach(() => {
                progContainer.appendChild(document.createElement('div')).className = 'prog-segment';
            });

            wrapper.classList.add('active');
            renderStep();
        }

        function renderStep() {
            if(!currentQuest) return;
            const step = currentQuest.steps[currentStepIndex];
            isProcessing = false;

            // Resetează UI-ul la starea extinsă
            wrapper.classList.remove('minimized');
            actionBox.classList.remove('success');
            actionBox.style.display = step.key ? 'flex' : 'none';
            keyCap.classList.remove('pressed');

            // Update Texte
            document.getElementById('q-step').innerText = `${currentStepIndex + 1}/${currentQuest.steps.length}`;
            document.getElementById('q-inst').innerText = step.inst;
            document.getElementById('q-desc').innerText = step.desc;
            
            if (step.key) {
                actionText.innerHTML = `Apasă <div class="key-cap" id="q-key">${step.key.toUpperCase()}</div>`;
            }

            // Update Progress Bar
            document.querySelectorAll('.prog-segment').forEach((seg, idx) => {
                seg.className = 'prog-segment';
                if (idx < currentStepIndex) seg.classList.add('completed');
                if (idx === currentStepIndex) seg.classList.add('active');
            });

            // Auto-Minimize după 5 secunde
            clearTimeout(minimizeTimer);
            minimizeTimer = setTimeout(() => {
                wrapper.classList.add('minimized');
            }, 5000);
        }

        function completeStep() {
            if (isProcessing) return;
            isProcessing = true;
            clearTimeout(minimizeTimer);
            
            // Extinde înapoi dacă era minimizat pentru a arăta animația de succes
            wrapper.classList.remove('minimized'); 

            const currentKeyEl = document.getElementById('q-key');
            const keyChar = currentKeyEl ? currentKeyEl.innerText : '';

            // Animație de Succes
            if (currentKeyEl) currentKeyEl.classList.add('pressed');
            actionBox.classList.add('success');
            actionText.innerHTML = `<div class="key-cap pressed">${keyChar}</div> Acțiune Confirmată`;

            // Treci la pasul următor după delay
            setTimeout(() => {
                if (currentStepIndex < currentQuest.steps.length - 1) {
                    currentStepIndex++;
                    renderStep();
                } else {
                    finishQuest();
                }
            }, 1200);
        }

        function finishQuest() {
            document.getElementById('q-inst').innerText = "Misiune Îndeplinită!";
            actionBox.style.display = 'none';
            document.querySelectorAll('.prog-segment').forEach(s => s.classList.replace('active', 'completed'));
            
            // Ascunde tot UI-ul după 2 secunde
            setTimeout(() => {
                wrapper.classList.remove('active');
            }, 2000);
        }

        // Ascultător pentru taste
        document.addEventListener('keydown', (e) => {
            if (!currentQuest || isProcessing || currentStepIndex >= currentQuest.steps.length) return;
            
            const expectedKey = currentQuest.steps[currentStepIndex].key;
            if (expectedKey && e.key.toLowerCase() === expectedKey.toLowerCase()) {
                completeStep();
            }
        });
        
    </script>
</body>
</html>
