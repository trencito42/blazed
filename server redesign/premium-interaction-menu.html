<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forza Target Menu - Dynamic Roles</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --accent: #00ffcc; 
            --danger: #ff3366;
            --warning: #f59e0b;
            
            --shadow-text: 0 4px 10px rgba(0, 0, 0, 0.9);
            --shadow-glow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background: url('https://images.unsplash.com/photo-1605806616949-1e87b487bc2a?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            overflow: hidden; user-select: none;
        }

        .overlay { position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.7) 100%); z-index: 0; }

        /* ==========================================================
           0. PANOU DE TEST (Doar pentru browser)
           ========================================================== */
        .dev-tools {
            position: absolute; top: 30px; left: 30px; z-index: 100;
            display: flex; gap: 10px; background: rgba(0,0,0,0.5);
            padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .dev-btn {
            background: transparent; color: var(--text-main); border: 1px solid var(--text-muted);
            padding: 6px 12px; border-radius: 4px; font-family: inherit; font-weight: 700;
            cursor: pointer; transition: 0.2s; font-size: 12px; text-transform: uppercase;
        }
        .dev-btn:hover, .dev-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        /* ==========================================================
           1. WORLD-SPACE TOOLTIP
           ========================================================== */
        .world-target {
            position: absolute; top: 45%; left: 50%; z-index: 10;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            transform: translate(-50%, -50%) skewX(-5deg); filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.8));
            animation: floatTarget 3s ease-in-out infinite; transition: opacity 0.3s ease, transform 0.3s ease;
        }
        @keyframes floatTarget { 0% { margin-top: 0px; } 50% { margin-top: -12px; } 100% { margin-top: 0px; } }
        .world-target.hidden { opacity: 0; transform: translate(-50%, -50%) skewX(-5deg) scale(0.8); pointer-events: none; }

        .target-name { font-size: 28px; font-weight: 900; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px; text-shadow: var(--shadow-text); }
        .target-action { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }

        .key-circle-wrapper { position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
        .key-letter { position: absolute; font-size: 18px; font-weight: 900; color: var(--text-main); transform: skewX(5deg); text-shadow: var(--shadow-text); }
        .key-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .circle-track { fill: none; stroke: rgba(0, 0, 0, 0.6); stroke-width: 4; }
        .circle-progress { fill: none; stroke: var(--accent); stroke-width: 4; stroke-dasharray: 100; stroke-dashoffset: 100; stroke-linecap: round; filter: drop-shadow(0 0 4px var(--accent)); transition: stroke-dashoffset 0.1s linear; }

        /* ==========================================================
           2. SCREEN-SPACE MENU
           ========================================================== */
        .screen-menu {
            position: absolute; top: 50%; right: 80px; z-index: 20;
            display: flex; flex-direction: column; align-items: flex-end; gap: 15px;
            transform: translateY(-50%) skewX(-5deg) translateX(50px); filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.8));
            opacity: 0; pointer-events: none; transition: opacity 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .screen-menu.active { opacity: 1; pointer-events: all; transform: translateY(-50%) skewX(-5deg) translateX(0); }

        .menu-title {
            font-size: 11px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: 3px;
            margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); display: flex; align-items: center; gap: 8px;
            justify-content: flex-end; width: 100%;
        }
        .menu-title::after { content: ''; width: 20px; height: 2px; background: var(--accent); }

        .menu-item {
            display: flex; align-items: center; justify-content: flex-end; gap: 15px;
            font-size: 22px; font-style: italic; font-weight: 800; color: var(--text-main);
            text-transform: uppercase; cursor: pointer; padding-right: 0; border-right: 0px solid transparent;
            text-shadow: var(--shadow-text); transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .menu-item:hover {
            color: var(--accent); padding-right: 15px; border-right: 4px solid var(--accent);
            text-shadow: var(--shadow-glow), 0 2px 5px rgba(0,0,0,0.9); transform: translateX(-10px);
        }

        /* Hover special pe optiuni periculoase */
        .menu-item.danger:hover {
            color: var(--danger); border-right-color: var(--danger);
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.5), 0 2px 5px rgba(0,0,0,0.9);
        }

        .menu-item i { font-size: 24px; transform: skewX(5deg); }
        .menu-item span { transform: skewX(5deg); } 

        .hint { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.4); z-index: 100; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="overlay"></div>
    <div class="hint">ȚINE APĂSAT CLICK PENTRU A SIMULA TASTA "G"</div>

    <!-- BUTOANE DEV PENTRU TESTARE ROLURI -->
    <div class="dev-tools">
        <button class="dev-btn active" onclick="setRole('civil')">Civil</button>
        <button class="dev-btn" onclick="setRole('politist')">Polițist</button>
        <button class="dev-btn" onclick="setRole('mafie')">Mafie</button>
        <button class="dev-btn" onclick="setRole('admin')">Admin</button>
    </div>

    <!-- WORLD-SPACE TOOLTIP -->
    <div class="world-target" id="world-tooltip">
        <div class="target-name" id="target-name-display">Alexandru M. (14)</div>
        <div class="target-action">
            <span>Hold</span>
            <div class="key-circle-wrapper">
                <span class="key-letter">G</span>
                <svg class="key-svg" viewBox="0 0 36 36">
                    <circle class="circle-track" cx="18" cy="18" r="16"></circle>
                    <circle class="circle-progress" id="progress-ring" cx="18" cy="18" r="16"></circle>
                </svg>
            </div>
            <span>To Interact</span>
        </div>
    </div>

    <!-- SCREEN-SPACE MENU (Generat dinamic) -->
    <div class="screen-menu" id="screen-menu">
        <div class="menu-title" id="menu-title">Acțiuni Jucător</div>
        <div id="menu-items-container" style="display: flex; flex-direction: column; gap: 15px; align-items: flex-end;">
            <!-- Elementele vor fi generate din JS -->
        </div>
    </div>

    <script>
        // ==========================================================
        // STRUCTURA DE DATE PENTRU MENIURI
        // Aici definesti tot ce poate face fiecare job
        // ==========================================================
        const targetActions = {
            'civil': [
                { id: 'view_id', label: 'Cere Buletin', icon: 'ph-identification-card' },
                { id: 'give_money', label: 'Oferă Bani', icon: 'ph-wallet' },
                { id: 'give_item', label: 'Oferă Obiect', icon: 'ph-package' }
            ],
            'politist': [
                { id: 'cuff', label: 'Încătușează / Descătușează', icon: 'ph-handcuffs' },
                { id: 'search', label: 'Percheziționează', icon: 'ph-magnifying-glass' },
                { id: 'drag', label: 'Târăște', icon: 'ph-user-switch' },
                { id: 'put_in_vehicle', label: 'Bagă în mașină', icon: 'ph-car-profile' },
                { id: 'fine', label: 'Amendează', icon: 'ph-receipt' }
            ],
            'mafie': [
                { id: 'rob', label: 'Jefuiește', icon: 'ph-skull', isDanger: true },
                { id: 'tie', label: 'Leagă Mâinile', icon: 'ph-link' },
                { id: 'take_hostage', label: 'Ia Ostatic', icon: 'ph-crosshair', isDanger: true },
                { id: 'put_in_trunk', label: 'Bagă în portbagaj', icon: 'ph-car' }
            ],
            'admin': [
                { id: 'heal', label: 'Vindecă (Heal)', icon: 'ph-heartbeat', color: 'var(--accent)' },
                { id: 'spectate', label: 'Urmărește (Spec)', icon: 'ph-eye' },
                { id: 'kick', label: 'Dă Kick', icon: 'ph-user-minus', isDanger: true },
                { id: 'ban', label: 'Banează (Ban)', icon: 'ph-warning-circle', isDanger: true }
            ]
        };

        let currentRole = 'civil';

        // Functia care genereaza HTML-ul meniului in functie de rol
        function buildMenu() {
            const container = document.getElementById('menu-items-container');
            container.innerHTML = ''; // Curatam meniul vechi

            const actions = targetActions[currentRole];

            // Adaugam butoanele specifice rolului
            actions.forEach(action => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `menu-item ${action.isDanger ? 'danger' : ''}`;
                if (action.color) itemDiv.style.color = action.color;
                
                itemDiv.innerHTML = `
                    <span>${action.label}</span>
                    <i class="ph-bold ${action.icon}"></i>
                `;
                
                // Actiunea la click (trimisa catre LUA)
                itemDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    console.log(`[TRIGGERED ACTION]: ${action.id}`);
                    // window.postMessage({ action: 'triggerTarget', type: action.id }); // Integrare LUA
                    closeMenu();
                });

                container.appendChild(itemDiv);
            });

            // Adaugam intotdeauna butonul de Inchidere la final
            const closeDiv = document.createElement('div');
            closeDiv.className = 'menu-item';
            closeDiv.style.marginTop = '10px';
            closeDiv.style.fontSize = '16px';
            closeDiv.style.color = 'var(--text-muted)';
            closeDiv.innerHTML = `
                <span>Închide</span>
                <i class="ph-bold ph-x"></i>
            `;
            closeDiv.addEventListener('click', (e) => {
                e.stopPropagation();
                closeMenu();
            });
            container.appendChild(closeDiv);
        }

        // Doar pentru butoanele de test din browser
        function setRole(roleName) {
            currentRole = roleName;
            
            // Update styling butoane test
            document.querySelectorAll('.dev-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            // Reconstruim meniul in spate
            buildMenu();
            
            // Schimbam titlul subtil ca sa vedem clar
            document.getElementById('menu-title').innerText = `Acțiuni - ${roleName.toUpperCase()}`;
        }

        // ==========================================================
        // LOGICA DE HOLD SI ANIMATIE (Identica, perfect functionala)
        // ==========================================================
        const progressRing = document.getElementById('progress-ring');
        const worldTooltip = document.getElementById('world-tooltip');
        const screenMenu = document.getElementById('screen-menu');
        
        const circumference = 2 * Math.PI * 16;
        progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
        progressRing.style.strokeDashoffset = circumference;

        let holdTimer;
        let progress = 0;
        let isHolding = false;
        let menuOpen = false;

        const HOLD_DURATION = 800; // ms
        const FPS = 60;
        const step = 100 / (HOLD_DURATION / (1000 / FPS)); 

        function updateProgress() {
            if (!isHolding || menuOpen) return;
            
            progress += step;
            const offset = circumference - (progress / 100) * circumference;
            progressRing.style.strokeDashoffset = offset;

            if (progress >= 100) {
                progress = 100;
                progressRing.style.strokeDashoffset = 0;
                openMenu();
            } else {
                requestAnimationFrame(updateProgress);
            }
        }

        function startHold() {
            if (menuOpen) return;
            isHolding = true;
            requestAnimationFrame(updateProgress);
        }

        function stopHold() {
            if (menuOpen) return;
            isHolding = false;
            progress = 0;
            progressRing.style.strokeDashoffset = circumference;
        }

        function openMenu() {
            menuOpen = true;
            isHolding = false;
            worldTooltip.classList.add('hidden');
            screenMenu.classList.add('active');
        }

        function closeMenu() {
            menuOpen = false;
            progress = 0;
            progressRing.style.strokeDashoffset = circumference;
            screenMenu.classList.remove('active');
            worldTooltip.classList.remove('hidden');
        }

        // Initialize Menu la incarcare
        buildMenu();

        // Bind Controls
        document.addEventListener('keydown', (e) => { if ((e.key === 'g' || e.key === 'G') && !e.repeat) startHold(); });
        document.addEventListener('keyup', (e) => { if (e.key === 'g' || e.key === 'G') stopHold(); });
        document.addEventListener('mousedown', startHold);
        document.addEventListener('mouseup', stopHold);
        document.addEventListener('mouseleave', stopHold);

    </script>
</body>
</html>
