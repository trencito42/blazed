<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isolated Wanted System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,900;1,800;1,900&display=swap');

        :root {
            --text-main: #ffffff;
            --danger: #ff3366; /* Roșu neon pentru Wanted */
        }

        body {
            background-color: #1a1a24; /* Fundal test */
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
            padding: 50px;
        }

        /* Anti-skew global pentru text (daca folosesti panouri inclinate gen Forza) */
        .unskew {
            transform: skewX(5deg); 
        }

        /* --- WANTED PANEL CSS --- */
        .wanted-panel {
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
            gap: 6px;
            padding-right: 20px;
            /* Containerul trebuie sa aiba skew negativ daca vrei design-ul Forza */
            transform: skewX(-5deg); 
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.8));
            
            /* Animatii de ascundere/afisare */
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0; 
            pointer-events: none;
            /* Pleaca putin din dreapta pt efect de intrare */
            transform: skewX(-5deg) translateX(30px); 
        }

        .wanted-panel.active {
            opacity: 1; 
            transform: skewX(-5deg) translateX(0);
        }

        .wanted-title {
            font-size: 11px; 
            font-weight: 900; 
            color: var(--danger);
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
        }

        .wanted-row {
            display: flex; 
            align-items: center; 
            gap: 15px;
        }

        .wanted-stars {
            display: flex; 
            gap: 5px;
        }

        .star {
            width: 24px; 
            height: 24px;
            fill: rgba(0, 0, 0, 0.6);
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 1.5;
            transition: all 0.3s ease;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
        }

        .star.active {
            fill: var(--danger);
            stroke: var(--danger);
            filter: drop-shadow(0 0 8px var(--danger));
            animation: pulseStar 1.5s infinite alternate;
        }

        @keyframes pulseStar {
            0% { filter: drop-shadow(0 0 6px var(--danger)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 16px var(--danger)); transform: scale(1.1); }
        }

        .wanted-timer {
            display: flex; 
            align-items: center; 
            gap: 6px;
            font-size: 15px; 
            font-weight: 900; 
            font-style: italic; 
            color: var(--text-main);
            background: rgba(0,0,0,0.5); 
            padding: 4px 10px; 
            border-radius: 4px;
            border: 1px solid rgba(255, 51, 102, 0.3);
            box-shadow: inset 0 0 10px rgba(255, 51, 102, 0.1);
        }

        .wanted-timer svg {
            width: 14px; 
            height: 14px; 
            stroke: var(--danger); 
            stroke-width: 2.5; 
            fill: none;
        }
    </style>
</head>
<body>

    <!-- HTML STRUCTURA WANTED -->
    <div class="wanted-panel" id="ui-wanted-panel">
        <div class="unskew wanted-title">NIVEL URMARIRE</div>
        <div class="unskew wanted-row">
            <div class="wanted-stars" id="ui-wanted-stars">
                <!-- 5 Stele -->
                <svg class="star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                <svg class="star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                <svg class="star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                <svg class="star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                <svg class="star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </div>
            <div class="wanted-timer">
                <!-- Iconita Ceas -->
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                <span id="ui-wanted-time">15:00</span>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGICA -->
    <script>
        // --- 1. SIMULARE PENTRU PREVIEW BROWSER ---
        let currentWantedStars = 0;
        let wantedSecondsLeft = 15 * 60; // 15 minute

        setInterval(() => {
            // Aleatoriu declansam wanted in demo o data la cateva secunde
            if(Math.random() > 0.85) {
                currentWantedStars = currentWantedStars === 0 ? Math.floor(Math.random() * 5) + 1 : 0;
                wantedSecondsLeft = 15 * 60; // Reset timer la 15:00
            }

            const wantedPanel = document.getElementById('ui-wanted-panel');
            const stars = document.querySelectorAll('#ui-wanted-stars .star');
            
            if (currentWantedStars > 0) {
                wantedPanel.classList.add('active'); // Afisam panoul
                
                // Aplicam clasa "active" pe numarul de stele curent
                stars.forEach((star, index) => {
                    if (index < currentWantedStars) star.classList.add('active');
                    else star.classList.remove('active');
                });

                // Scadem timpul in fiecare secunda pt animatie
                wantedSecondsLeft--;
                if (wantedSecondsLeft < 0) wantedSecondsLeft = 0;
                
                // Formatam MM:SS
                let m = Math.floor(wantedSecondsLeft / 60).toString().padStart(2, '0');
                let s = (wantedSecondsLeft % 60).toString().padStart(2, '0');
                document.getElementById('ui-wanted-time').innerText = `${m}:${s}`;
            } else {
                // Ascundem panoul daca nu avem stele
                wantedPanel.classList.remove('active');
            }
        }, 1000);

</body>
</html>
