<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forza Style HUD - Full Screen</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,900;1,800;1,900&display=swap');

        :root {
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.75);
            
            --accent: #00ffcc; /* Cyan Neon */
            --warning: #ffcc00; /* Galben pt Job/Task */
            --armor: #3b82f6;  /* Blue */
            --health: #10b981; /* Green */
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background: url('https://placehold.co/1920x1080/4a90e2/1a1a24?text=Gameplay+Background') no-repeat center center;
            background-size: cover;
            overflow: hidden; user-select: none;
        }

        /* Anti-skew global pentru text */
        .unskew {
            transform: skewX(5deg);
        }

        /* =========================================
           TOP RIGHT HUD (Timp, Bani, Vitals)
        ========================================= */
        #hud-top-right {
            position: absolute;
            top: 30px;
            right: 40px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 20px;
            transform: skewX(-5deg);
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.8));
        }

        .top-row { display: flex; align-items: flex-start; gap: 20px; }

        .voice-container { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 5px; }
        .voice-icon {
            width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); transition: all 0.2s ease;
        }
        .voice-icon svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round;}

        .voice-icon.talking {
            color: #000; background: var(--accent); border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent), 0 0 30px rgba(0, 255, 204, 0.5);
            animation: pulseTalk 1s infinite alternate;
        }
        @keyframes pulseTalk {
            0% { transform: scale(1); box-shadow: 0 0 10px var(--accent); }
            100% { transform: scale(1.1); box-shadow: 0 0 25px var(--accent); }
        }

        .voice-range {
            font-size: 10px; font-weight: 900; color: var(--text-main);
            text-transform: uppercase; letter-spacing: 1.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
        .voice-icon.talking + .voice-range {
            color: var(--accent); text-shadow: 0 0 8px rgba(0, 255, 204, 0.6), 0 2px 4px rgba(0,0,0,0.9);
        }

        .time-date-container {
            display: flex; flex-direction: column; align-items: flex-end;
            border-right: 4px solid var(--accent); padding-right: 15px;
        }
        .time-display {
            font-size: 48px; font-style: italic; font-weight: 900; color: var(--text-main);
            letter-spacing: 1px; line-height: 1; text-shadow: 0 3px 12px rgba(0,0,0,0.6);
        }
        .date-display {
            font-size: 14px; font-weight: 800; color: var(--accent); text-transform: uppercase;
            letter-spacing: 2px; margin-top: 5px; text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }

        .finance-panel { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; padding-right: 20px; }
        .money-row {
            display: flex; align-items: center; justify-content: flex-end; gap: 12px;
            font-style: italic; font-weight: 900; font-size: 20px; text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
        .money-row svg { width: 18px; height: 18px; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
        .money-cash { color: var(--accent); }
        .money-cash svg { stroke: var(--accent); }
        .money-bank { color: var(--text-main); font-size: 16px; }
        .money-bank svg { stroke: var(--text-muted); }

        .vitals-panel { display: flex; flex-direction: column; gap: 8px; width: 180px; margin-top: 10px; }
        .vital-row { display: flex; align-items: center; gap: 10px; }
        .vital-icon { color: var(--text-main); width: 14px; height: 14px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.9)); }
        .vital-icon svg { width: 100%; height: 100%; fill: currentColor; }
        .vital-bar-bg { flex: 1; height: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,0,0,0.8); border-radius: 3px; overflow: hidden; }
        .vital-bar-fill { height: 100%; transition: width 0.3s ease; }
        .fill-health { background: var(--health); box-shadow: 0 0 10px var(--health); }
        .fill-armor { background: var(--armor); box-shadow: 0 0 10px var(--armor); }

        /* =========================================
           BOTTOM LEFT HUD (Locatie, Job, Task)
        ========================================= */
        #hud-bottom-left {
            position: absolute;
            bottom: 40px;
            left: 40px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 25px;
            transform: skewX(-5deg);
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.8));
        }

        /* Task / Job Panel */
        .task-panel {
            display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
            border-left: 4px solid var(--warning); padding-left: 15px; margin-bottom: 10px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0; transform: translateX(-20px); pointer-events: none;
        }

        .task-panel.active {
            opacity: 1; transform: translateX(0);
        }

        .task-title {
            font-size: 12px; font-weight: 900; color: var(--warning);
            text-transform: uppercase; letter-spacing: 1.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            display: flex; align-items: center; gap: 6px;
        }
        .task-title svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round;}

        .task-desc {
            font-size: 18px; font-style: italic; font-weight: 800; color: var(--text-main);
            text-shadow: 0 2px 6px rgba(0,0,0,0.9); text-transform: uppercase;
        }

        .task-progress {
            display: flex; align-items: center; gap: 12px; width: 220px; margin-top: 2px;
        }
        .task-progress span {
            font-size: 13px; font-weight: 900; color: var(--text-main); text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
        .task-bar-bg {
            flex: 1; height: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,0,0,0.8); border-radius: 3px; overflow: hidden;
        }
        .task-bar-fill {
            height: 100%; background: var(--warning); box-shadow: 0 0 10px var(--warning); transition: width 0.3s ease;
        }

        /* Location Panel */
        .location-panel {
            display: flex; flex-direction: column; align-items: flex-start;
            border-left: 4px solid var(--text-main); padding-left: 15px;
        }
        
        .loc-street {
            font-size: 36px; font-style: italic; font-weight: 900; color: var(--text-main);
            letter-spacing: 1px; line-height: 1; text-shadow: 0 3px 10px rgba(0,0,0,0.8);
            text-transform: uppercase;
        }
        .loc-zone {
            font-size: 14px; font-weight: 800; color: var(--accent); text-transform: uppercase;
            letter-spacing: 2px; margin-top: 5px; text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            display: flex; align-items: center; gap: 6px;
        }
        .loc-zone svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round;}

    </style>
</head>
<body>

    <!-- TOP RIGHT: Stats Generale -->
    <div id="hud-top-right">
        <div class="top-row">
            <div class="unskew voice-container">
                <div class="voice-icon" id="ui-voice-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </div>
                <div class="voice-range" id="ui-voice-range">Normal</div>
            </div>
            
            <div class="unskew time-date-container">
                <div class="time-display" id="ui-time">02:57</div>
                <div class="date-display" id="ui-date">09 SEP 2026</div>
            </div>
        </div>

        <div class="finance-panel">
            <div class="unskew money-row money-cash">
                <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>
                <span id="ui-cash">$10,037,020</span>
            </div>
            <div class="unskew money-row money-bank">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span id="ui-bank">$1,989,058,986</span>
            </div>

            <div class="unskew vitals-panel">
                <div class="vital-row">
                    <div class="vital-icon" style="color: var(--health);">
                        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    </div>
                    <div class="vital-bar-bg"><div class="vital-bar-fill fill-health" id="ui-health" style="width: 100%;"></div></div>
                </div>
                <div class="vital-row">
                    <div class="vital-icon" style="color: var(--armor);">
                        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    </div>
                    <div class="vital-bar-bg"><div class="vital-bar-fill fill-armor" id="ui-armor" style="width: 65%;"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM LEFT: Locatie & Job Tracker -->
    <div id="hud-bottom-left">
        
        <!-- Panou Job/Task (Ascuns by default, activat din JS) -->
        <div class="unskew task-panel" id="ui-task-panel">
            <div class="task-title" id="ui-task-title">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                JOB ACTIV: LIVRATOR
            </div>
            <div class="task-desc" id="ui-task-desc">Livrează pachetul la destinație</div>
            <div class="task-progress">
                <div class="task-bar-bg"><div class="task-bar-fill" id="ui-task-bar" style="width: 40%;"></div></div>
                <span id="ui-task-progress-text">2 / 5</span>
            </div>
        </div>

        <!-- Panou Locatie -->
        <div class="unskew location-panel">
            <div class="loc-street" id="ui-street">ECLIPSE BLVD</div>
            <div class="loc-zone" id="ui-zone">
                <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                VINEWOOD WEST
            </div>
        </div>

    </div>

    <script>
        // --- SIMULARE PENTRU PREVIEW BROWSER ---
        
        // Update Ceas & Data in timp real
        setInterval(() => {
            const now = new Date();
            let hours = now.getHours().toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('ui-time').innerText = `${hours}:${minutes}`;

            let options = { day: '2-digit', month: 'short', year: 'numeric' };
            let dateStr = now.toLocaleDateString('ro-RO', options).toUpperCase().replace('.', '');
            document.getElementById('ui-date').innerText = dateStr;
        }, 1000);

        // Simulare efect vorbire
        setInterval(() => {
            const isTalking = Math.random() > 0.5;
            const micEl = document.getElementById('ui-voice-icon');
            if(isTalking) micEl.classList.add('talking');
            else micEl.classList.remove('talking');
        }, 2000);

        // --- SIMULARE SCHIMBARE STARE TASK-URI (Doar pt Preview) ---
        let simState = 0;
        setInterval(() => {
            simState++;
            const panel = document.getElementById('ui-task-panel');
            const title = document.getElementById('ui-task-title');
            const desc = document.getElementById('ui-task-desc');
            const bar = document.getElementById('ui-task-bar');
            const progText = document.getElementById('ui-task-progress-text');

            if (simState % 3 === 1) {
                // Starea 1: Job Livrator
                panel.classList.add('active');
                title.innerHTML = `<svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg> JOB ACTIV: CURRER`;
                desc.innerText = "Du duba la punctul de colectare";
                bar.style.width = "60%";
                progText.innerText = "3 / 5";
                document.getElementById('ui-street').innerText = "ROUTE 68";
                document.getElementById('ui-zone').innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg> GRAND SENORA DESERT`;

            } else if (simState % 3 === 2) {
                // Starea 2: Examen Auto (DMV)
                panel.classList.add('active');
                title.innerHTML = `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> EXAMEN AUTO PRACTIC`;
                title.style.color = "var(--danger)";
                desc.innerText = "Nu depăși limita de viteză (80 KM/H)";
                bar.style.background = "var(--danger)";
                bar.style.boxShadow = "0 0 10px var(--danger)";
                bar.style.width = "10%";
                progText.innerText = "Erori: 1 / 4";

            } else {
                // Starea 3: Ascuns (Fara job)
                panel.classList.remove('active');
                title.style.color = "var(--warning)"; // reset
                bar.style.background = "var(--warning)"; // reset
                bar.style.boxShadow = "0 0 10px var(--warning)"; // reset
                document.getElementById('ui-street').innerText = "ECLIPSE BLVD";
                document.getElementById('ui-zone').innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg> VINEWOOD WEST`;
            }
        }, 5000);

        // --- INTEGRARE LUA (Cum il folosesti in joc) ---
        /*
        window.addEventListener('message', (event) => {
            const data = event.data;

            // UPDATE LOCATIE
            if (data.action === "updateLocation") {
                document.getElementById('ui-street').innerText = data.street;
                document.getElementById('ui-zone').innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg> ${data.zone}`;
            }

            // UPDATE TASK / JOB
            if (data.action === "showTask") {
                document.getElementById('ui-task-panel').classList.add('active');
                document.getElementById('ui-task-title').innerHTML = `${data.iconSVG} ${data.title}`;
                document.getElementById('ui-task-desc').innerText = data.desc;
                document.getElementById('ui-task-bar').style.width = data.progressPct + '%';
                document.getElementById('ui-task-progress-text').innerText = data.progressText;
            }

            // ASCUNDE TASK
            if (data.action === "hideTask") {
                document.getElementById('ui-task-panel').classList.remove('active');
            }
        });
        */
    </script>
</body>
</html>
