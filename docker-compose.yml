services:
  fivem:
    build:
      context: ./docker/fivem
    restart: unless-stopped
    network_mode: host
    environment:
      LICENSE_KEY: ${LICENSE_KEY:?set LICENSE_KEY}
      NO_DEFAULT_CONFIG: "1"
      NO_LICENSE_KEY: "1"
      TXADMIN_ENABLE: ${TXADMIN_ENABLE:-0}
      MARIADB_HOST: ${MARIADB_HOST:-127.0.0.1}
      MARIADB_USER: ${MARIADB_USER:-rpgblipmade}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-rpgblipmade}
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK:-}
      TEST_AGENT_ENABLED: ${TEST_AGENT_ENABLED:-false}
      TEST_AGENT_TOKEN: ${TEST_AGENT_TOKEN:-}
      TEST_AGENT_NUIDEBUG: ${TEST_AGENT_NUIDEBUG:-0}
    volumes:
      - ./config:/config-mount:ro
      - ./resources:/config/resources-custom:ro
      - ./sql:/migrations:ro
      - fivem_txdata:/txData
      - fivem_config:/config
    tty: true
    stdin_open: true

volumes:
  fivem_txdata:
  fivem_config:
