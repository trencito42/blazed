<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="quiz.css">
    <title>License Theory</title>
</head>
<body>
    <div id="quiz" class="hidden">
        <div class="quiz-shell">
            <header class="quiz-header">
                <div>
                    <h1 id="quiz-title">Theory Exam</h1>
                    <p id="quiz-progress" class="quiz-progress">Question 1 / 4</p>
                </div>
                <button id="quiz-close" type="button" aria-label="Close">✕</button>
            </header>
            <p id="quiz-intro" class="quiz-intro"></p>
            <div id="quiz-question" class="quiz-question"></div>
            <div id="quiz-options" class="quiz-options"></div>
            <footer class="quiz-footer">
                <button type="button" id="quiz-prev" class="quiz-btn ghost hidden">Back</button>
                <button type="button" id="quiz-next" class="quiz-btn primary hidden">Next</button>
                <button type="button" id="quiz-submit" class="quiz-btn primary hidden">Submit exam</button>
            </footer>
        </div>
    </div>
    <script src="quiz.js"></script>
</body>
</html>
