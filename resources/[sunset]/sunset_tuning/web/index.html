<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunset ECU Tuning</title>
    <script>
        window.prompt = function() { return null; };
        window.alert = function() {};
        window.confirm = function() { return false; };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="vignette"></div>

        <header class="tune-topbar">
            <div class="tune-brand">
                <span class="tune-brand__title">SUNSET ECU</span>
                <span class="tune-brand__sub" id="shopLabel">ECU Bay</span>
            </div>
            <div class="tune-meta">
                <span id="plateLabel">—</span>
                <span id="drivetrainLabel">PETROL</span>
                <span id="ecuStatus" class="ecu-status ecu-status--stock">FACTORY MAP</span>
            </div>
        </header>

        <div class="ui-layer tune-ui-layer">
            <div class="ui-col ui-col--left tuning-wrapper">
                <div class="tune-categories" id="tuneCategories">
                    <div class="section-title">Components</div>
                </div>
                <div class="tune-parts-col">
                    <div class="section-title section-title--muted" id="tunePartsTitle">Engine</div>
                    <div class="item-list" id="tunePartsList"></div>
                    <div class="tune-detail" id="tuneDetail"></div>
                </div>
            </div>

            <div class="ui-col ui-col--right stats-panel">
                <div class="section-title" style="margin-bottom: 15px;">Performance Impact</div>

                <div class="stat-row">
                    <div class="stat-header">
                        <span>Acceleration</span>
                        <span class="stat-val" id="tune-accel-val">—</span>
                    </div>
                    <div class="stat-track" id="stat-accel-tune"></div>
                </div>
                <div class="stat-row">
                    <div class="stat-header">
                        <span>Top Speed</span>
                        <span class="stat-val" id="tune-speed-val">—</span>
                    </div>
                    <div class="stat-track" id="stat-speed-tune"></div>
                </div>
                <div class="stat-row">
                    <div class="stat-header">
                        <span>Handling</span>
                        <span class="stat-val" id="tune-hand-val">—</span>
                    </div>
                    <div class="stat-track" id="stat-hand-tune"></div>
                </div>

                <div class="price-display">
                    <span class="price-label">Install Cost</span>
                    <span class="price-value" id="tune-install-cost">$0</span>
                </div>

                <button type="button" class="btn-install" id="btnSave">Install Part (ENTER)</button>
                <button type="button" class="btn-cancel" id="btnCancel">Cancel (ESC)</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
