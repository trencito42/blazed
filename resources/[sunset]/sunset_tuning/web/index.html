<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunset ECU Tuning</title>
    <script>
        window.prompt = function() { return null; };
        window.alert = function() {};
        window.confirm = function() { return false; };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div id="app" class="hidden">
        <div class="vignette"></div>

        <div class="ui-layer">
            <div class="tuning-wrapper">
                <div class="tune-categories" id="tuneCategories"></div>
                <div class="tune-parts-col">
                    <div class="section-title section-title--muted" id="tunePartsTitle">Engine Upgrades</div>
                    <div class="item-list" id="tunePartsList"></div>
                    <div class="tune-detail" id="tuneDetail"></div>
                </div>
            </div>

            <div class="stats-panel">
                <div class="section-title section-title--compact">Performance Impact</div>

                <div class="stat-row">
                    <div class="stat-header">
                        <span>Acceleration</span>
                        <span class="stat-val" id="tune-accel-val">—</span>
                    </div>
                    <div class="stat-track" id="stat-accel-tune"></div>
                </div>
                <div class="stat-row">
                    <div class="stat-header">
                        <span>Top Speed</span>
                        <span class="stat-val" id="tune-speed-val">—</span>
                    </div>
                    <div class="stat-track" id="stat-speed-tune"></div>
                </div>
                <div class="stat-row">
                    <div class="stat-header">
                        <span>Handling</span>
                        <span class="stat-val" id="tune-hand-val">—</span>
                    </div>
                    <div class="stat-track" id="stat-hand-tune"></div>
                </div>

                <div class="price-display">
                    <span class="price-label" id="tune-price-label">Install Cost</span>
                    <span class="price-value" id="tune-install-cost">0</span>
                </div>

                <button type="button" class="btn-install" id="btnSave">
                    <span class="btn-install__text"><span class="key-hint">ENTER</span> Apply Changes</span>
                </button>
            </div>
        </div>

        <p class="tune-footer-hint">
            Press ESC to close · <span id="shopLabel">ECU Bay</span> · <span id="plateLabel">—</span>
        </p>

        <span id="ecuStatus" class="sr-only" aria-hidden="true">FACTORY MAP</span>
        <span id="drivetrainLabel" class="sr-only" aria-hidden="true">PETROL</span>
        <button type="button" id="btnCancel" class="sr-only" aria-hidden="true" tabindex="-1"></button>
    </div>
    <script src="app.js?v=2"></script>
</body>
</html>
