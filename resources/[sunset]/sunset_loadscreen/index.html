<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XODO RP — Loading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=13">
</head>
<body onselectstart="return false" ondragstart="return false">
    <div class="loadscreen" id="loadscreen">
        <div class="bg-container"></div>
        <div class="vignette"></div>

        <div class="hud-wrapper">
            <div class="brand-container">
                <div class="brand-title">XODO <span>RP</span></div>
                <div class="brand-subtitle">Est. 2026 &middot; Los Santos</div>
            </div>

            <div class="bottom-area">
                <div class="tips-container">
                    <div class="tips-header">Server Tips</div>
                    <div class="tips-text" id="tip-text">
                        Stay in character at all times. Press G to open the quick interaction menu.
                    </div>
                </div>

                <div class="speedometer-loading">
                    <div class="massive-pct" id="loading-pct">0<span>%</span></div>
                    <div class="loading-status-text">
                        <span id="loading-task">Initializing session...</span>
                        <span class="file-count" id="loading-files"></span>
                    </div>
                    <div class="rpm-bar-container" id="rpm-bar"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js?v=12"></script>
</body>
</html>
