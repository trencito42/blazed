<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunsetMP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body onselectstart="return false" ondragstart="return false">
    <div class="loadscreen" id="loadscreen">
        <div class="loadscreen__bg"></div>
        <div class="loadscreen__vignette"></div>
        <div class="loadscreen__scanlines"></div>

        <div class="loadscreen__brand">
            <div class="loadscreen__logo" role="img" aria-label="Sunset MP"></div>
            <p class="loadscreen__tag">Welcome to Los Santos</p>
        </div>

        <div class="loadscreen__stage">
            <div class="loadscreen__info">
                <div>
                    <div class="loadscreen__title">Loading assets</div>
                    <div class="loadscreen__status" id="status-text">Connecting to server instance...</div>
                </div>
                <div class="loadscreen__percent" id="progress-percent">0%</div>
            </div>
            <div class="loadscreen__bar">
                <div class="loadscreen__bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
