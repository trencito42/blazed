<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blaze.mp — UI Shell</title>
    <link rel="stylesheet" href="css/base.css?v=2">
    <link rel="stylesheet" href="css/variables.css?v=2">
    <link rel="stylesheet" href="css/_cef_overrides.css?v=2">
    <link rel="stylesheet" href="css/components.css?v=2">
    <link rel="stylesheet" href="css/animations.css?v=2">
</head>
<body>
    <!-- Dynamic UI Mount Point: Modules are loaded and injected on demand -->
    <div id="ui-root"></div>

    <!-- Global Persistent Shell Containers -->
    <div id="notifications-root" class="notifications-container" aria-live="polite"></div>
    <div id="progress-root" class="progress-container hidden">
        <div class="progress-card">
            <div class="progress-label" id="progress-label">Action in progress...</div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/module-loader.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</body>
</html>
