<div id="properties" class="overlay-panel overlay-panel--peek hidden">
        <div class="overlay-panel__box overlay-panel__box--wide house-browser org-property-shell">
            <!-- VIEW 1: BROWSE ALL / OWNED PROPERTIES -->
            <div id="properties-view-browser" class="properties-view">
                <header class="house-browser__head">
                    <div class="house-browser__brand">
                        <span class="panel-kicker">
                            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 21h18M5 21V7l8-4v18M13 9h4v12M9 9h1M9 13h1M9 17h1M15 13h1M15 17h1"/></svg>
                            PROPERTY TERMINAL
                        </span>
                        <h2>Residences</h2>
                        <p>Buy, rent, enter or manage your properties across Los Santos</p>
                    </div>
                    <div class="house-browser__head-right">
                        <div class="house-search-box">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                            <input type="text" id="properties-search" placeholder="Search address, name or #ID..." autocomplete="off" spellcheck="false">
                        </div>
                        <button type="button" class="house-browser__close" id="properties-close"><span class="menu-keycap">ESC</span> <span>CLOSE</span></button>
                    </div>
                </header>
                <div class="house-filters" id="house-filters">
                    <button type="button" class="house-filter-btn is-active" data-filter="all">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                        <span>All Properties</span>
                    </button>
                    <button type="button" class="house-filter-btn" data-filter="for-sale">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5"/></svg>
                        <span>For Sale</span>
                    </button>
                    <button type="button" class="house-filter-btn" data-filter="owned">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        <span>Owned</span>
                    </button>
                    <button type="button" class="house-filter-btn" data-filter="rent">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        <span>Rentable</span>
                    </button>
                </div>
                <ul class="panel-list org-property-list" id="properties-list"></ul>
            </div>

            <!-- VIEW 2: DEDICATED PROPERTY MANAGEMENT VIEW -->
            <div id="properties-view-manage" class="properties-view hidden">
                <header class="house-browser__head house-browser__head--manage">
                    <div class="house-browser__brand">
                        <button type="button" class="prop-manage-back-btn" id="properties-manage-back">
                            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                            <span>BACK TO RESIDENCES</span>
                        </button>
                        <h2 id="prop-manage-title">Residence Management</h2>
                    </div>
                    <div class="house-browser__head-right">
                        <button type="button" class="house-browser__close" id="properties-manage-close"><span class="menu-keycap">ESC</span> <span>CLOSE</span></button>
                    </div>
                </header>
                <div class="house-manage-scroll" id="properties-manage-content"></div>
            </div>
        </div>
    </div>
