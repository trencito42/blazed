<div id="trade-invite-modal" class="trade-notif-wrapper hidden" aria-hidden="true">
        <div class="trade-notif-box">
            <div class="tn-desc" id="trade-invite-desc">Jucătorul <span>Player</span> (ID: 0)<br>vrea să inițieze un Trade.</div>
            <div class="tn-actions">
                <div class="btn-hold accept" id="trade-invite-accept" role="button" tabindex="0">
                    <div class="bh-progress" id="trade-invite-accept-hold"></div>
                    <div class="bh-text"><span class="key">Y</span> Acceptă</div>
                </div>
                <div class="btn-hold decline" id="trade-invite-decline" role="button" tabindex="0">
                    <div class="bh-progress" id="trade-invite-decline-hold"></div>
                    <div class="bh-text"><span class="key">N</span> Refuză</div>
                </div>
            </div>
        </div>
    </div>

    <!-- SECURE TRADE MODAL -->
    <div id="trade-window" class="trade-modal hidden" aria-hidden="true">
        <div class="trade-container">
            <div class="tp-panel" id="trade-panel-mine">
                <div class="tp-header">
                    <div class="tp-title"><i class="ph-bold ph-arrow-circle-up" style="color:#00ffcc;"></i> Your Offer</div>
                    <div class="tp-status" id="trade-status-mine">Editing...</div>
                </div>
                <div class="tp-content" id="trade-my-offer"></div>
                <div class="tp-actions">
                    <button type="button" class="btn-add-trade" id="trade-add-offer"><i class="ph-bold ph-plus"></i> Add from Inventory / Properties</button>
                    <button type="button" class="btn-lock-trade" id="trade-lock-mine"><i class="ph-bold ph-lock-key"></i> Lock Offer</button>
                    <button type="button" class="btn-cancel-trade" id="trade-cancel-mine"><i class="ph-bold ph-x"></i> Cancel Trade</button>
                </div>
            </div>
            <div class="tp-panel" id="trade-panel-their">
                <div class="tp-header">
                    <div class="tp-title"><i class="ph-bold ph-arrow-circle-down" style="color:rgba(255,255,255,0.4);"></i> <span id="trade-their-title">Player</span></div>
                    <div class="tp-status" id="trade-status-their">Editing</div>
                </div>
                <div class="tp-content" id="trade-their-offer"></div>
                <div class="tp-actions">
                    <div class="tp-waiting">Waiting for the other player<br>to confirm their offer.</div>
                </div>
            </div>
        </div>
    </div>
    <div id="trade-countdown-screen" class="countdown-overlay hidden" aria-hidden="true">
        <div class="cd-number" id="trade-cd-timer">5</div>
        <div class="cd-text">Finalizing Trade</div>
        <div class="cd-hint">Either player can cancel during the countdown.</div>
        <button type="button" class="btn-cancel-trade cd-cancel" id="trade-cd-cancel"><i class="ph-bold ph-x"></i> Cancel Trade (ESC)</button>
    </div>

    <!-- ASSET SELECTOR MODAL -->
    <div id="trade-selector-modal" class="selector-modal hidden" aria-hidden="true">
        <div class="selector-wrapper">
            <div class="sel-sidebar">
                <div class="sel-header">Choose Source</div>
                <div class="cat-list">
                    <button type="button" class="cat-item money active" data-tab="cash"><i class="ph-fill ph-currency-dollar"></i> <span>Cash</span></button>
                    <button type="button" class="cat-item" data-tab="items"><i class="ph-fill ph-backpack"></i> <span>Inventory</span></button>
                    <button type="button" class="cat-item" data-tab="vehicles"><i class="ph-fill ph-car-profile"></i> <span>Vehicles</span></button>
                    <button type="button" class="cat-item" data-tab="properties"><i class="ph-fill ph-house"></i> <span>Properties</span></button>
                    <button type="button" class="cat-item" data-tab="businesses"><i class="ph-fill ph-storefront"></i> <span>Businesses</span></button>
                </div>
            </div>
            <div class="sel-content">
                <div class="sc-header">
                    <div class="sc-title" id="trade-sc-title">Add Amount</div>
                    <div class="sc-balance" id="trade-sc-balance"><span>Available:</span> $0</div>
                </div>
                <div class="sc-body">
                    <div id="trade-tab-cash">
                        <div class="cash-terminal">
                            <div class="ct-amount"><span>$</span><div id="trade-cash-value">0</div></div>
                            <div style="font-size:11px;font-weight:800;color:rgba(255,255,255,0.4);text-transform:uppercase;">Enter the exact amount</div>
                            <div class="ct-controls">
                                <button type="button" class="ct-btn" data-cash-add="100"><span>+100</span></button>
                                <button type="button" class="ct-btn" data-cash-add="1000"><span>+1k</span></button>
                                <button type="button" class="ct-btn" data-cash-add="5000"><span>+5k</span></button>
                                <button type="button" class="ct-btn" data-cash-add="10000"><span>+10k</span></button>
                                <button type="button" class="ct-btn clear" id="trade-cash-clear"><span>Reset</span></button>
                            </div>
                        </div>
                    </div>
                    <div id="trade-tab-items" style="display:none;"><div class="asset-grid" id="trade-tab-items-grid"></div></div>
                    <div id="trade-tab-vehicles" style="display:none;"><div class="asset-grid is-list" id="trade-tab-vehicles-grid"></div></div>
                    <div id="trade-tab-properties" style="display:none;"><div class="asset-grid is-list" id="trade-tab-properties-grid"></div></div>
                    <div id="trade-tab-businesses" style="display:none;"><div class="asset-grid is-list" id="trade-tab-businesses-grid"></div></div>
                </div>
                <div class="sc-actions">
                    <button type="button" class="btn-act cancel" id="trade-selector-close">Cancel</button>
                    <button type="button" class="btn-act confirm" id="trade-selector-confirm">Add to Offer</button>
                </div>
            </div>
        </div>
    </div>
