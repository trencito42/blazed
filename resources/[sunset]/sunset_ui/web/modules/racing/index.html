<div id="racing-overlay" class="racing-overlay hidden" aria-hidden="true">
        <div class="racing-panel">
            <div class="racing-header">
                <div class="racing-header__logo">🏁</div>
                <div>
                    <div class="racing-header__title">Street Racing</div>
                    <div class="racing-header__sub">Checkpoint races — entry fee, winner takes the pot</div>
                </div>
                <button type="button" class="racing-header__close" id="racing-close" title="Close (ESC)">✕</button>
            </div>
            <div class="racing-body" id="racing-body"></div>
            <div class="racing-actions">
                <button type="button" class="racing-btn" id="racing-solo" disabled>START SOLO</button>
                <button type="button" class="racing-btn racing-btn--secondary" id="racing-join" disabled>JOIN MULTIPLAYER</button>
                <button type="button" class="racing-btn hidden" id="racing-start-multi">START RACE</button>
                <button type="button" class="racing-btn racing-btn--secondary hidden" id="racing-leave">LEAVE LOBBY</button>
            </div>
        </div>
    </div>
