<div id="ticket" class="overlay-panel hidden">
        <div class="overlay-panel__box">
            <h2>Issue Citation</h2>
            <label class="field"><span>Target ID</span><input type="number" id="ticket-target" min="1"></label>
            <label class="field"><span>Violation</span><select id="ticket-violation"></select></label>
            <label class="field"><span>Amount ($)</span><input type="number" id="ticket-amount" min="1" value="250" readonly></label>
            <label class="field"><span>Reason</span><input type="text" id="ticket-reason" maxlength="128" readonly></label>
            <div class="btn-row">
                <button type="button" class="btn btn--primary" id="ticket-issue">ISSUE CITATION</button>
            </div>
            <button type="button" class="panel-close" id="ticket-close">Close</button>
        </div>
    </div>

    <!-- TICKET RECEIVE (civilian pay/refuse) -->
    <div id="ticket-receive" class="overlay-panel hidden">
        <div class="overlay-panel__box ticket-receive">
            <div class="ticket-receive__badge">CITATION</div>
            <h2>Traffic Citation</h2>
            <p class="ticket-receive__officer" id="ticket-receive-officer">Issued by Officer —</p>
            <div class="ticket-receive__amount" id="ticket-receive-amount">$250</div>
            <p class="ticket-receive__reason" id="ticket-receive-reason">—</p>
            <p class="ticket-receive__hint">Pay now from bank or cash. Refusing may increase wanted level.</p>
            <div class="btn-row">
                <button type="button" class="btn btn--primary" id="ticket-pay">PAY FINE</button>
                <button type="button" class="btn btn--ghost" id="ticket-refuse">REFUSE</button>
            </div>
        </div>
    </div>

    <!-- SERVICE CALLS -->
    <div id="servicecalls" class="overlay-panel hidden">
        <div class="overlay-panel__box overlay-panel__box--wide servicecalls-panel">
            <div class="servicecalls-header">
                <h2>Service Calls</h2>
                <span class="servicecalls-count" id="servicecalls-count">0 active</span>
            </div>
            <ul class="servicecalls-list" id="servicecalls-list"></ul>
            <button type="button" class="panel-close" id="servicecalls-close">Close (ESC)</button>
        </div>
    </div>

    <!-- JOBS PANEL (/jobs) -->
    <div id="jobs-panel" class="overlay-panel hidden">
        <div class="overlay-panel__box overlay-panel__box--wide jobs-menu__shell">
            <div class="jobs-menu__header">
                <h2 id="jobs-panel-title">Jobs</h2>
                <p class="jobs-menu__current">Job curent: <strong id="jobs-panel-current">Neangajat</strong></p>
                <p class="jobs-menu__session hidden" id="jobs-panel-session">Tura activa: <strong></strong></p>
            </div>
            <div class="jobs-menu__list" id="jobs-panel-list"></div>
            <div class="jobs-menu__actions">
                <button type="button" class="jobs-menu__button jobs-menu__button--primary" id="jobs-panel-work" disabled>Incepe Tura</button>
                <button type="button" class="jobs-menu__button jobs-menu__button--danger" id="jobs-panel-cancel" disabled>Anuleaza Tura</button>
                <button type="button" class="jobs-menu__button" id="jobs-panel-close">Inchide</button>
            </div>
        </div>
    </div>

    <!-- SKILLS -->
    <div id="skills" class="overlay-panel hidden">
        <div class="overlay-panel__box overlay-panel__box--wide skills-panel">
            <div class="skills-header">
                <h2>Skills</h2>
                <span class="skills-sub">Job experience &amp; progression</span>
            </div>
            <ul class="skills-list" id="skills-list"></ul>
            <button type="button" class="panel-close" id="skills-close">Close (ESC)</button>
        </div>
    </div>
