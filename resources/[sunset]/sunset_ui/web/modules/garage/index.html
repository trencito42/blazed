<div id="garage" class="overlay-panel overlay-panel--peek hidden">
        <div class="overlay-panel__box overlay-panel__box--wide overlay-panel__box--garage">
            <h2>Garage</h2>
            <p class="garage-hint">Plates are auto-assigned on ownership. Spawn, store, or GPS from here or <strong>M → Vehicle</strong>.</p>
            <ul class="panel-list" id="garage-list"></ul>
            <button type="button" class="panel-close" id="garage-close">Close</button>
        </div>
    </div>

    <!-- FLEET GARAGE — compact peek panel (robbery fence style) -->
    <div id="fleet-garage" class="fleet-garage hidden">
        <div class="fleet-garage__panel">
            <header class="fleet-garage__head">
                <span id="fleet-garage-title">Fleet Garage</span>
                <p class="fleet-garage__hint">Choose a unit — you exit the motor pool in your selection.</p>
            </header>
            <ul id="fleet-garage-list" class="fleet-garage__list menu-vehicle-grid"></ul>
            <button type="button" class="fleet-garage__leave" id="fleet-garage-close">Close</button>
        </div>
    </div>
